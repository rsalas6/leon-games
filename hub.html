<title>Juegos de León</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: valle prehistórico en 3D caricatura de fondo; título grande arriba y los juegos como íconos de app enormes en una fila centrada. Un solo look brillante, pensado para dedos pequeños. */
:root{
  --ink:#2a1f3d;
  --sun:#ffd23a;
  --sky:#7fd3ff;
  --grass:#6cc63a;
  --paper:#fffaf0;
  --display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  --body:'Nunito','Avenir Next',system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;color:var(--ink);font-family:var(--display);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none;background:var(--sky)}
a,button{touch-action:manipulation;-webkit-touch-callout:none}
img{-webkit-user-drag:none}
.world{position:fixed;inset:0;background:url(__UP__img/hub3d-wide.webp) 50% 60%/cover no-repeat var(--sky)}
@media (orientation:portrait){.world{background-image:url(__UP__img/hub3d-tall.webp)}}
.world::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(255,255,255,.28),rgba(255,255,255,0) 60%)}

.page{position:relative;height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(22px,5vh,52px);padding-top:calc(env(safe-area-inset-top,0px) + 20px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 44px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{margin:0;font-weight:400;display:flex;flex-direction:column;align-items:center;line-height:.95;text-align:center}
.t1{font-size:clamp(22px,4.6vw,40px);color:#fff;letter-spacing:.06em;-webkit-text-stroke:.09em var(--ink);paint-order:stroke fill;text-shadow:0 .1em 0 var(--ink)}
.t2{font-size:clamp(64px,14vw,138px);color:var(--sun);letter-spacing:.02em;-webkit-text-stroke:.06em var(--ink);paint-order:stroke fill;text-shadow:0 .07em 0 var(--ink),0 .14em .1em rgba(0,0,0,.25);animation:wob 3s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-2deg) scale(1.03)}}

.apps{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(24px,6vw,64px)}
.app{display:flex;flex-direction:column;align-items:center;gap:12px;text-decoration:none;color:#fff}
.icon{width:clamp(130px,24vw,250px);aspect-ratio:1;max-width:100%;border-radius:24%;overflow:hidden;background:#fff;box-shadow:0 0 0 6px #fff,0 0 0 10px var(--ink),0 14px 0 6px rgba(42,31,61,.35),0 24px 30px rgba(0,0,0,.2);animation:float 3s ease-in-out infinite;transition:transform .12s}
.app:nth-child(2) .icon{animation-delay:-1s}
.app:nth-child(3) .icon{animation-delay:-2s}
.icon img{width:100%;height:100%;display:block;object-fit:cover}
@keyframes float{50%{transform:translateY(-10px)}}
.app:active .icon{transform:scale(.92);animation:none}
.app:focus-visible{outline:none}
.app:focus-visible .icon{box-shadow:0 0 0 6px var(--sun),0 0 0 10px var(--ink)}
.name{font-size:clamp(20px,4vw,32px);letter-spacing:.04em;white-space:nowrap;-webkit-text-stroke:.12em var(--ink);paint-order:stroke fill;text-shadow:0 .12em 0 var(--ink)}

.parent{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);border:0;border-radius:99px;background:rgba(42,31,61,.72);color:#fff;font-family:var(--body);font-weight:800;font-size:13px;padding:9px 16px;cursor:pointer}
.upd{right:auto;left:max(14px,env(safe-area-inset-left,0px))}
.upd.new{background:var(--sun);color:var(--ink);box-shadow:0 0 0 3px var(--ink);animation:glow .9s ease-in-out infinite}
@keyframes glow{50%{transform:scale(1.08)}}
.sheet{position:fixed;inset:0;display:flex;align-items:flex-start;overflow-y:auto;box-sizing:border-box;padding-top:calc(env(safe-area-inset-top,0px) + 16px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(42,31,61,.55)}
.card{margin:auto;width:min(100%,440px);box-sizing:border-box;background:var(--paper);border-radius:28px;padding:24px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 0 0 5px var(--ink),0 12px 0 5px rgba(0,0,0,.2)}
.card h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0;text-align:center}
.card p{margin:0;font-family:var(--body);font-weight:700;line-height:1.45;color:#5a4d6e}
.card ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-family:var(--body);font-weight:800;line-height:1.4}
.ok{align-self:center;font-family:var(--display);font-size:22px;letter-spacing:.06em;border:0;border-radius:99px;cursor:pointer;color:#fff;background:linear-gradient(#8fe04a,#5db82a);padding:12px 36px;box-shadow:0 5px 0 #3f8a1c}
@media (orientation:landscape) and (max-height:520px){.icon{width:clamp(100px,24vh,160px)}.t2{font-size:56px}.page{gap:14px}}
@media (prefers-reduced-motion:reduce){.icon,.t2{animation:none}}
</style>

<div class="world" aria-hidden="true"></div>

<main class="page">
  <h1 aria-label="Juegos de León"><span class="t1">JUEGOS DE</span><span class="t2">LEÓN</span></h1>
  <nav class="apps">
    <a class="app" href="dino-race/" aria-label="Dino Race"><span class="icon"><img src="icons/dino-race.webp" alt=""></span><span class="name">Carrera</span></a>
    <a class="app" href="dino-puzzle/" aria-label="Rompecabezas"><span class="icon"><img src="icons/dino-puzzle.webp" alt=""></span><span class="name">Puzzle</span></a>
    <a class="app" href="dino-hole/" aria-label="Rana Glotona"><span class="icon"><img src="icons/dino-hole.webp" alt=""></span><span class="name">Rana</span></a>
  </nav>
  <button class="parent" id="helpBtn">Instalar en el iPad</button>
  <button class="parent upd" id="updBtn">Actualizar</button>
</main>

<div class="sheet" id="help" hidden>
  <div class="card">
    <h2>Instalar como app</h2>
    <p>Así los juegos se abren en pantalla completa y funcionan sin internet:</p>
    <ol>
      <li>Abre esta página en Safari.</li>
      <li>Toca Compartir (el cuadrito con la flecha).</li>
      <li>Elige "Agregar a pantalla de inicio".</li>
      <li>Abre "Juegos de León" desde el ícono.</li>
    </ol>
    <button class="ok" id="helpOk">ENTENDIDO</button>
  </div>
</div>

<script>
(() => {
  const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches;
  const help = document.getElementById('help'), btn = document.getElementById('helpBtn');
  btn.hidden = standalone;
  btn.addEventListener('click', () => { help.hidden = false; });
  document.getElementById('helpOk').addEventListener('click', () => { help.hidden = true; });
  // Actualizar: revisa si hay una versión publicada más nueva; al tocar, borra la copia guardada y descarga todo otra vez
  const upd = document.getElementById('updBtn');
  fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json()).then(d => {
    if (window.LEON_VERSION && d.v !== window.LEON_VERSION) { upd.textContent = '¡Nueva versión! Actualizar'; upd.classList.add('new'); }
  }).catch(() => {});
  upd.addEventListener('click', async () => {
    if (!navigator.onLine) { upd.textContent = 'Necesitas internet'; setTimeout(() => (upd.textContent = 'Actualizar'), 2500); return; }
    upd.textContent = 'Actualizando…'; upd.classList.remove('new');
    try {
      if ('serviceWorker' in navigator) for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
      if (window.caches) for (const k of await caches.keys()) await caches.delete(k);
    } catch (e) {}
    location.replace(location.pathname + '?v=' + Date.now());
  });
  ['gesturestart', 'gesturechange'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
  document.addEventListener('contextmenu', e => e.preventDefault());
})();
</script>
