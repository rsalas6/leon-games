<title>Juegos de León</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: valle de dinosaurios en pixel art de fondo; título pixel arriba y los juegos como cartuchos/íconos grandes en una fila centrada. Un solo look: pixel art brillante para dedos pequeños. */
@font-face{font-family:'Press Start 2P';font-style:normal;font-weight:400;font-display:block;src:url(__UP__vendor/fonts/press-start-2p-latin.woff2) format('woff2')}
:root{
  --ink:#2a1f3d;
  --sun:#ffd23a;
  --sky:#5ac8ff;
  --grass:#6cc63a;
  --paper:#fff6e0;
  --berry:#ff5d8f;
  --pix:'Press Start 2P',ui-monospace,monospace;
  --body:'Nunito','Avenir Next',system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;color:var(--ink);font-family:var(--pix);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none;background:var(--sky)}
a,button{touch-action:manipulation;-webkit-touch-callout:none}
img{-webkit-user-drag:none}
.world{position:fixed;inset:0;background:url(__UP__img/hub/bg-wide.webp) 50% 100%/cover no-repeat var(--sky);image-rendering:pixelated}
@media (orientation:portrait){.world{background-image:url(__UP__img/hub/bg-tall.webp)}}

.page{position:relative;height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(26px,6vh,56px);padding-top:calc(env(safe-area-inset-top,0px) + 20px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{margin:0;font-weight:400;display:flex;flex-direction:column;align-items:center;gap:.5em;line-height:1;text-align:center}
.t1{font-size:clamp(16px,3.6vw,30px);color:#fff;letter-spacing:.12em;text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),3px 6px 0 var(--ink)}
.t2{display:flex;gap:.08em;padding-top:.3em;font-size:clamp(44px,11vw,96px);color:var(--sun);text-shadow:.07em 0 0 var(--ink),-.07em 0 0 var(--ink),0 .07em 0 var(--ink),0 -.07em 0 var(--ink),.07em .14em 0 var(--ink),0 .2em 0 rgba(0,0,0,.2)}
.t2 span{position:relative}
.acc::before{content:'';position:absolute;left:44%;top:-.3em;width:.16em;height:.16em;background:var(--sun);box-shadow:.16em -.16em 0 var(--sun);filter:drop-shadow(.05em 0 0 var(--ink)) drop-shadow(-.05em 0 0 var(--ink)) drop-shadow(0 .05em 0 var(--ink)) drop-shadow(0 -.05em 0 var(--ink))}

.apps{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(28px,7vw,72px)}
.app{display:flex;flex-direction:column;align-items:center;gap:18px;text-decoration:none;color:#fff}
.icon{width:clamp(130px,24vw,250px);aspect-ratio:1;max-width:100%;background:#fff;padding:6px;box-sizing:border-box;box-shadow:0 -6px 0 0 var(--ink),0 6px 0 0 var(--ink),-6px 0 0 0 var(--ink),6px 0 0 0 var(--ink),inset -6px -6px 0 0 rgba(0,0,0,.12),0 16px 0 0 rgba(42,31,61,.35);animation:bob 1.2s steps(2,end) infinite}
.app:nth-child(2) .icon{animation-delay:-.6s}
.app:nth-child(3) .icon{animation-delay:-.3s}
.icon img{width:100%;height:100%;display:block;object-fit:cover;image-rendering:pixelated}
@keyframes bob{50%{transform:translateY(-8px)}}
.app:active .icon{transform:translateY(6px);animation:none}
.app:focus-visible{outline:none}
.app:focus-visible .icon{outline:5px solid #fff;outline-offset:8px}
.name{font-size:clamp(11px,2.2vw,16px);letter-spacing:.08em;white-space:nowrap;background:var(--ink);padding:8px 12px;box-shadow:0 -3px 0 0 #fff,0 3px 0 0 #fff,-3px 0 0 0 #fff,3px 0 0 0 #fff}

.parent{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);border:0;background:rgba(42,31,61,.75);color:#fff;font-family:var(--body);font-weight:800;font-size:13px;padding:9px 14px;cursor:pointer}
.sheet{position:fixed;inset:0;display:flex;align-items:flex-start;overflow-y:auto;box-sizing:border-box;padding-top:calc(env(safe-area-inset-top,0px) + 16px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(42,31,61,.6)}
.card{margin:auto;width:min(100%,440px);box-sizing:border-box;background:var(--paper);padding:24px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 -6px 0 0 var(--ink),0 6px 0 0 var(--ink),-6px 0 0 0 var(--ink),6px 0 0 0 var(--ink)}
.card h2{font-family:var(--pix);font-weight:400;font-size:18px;line-height:1.4;margin:0;text-align:center}
.card p{margin:0;font-family:var(--body);font-weight:700;line-height:1.45;color:#5a4d6e}
.card ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-family:var(--body);font-weight:800;line-height:1.4}
.ok{align-self:center;font-family:var(--pix);font-size:16px;letter-spacing:.06em;border:0;cursor:pointer;color:var(--ink);background:var(--grass);padding:14px 26px;box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),inset -4px -4px 0 0 rgba(0,0,0,.18)}
@media (orientation:landscape) and (max-height:520px){.icon{width:clamp(100px,24vh,160px)}.t2{font-size:40px}.page{gap:18px}}
@media (prefers-reduced-motion:reduce){.icon{animation:none}}
</style>

<div class="world" aria-hidden="true"></div>

<main class="page">
  <h1 aria-label="Juegos de León"><span class="t1">JUEGOS DE</span><span class="t2"><span>L</span><span>E</span><span class="acc">O</span><span>N</span></span></h1>
  <nav class="apps">
    <a class="app" href="dino-race/" aria-label="Dino Race"><span class="icon"><img src="icons/dino-race.png" alt=""></span><span class="name">CARRERA</span></a>
    <a class="app" href="dino-puzzle/" aria-label="Rompecabezas"><span class="icon"><img src="icons/dino-puzzle.png" alt=""></span><span class="name">PUZZLE</span></a>
  </nav>
  <button class="parent" id="helpBtn">Instalar en el iPad</button>
</main>

<div class="sheet" id="help" hidden>
  <div class="card">
    <h2>INSTALAR COMO APP</h2>
    <p>Así los juegos se abren en pantalla completa y funcionan sin internet:</p>
    <ol>
      <li>Abre esta página en Safari.</li>
      <li>Toca Compartir (el cuadrito con la flecha).</li>
      <li>Elige "Agregar a pantalla de inicio".</li>
      <li>Abre "Juegos de León" desde el ícono.</li>
    </ol>
    <button class="ok" id="helpOk">ENTENDIDO</button>
  </div>
</div>

<script>
(() => {
  const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches;
  const help = document.getElementById('help'), btn = document.getElementById('helpBtn');
  btn.hidden = standalone;
  btn.addEventListener('click', () => { help.hidden = false; });
  document.getElementById('helpOk').addEventListener('click', () => { help.hidden = true; });
  ['gesturestart', 'gesturechange'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
  document.addEventListener('contextmenu', e => e.preventDefault());
})();
</script>
