<title>Dino Hoyo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>

@font-face{font-family:'Press Start 2P';font-style:normal;font-weight:400;font-display:block;src:url(__UP__vendor/fonts/press-start-2p-latin.woff2) format('woff2')}

}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#7bd63a;color:var(--ink);font-family:var(--pix);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-text-size-adjust:100%}

#app{position:fixed;inset:0;touch-action:none}

.bg{position:fixed;inset:0;background:url(__UP__img/hub/bg-wide.webp) 50% 100%/cover no-repeat var(--sky);image-rendering:pixelated}

.bg::after{content:'';position:absolute;inset:0;background:rgba(42,31,61,.18)}

.px{border:0;background:var(--sun);box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),inset -4px -4px 0 0 rgba(0,0,0,.18),inset 4px 4px 0 0 rgba(255,255,255,.55),0 10px 0 0 rgba(42,31,61,.35)}
.px:active{transform:translateY(4px)}
.px:focus-visible{outline:4px solid #fff;outline-offset:6px}
.ibtn{width:52px;height:52px;padding:0;display:grid;place-items:center;background:#fff}
.ibtn svg{width:26px;height:26px;shape-rendering:crispEdges}
.bar{position:fixed;left:0;right:0;top:0;z-index:50;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));pointer-events:none}

.lv{position:relative;aspect-ratio:1;padding:0;background:#fff}
.lv img{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);pointer-events:none}
.lv b{position:absolute;left:10px;top:10px;font-weight:400;font-size:14px;color:#fff;text-shadow:2px 0 0 var(--ink),-2px 0 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink)}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:950;width:100%;height:100%;image-rendering:pixelated}
#win{position:fixed;inset:0;z-index:960;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;pointer-events:none;background:rgba(42,31,61,.25)}
#win .big{font-size:clamp(28px,8vw,72px);color:var(--sun);text-shadow:4px 0 0 var(--ink),-4px 0 0 var(--ink),0 4px 0 var(--ink),0 -4px 0 var(--ink),4px 9px 0 var(--ink);animation:pop .6s steps(6,end) both}
@keyframes pop{from{transform:scale(.2)}70%{transform:scale(1.15)}to{transform:none}}
#win .row{display:flex;gap:28px;pointer-events:auto}
.wbtn{min-width:clamp(110px,22vw,170px);height:clamp(64px,10vw,84px);padding:0 18px;display:flex;align-items:center;justify-content:center}

.wbtn.go{background:var(--grass)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>

<script>
/*__DINO_KIT__*/

(() => {
const $ = s => document.querySelector(s);

let save = { done: {}, muted: false };
try { Object.assign(save, JSON.parse(localStorage.getItem('dinoHole3d')) || {}); } catch (e) {}

let actx = null;

}

    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + delay;

  tap: () => beep(520, .07, 'square', .05, 200),
  gulp: i => { const n = performance.now(); if (n - lastGulp < 60) return; lastGulp = n; beep(720 - i * 30, .13, 'square', .05, -320 + i * 10); },
  bump: () => beep(140, .08, 'triangle', .06),

const ICON_ON = '<svg viewBox="0 0 16 16" fill="#2a1f3d"><path d="M1 6h3l4-4h1v12H8l-4-4H1z"/><path d="M11 5h1v1h1v4h-1v1h-1zM13 3h1v1h1v8h-1v1h-1v-2h1V5h-1z"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 16 16" fill="#2a1f3d"><path d="M1 6h3l4-4h1v12H8l-4-4H1z"/><path fill="#ff5d8f" d="M10 5h2v1h1V5h2v2h-1v1h1v2h-2v-1h-1v1h-2V8h1V7h-1z"/></svg>';

$('#muteBtn').addEventListener('click', () => { save.muted = !save.muted; persist(); paintMute(); sfx.tap(); });
paintMute();
if (window.LEON_HUB) {
  const b = $('#homeBtn'); b.hidden = false;
  b.addEventListener('click', () => { sfx.tap(); location.href = window.LEON_HUB; });
}
['gesturestart', 'gesturechange'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
document.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- Objetos 3D (piezas sencillas con sombreado caricatura) ---------- */
const GREEN = 0x5fb84a, LEAF = 0x4ea640, WOOD = 0x9c5a34, SAND = 0xf2cf86, WHITE = 0xf8fbff, STONE = 0x9a90b8;

const rockMesh = (m, sx, sy, sz) => { const o = new THREE.Mesh(rockGeo, m); o.scale.set(sx, sy, sz); o.castShadow = true; return o; };
const glow = c => M(c, { emissive: c, emissiveIntensity: .6 });

const F = {
  flower: c => { const g = grp(at(cyl(.05, .05, .5, M(GREEN)), 0, .25, 0)); for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2; g.add(at(ell(.17, .06, .11, M(c)), Math.cos(a) * .16, .52, Math.sin(a) * .16, 0, -a, 0)); } g.add(at(ell(.1, .08, .1, M(0xffd23a)), 0, .56, 0)); return g; },

  rock: (c = STONE) => grp(at(rockMesh(M(c), .6, .42, .55), 0, .3, 0), at(rockMesh(M(shade(c, .08)), .3, .25, .3), .4, .18, .25)),
  bush: (c = LEAF) => grp(at(ell(.5, .45, .5, M(c)), 0, .4, 0), at(ell(.38, .34, .38, M(shade(c, .06))), .4, .32, .15), at(ell(.35, .32, .35, M(shade(c, -.05))), -.35, .3, -.1)),
  fern: () => { const g = new THREE.Group(); for (let i = 0; i < 7; i++) { const a = i / 7 * Math.PI * 2; g.add(at(ell(.12, .04, .55, M(LEAF)), Math.cos(a) * .35, .3, Math.sin(a) * .35, .5, -a + Math.PI / 2, 0)); } return g; },
  log: () => grp(at(cyl(.3, .3, 1.6, M(WOOD)), 0, .3, 0, 0, 0, Math.PI / 2), at(cyl(.24, .24, 1.62, M(0xe0b07a)), 0, .3, 0, 0, 0, Math.PI / 2), at(ell(.15, .08, .12, M(GREEN)), .3, .58, 0)),
  palm: (h = 2.4) => { const g = new THREE.Group(); for (let i = 0; i < 5; i++) g.add(at(cyl(.16 - i * .01, .18 - i * .01, h / 5 + .02, M(i % 2 ? WOOD : shade(WOOD, .08))), i * .06, h / 10 + i * h / 5, 0)); for (let i = 0; i < 7; i++) { const a = i / 7 * Math.PI * 2; g.add(at(ell(.22, .05, 1, M(i % 2 ? GREEN : LEAF)), .3 + Math.cos(a) * .7, h + .05, Math.sin(a) * .7, 0, -a + Math.PI / 2, -.35)); } for (let i = 0; i < 3; i++) g.add(at(ell(.12, .12, .12, M(0x6b3e1f)), .3 + Math.cos(i * 2) * .14, h - .1, Math.sin(i * 2) * .14)); return g; },
  tree: (c = 0x4ea640) => grp(at(cyl(.22, .32, 1.6, M(WOOD)), 0, .8, 0), at(ell(1, .85, 1, M(c)), 0, 2.1, 0), at(ell(.7, .6, .7, M(shade(c, .07))), .65, 1.7, .3), at(ell(.65, .55, .65, M(shade(c, -.05))), -.6, 1.75, -.2)),
  pine: (snow = false) => { const g = grp(at(cyl(.15, .2, .6, M(WOOD)), 0, .3, 0)); [[1, .9, .9], [.78, .8, 1.5], [.55, .7, 2.05]].forEach(([r, h, y]) => { g.add(at(cone(r, h, M(0x2f8a4a), 8), 0, y, 0)); if (snow) g.add(at(cone(r * .55, h * .45, M(WHITE), 8), 0, y + h * .3, 0)); }); return g; },
  cactus: (h = 1.6) => grp(at(cyl(.25, .28, h, M(0x3f9a4a)), 0, h / 2, 0), at(ell(.25, .2, .25, M(0x3f9a4a)), 0, h, 0), at(cyl(.12, .12, .5, M(0x3f9a4a)), .38, h * .55, 0, 0, 0, Math.PI / 2), at(cyl(.12, .12, .5, M(0x3f9a4a)), .58, h * .7, 0), at(cyl(.12, .12, .4, M(0x3f9a4a)), -.35, h * .45, 0, 0, 0, Math.PI / 2), at(cyl(.12, .12, .4, M(0x3f9a4a)), -.52, h * .58, 0), at(ell(.1, .08, .1, M(0xff5d8f)), 0, h + .18, 0)),
  snowman: () => grp(at(ell(.55, .5, .55, M(WHITE)), 0, .5, 0), at(ell(.4, .38, .4, M(WHITE)), 0, 1.25, 0), at(ell(.3, .3, .3, M(WHITE)), 0, 1.8, 0), at(cone(.07, .35, M(0xff8a2a), 6), 0, 1.8, .4, Math.PI / 2, 0, 0), at(ell(.05, .05, .05, M(0x1a1420)), .1, 1.9, .26), at(ell(.05, .05, .05, M(0x1a1420)), -.1, 1.9, .26), at(cyl(.22, .22, .3, M(0x2a1f3d)), 0, 2.15, 0), at(ring(.33, .07, M(0xe8423a)), 0, 1.58, 0, Math.PI / 2, 0, 0)),
  penguin: () => grp(at(ell(.35, .5, .32, M(0x2a2f45)), 0, .55, 0), at(ell(.26, .4, .2, M(WHITE)), 0, .52, .15), at(ell(.25, .23, .24, M(0x2a2f45)), 0, 1.1, 0), at(cone(.07, .18, M(0xff9a2e), 6), 0, 1.07, .3, Math.PI / 2, 0, 0), at(ell(.04, .05, .03, M(WHITE)), .1, 1.16, .21), at(ell(.04, .05, .03, M(WHITE)), -.1, 1.16, .21), at(ell(.12, .05, .18, M(0xff9a2e)), .14, .05, .1), at(ell(.12, .05, .18, M(0xff9a2e)), -.14, .05, .1)),

  shell: () => { const g = grp(at(ell(.35, .14, .3, M(0xffb3c6)), 0, .12, 0)); for (let i = -2; i <= 2; i++) g.add(at(ell(.04, .15, .28, M(0xff8fb0)), i * .12, .14, 0, 0, i * .25, 0)); return g; },
  starfish: () => { const g = new THREE.Group(); for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2; g.add(at(ell(.11, .06, .36, M(0xff8a3a)), Math.cos(a) * .25, .07, Math.sin(a) * .25, 0, -a + Math.PI / 2, 0)); } g.add(at(ell(.16, .08, .16, M(0xff9a4a)), 0, .08, 0)); return g; },
  ball: () => grp(at(ell(.42, .42, .42, M(WHITE)), 0, .42, 0), at(ring(.42, .07, M(0xe8423a)), 0, .42, 0), at(ring(.42, .07, M(0x3f86c8)), 0, .42, 0, 0, Math.PI / 2, 0), at(ring(.42, .07, M(0xffd23a)), 0, .42, 0, Math.PI / 2, 0, 0)),
  bucket: () => grp(at(cyl(.35, .26, .55, M(0x3f86c8)), 0, .28, 0), at(ring(.3, .03, M(0xffd23a)), 0, .6, 0), at(cyl(.08, .05, .7, M(0xffd23a)), .35, .35, 0, 0, 0, .5)),
  umbrella: () => grp(at(cyl(.04, .04, 1.8, M(WHITE)), 0, .9, 0), at(cone(1.1, .45, M(0xe8423a), 8), 0, 1.8, 0), at(cone(.6, .3, M(WHITE), 8), 0, 1.92, 0), at(ell(.08, .08, .08, M(0xffd23a)), 0, 2.1, 0)),
  sandcastle: () => { const g = grp(at(box(1.2, .5, 1.2, M(SAND)), 0, .25, 0), at(box(.7, .45, .7, M(shade(SAND, .04))), 0, .72, 0)); [[-.5, -.5], [.5, -.5], [-.5, .5], [.5, .5]].forEach(([x, z]) => { g.add(at(cyl(.18, .2, .8, M(shade(SAND, -.03))), x, .4, z)); g.add(at(cone(.2, .3, M(0xe8423a), 6), x, .95, z)); }); g.add(at(box(.02, .3, .2, M(0xffd23a)), 0, 1.2, 0)); return g; },

  const sc = new THREE.Scene(); sc.add(new THREE.HemisphereLight(0xffffff, 0x8a9a70, .9)); const dl = new THREE.DirectionalLight(0xffffff, .7); dl.position.set(3, 6, 5); sc.add(dl);
  const s = SIZE(i), base = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, .06, 32), M(THEMES[theme].ground[0])); base.scale.set(s * .8, 1, s * .8); sc.add(base);
  const it = makeItem(theme, i); it.rotation.y = -.6; sc.add(it);
  const cam = new THREE.PerspectiveCamera(32, 1, .1, 100);
  cam.position.set(0, s * 1.4, s * 2.5); cam.lookAt(0, s * .35, 0);
  thumbR.clear(); thumbR.render(sc, cam);
  return (thumbs[key] = thumbR.domElement.toDataURL());
}
function buildMenu() {
  const box = $('#levels'); box.innerHTML = '';
  LEVELS.forEach((L, n) => {
    const b = document.createElement('button');
    b.className = 'px lv'; b.setAttribute('aria-label', 'Nivel ' + (n + 1));
    b.style.background = '#' + THEMES[L.theme].sky.toString(16).padStart(6, '0');
    b.innerHTML = `<img alt=""><b>${n + 1}</b>${save.done[n] ? '<span class="star"></span>' : ''}`;
    b.addEventListener('click', () => { sfx.tap(); start(n); });
    box.appendChild(b);
    setTimeout(() => { b.querySelector('img').src = thumb(L.theme, L.boss); }, n * 30);
  });
}
function showMenu() {
  clearWorld(); game = null; arrowEl.hidden = true;
  app.hidden = true; $('#win').hidden = true; $('#confetti').hidden = true; $('#hud').hidden = true;
  $('#menu').hidden = false; $('#menuBg').hidden = false; $('#backBtn').hidden = true; $('#title').hidden = false;
  buildMenu();
}

/* ---------- Juego ---------- */
const arrowEl = $('#arrow');
let game = null;
function clearWorld() { if (game) game.items.forEach(it => scene.remove(it.obj)); }

function placeItems(L) {
  const items = [], W = L.world, boss = L.boss, area = Math.pow(W / 56, 1.5);
  const add = (i, n) => {
    const r = SIZE(i) * .5;
    for (let k = 0; k < n; k++) for (let tries = 0; tries < 30; tries++) {
      const x = rand(r + 1, W - r - 1), z = rand(r + 1, W - r - 1);
      if (Math.hypot(x - W / 2, z - W / 2) < 4 + r) continue;   // espacio libre donde empieza el hoyo
      if (items.some(o => Math.hypot(o.x - x, o.z - z) < (o.r + r) * .95)) continue;
      items.push(newItem(L.theme, i, x, z)); break;
    }
  };
  add(boss, 1);
  for (let i = boss - 1; i >= 0; i--) add(i, Math.round((2.2 + (boss - 1 - i) * 1.15) * area));
  return items;
}
function newItem(theme, i, x, z) {
  const obj = makeItem(theme, i); obj.position.set(x, 0, z); scene.add(obj);
  const anim = obj.children[0].userData.anim;
  return { i, x, z, r: SIZE(i) * .5, obj, anim, fall: 0, vy: 0, shake: 0, seed: Math.random() * 6, head: rand(0, 6.28), walk: anim ? rand(.25, .55) : 0 };
}

function start(n) {
  clearWorld();
  const L = LEVELS[n], T = THEMES[L.theme];
  worldU.value = L.world; altU.value.setHex(T.ground[1]); groundMat.color.setHex(T.ground[0]);
  ground.scale.set(L.world + 160, L.world + 160, 1); ground.position.set(L.world / 2, 0, L.world / 2);
  scene.background = new THREE.Color(T.sky); scene.fog = new THREE.Fog(T.sky, 70, 240);
  hemi.groundColor.setHex(T.ground[1]);
  game = { n, L, items: [], hx: L.world / 2, hz: L.world / 2, r: R0, show: R0, falling: [], over: false, t: 0, eaten: 0, look: new THREE.Vector2(), blink: 2 };
  game.items = placeItems(L);
  game.boss = game.items.find(it => it.i === L.boss);
  $('#bossIcon').src = thumb(L.theme, L.boss);
  $('#lvl').textContent = 'NIVEL ' + (n + 1);
  $('#menu').hidden = true; $('#menuBg').hidden = true; $('#title').hidden = true; $('#win').hidden = true;
  app.hidden = false; $('#hud').hidden = false; $('#backBtn').hidden = false;
  resize(); camPos = null; updateMeter();
}

/* Control: el hoyo va hacia el punto del piso que toca el dedo */
let pointer = null;
const keys = {}, ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit = new THREE.Vector3();
app.addEventListener('pointerdown', e => { pointer = { id: e.pointerId, x: e.clientX, y: e.clientY }; try { app.setPointerCapture(e.pointerId); } catch (err) {} });
app.addEventListener('pointermove', e => { if (pointer && pointer.id === e.pointerId) { pointer.x = e.clientX; pointer.y = e.clientY; } });
['pointerup', 'pointercancel'].forEach(ev => app.addEventListener(ev, e => { if (pointer && pointer.id === e.pointerId) pointer = null; }));
addEventListener('keydown', e => (keys[e.key] = true));
addEventListener('keyup', e => (keys[e.key] = false));

function grow(it) {
  const g = game, before = sizesFit(g.r);
  g.r = Math.min(Math.sqrt(g.r * g.r + GROW * it.r * it.r) + .004, 30);
  if (sizesFit(g.r) > before) sfx.grow();
}
function sizesFit(r) { let n = 0; while (n < 16 && fits(SIZE(n) * .5, r)) n++; return n; }

function step(dt) {
  const g = game; if (!g) return;
  g.t += dt;
  // Movimiento
  let dx = 0, dz = 0;
  if (pointer) {
    ndc.set(pointer.x / innerWidth * 2 - 1, -(pointer.y / innerHeight) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    if (ray.ray.intersectPlane(plane, hit)) { dx = hit.x - g.hx; dz = hit.z - g.hz; }
  }
  if (keys.ArrowLeft) dx = -99; if (keys.ArrowRight) dx = 99; if (keys.ArrowUp) dz = -99; if (keys.ArrowDown) dz = 99;
  const d = Math.hypot(dx, dz), speed = 7 + g.r * 1.6;
  if (d > .15 && !g.over) { const m = Math.min(d, speed * dt) / d; g.hx += dx * m; g.hz += dz * m; g.look.set(dx / d, dz / d); }
  else g.look.multiplyScalar(.9);
  const W = g.L.world; g.hx = Math.max(g.r * .5, Math.min(W - g.r * .5, g.hx)); g.hz = Math.max(g.r * .5, Math.min(W - g.r * .5, g.hz));
  g.show += (g.r - g.show) * Math.min(1, dt * 5);

  for (const it of g.items) {
    if (it.fall) continue;
    // Los dinos caminan despacito por el mundo
    if (it.walk) {
      it.head += rand(-.6, .6) * dt;
      const sp = it.walk * dt * (1 + it.i * .08);
      it.x -= Math.sin(it.head) * sp; it.z -= Math.cos(it.head) * sp;
      if (it.x < it.r || it.x > W - it.r || it.z < it.r || it.z > W - it.r) { it.head += Math.PI; it.x = Math.max(it.r, Math.min(W - it.r, it.x)); it.z = Math.max(it.r, Math.min(W - it.r, it.z)); }
      it.obj.rotation.y = it.head;
      it.anim(g.t * 6 + it.seed, 3);
    }
    const dist = Math.hypot(it.x - g.hx, it.z - g.hz);
    if (fits(it.r, g.r)) {
      if (dist < g.r - it.r * .35) { it.fall = 1e-6; it.vy = 0; it.tilt = new THREE.Vector2(it.x - g.hx, it.z - g.hz).normalize(); g.falling.push(it); sfx.gulp(it.i); }
      else if (dist < g.r + it.r * 1.3) { const k = Math.min(1, dt * 1.6); it.x += (g.hx - it.x) * k * .5; it.z += (g.hz - it.z) * k * .5; }
    } else if (dist < g.r + it.r * .25) {
      if (it.shake <= 0) { it.shake = .35; if (g.t - (it.lastBump || -9) > .8) { it.lastBump = g.t; sfx.bump(); } }
    }
    if (it.shake > 0) { it.shake -= dt; it.obj.rotation.z = Math.sin(g.t * 50) * .06; } else it.obj.rotation.z = 0;
    it.obj.position.set(it.x, 0, it.z);
    const tick = it.obj.children[0].userData.tick; if (tick) tick(g.t);
  }
  // Caída: se desliza al centro, se inclina y se hunde en la oscuridad
  for (const it of g.falling) {
    it.fall += dt; it.vy += 18 * dt;
    const k = Math.min(1, dt * 3);
    it.x += (g.hx - it.x) * k * .6; it.z += (g.hz - it.z) * k * .6;
    const y = it.obj.position.y - it.vy * dt;
    it.obj.position.set(it.x, y, it.z);
    it.obj.rotation.x += it.tilt.y * dt * 2.2; it.obj.rotation.z -= it.tilt.x * dt * 2.2;
    if (y < -(SIZE(it.i) * 1.2 + 2) && !it.gone) {
      it.gone = true; scene.remove(it.obj); g.eaten++; grow(it); updateMeter();
      if (it === g.boss) winLevel();
    }
  }
  g.falling = g.falling.filter(it => !it.gone);
  g.items = g.items.filter(it => !it.gone);
  if (!g.over && !fits(g.boss.r, g.r) && g.items.filter(it => !it.fall && fits(it.r, g.r)).length < 4) refill();

  // Hoyo y ojitos
  hole.position.set(g.hx, 0, g.hz);
  const R = g.show, depth = 3 + R * 3;
  wall.scale.set(R, depth, R); wall.position.y = -depth / 2; floor.scale.setScalar(R); floor.position.y = -depth + .01;
  rim.scale.set(R, Math.max(1, R * .9), R);
  holeU.value.set(g.hx, g.hz, R);
  pupils.forEach(p => { p.position.x = g.look.x * .07; p.position.y = -g.look.y * .05; });
  g.blink -= dt; const bl = g.blink < .12 ? .12 : 1; if (g.blink < 0) g.blink = rand(2, 5);
  balls.forEach(b => (b.scale.y = bl));
  eyeRig.position.y = Math.abs(Math.sin(g.t * 8)) * .05 * (g.look.length() > .3 ? 1 : 0);
  updateCamera(dt);
}
function refill() {
  const g = game; let top = 0; while (top < g.L.boss && fits(SIZE(top + 1) * .5, g.r)) top++;
  for (let k = 0; k < 10; k++) {
    const i = Math.max(0, top - (k % 3)), a = Math.random() * Math.PI * 2, dist = rand(g.r * 3, g.r * 7);
    const x = Math.max(1, Math.min(g.L.world - 1, g.hx + Math.cos(a) * dist)), z = Math.max(1, Math.min(g.L.world - 1, g.hz + Math.sin(a) * dist));
    g.items.push(newItem(g.L.theme, i, x, z));
  }
}
function updateMeter() {
  const g = game, need = g.boss.r / .92, p = Math.min(1, (g.r - R0) / (need - R0));
  $('#meterBar i').style.width = Math.max(0, p * 100) + '%';
}

// Cámara inclinada (como hole.io) que se aleja conforme crece el hoyo
let camPos = null;
const camLook = new THREE.Vector3(), camWant = new THREE.Vector3(), proj = new THREE.Vector3();
function updateCamera(dt) {
  const g = game, port = innerHeight > innerWidth;
  const dist = (port ? 19 : 15) + g.show * 6.5;
  camWant.set(g.hx, dist * .78, g.hz + dist * .62);
  if (!camPos) camPos = camWant.clone();
  camPos.lerp(camWant, Math.min(1, dt * 4));
  camera.position.copy(camPos);
  camLook.set(camPos.x, 0, camPos.z - dist * .62 - 1.5);
  camera.lookAt(camLook);
  const s = dist * .9;
  Object.assign(sun.shadow.camera, { left: -s, right: s, top: s, bottom: -s, near: 1, far: dist * 3 }); sun.shadow.camera.updateProjectionMatrix();
  sun.position.set(g.hx - 10, 30 + dist, g.hz + 12); sun.target.position.set(g.hx, 0, g.hz - 4);
  // Flecha hacia el jefe cuando ya cabe y no se ve
  const b = g.boss;
  if (b && !b.fall && fits(b.r, g.r) && !g.over) {
    proj.set(b.x, 0, b.z).project(camera);
    const sx = (proj.x + 1) / 2 * innerWidth, sy = (1 - proj.y) / 2 * innerHeight, m = 70;
    if (proj.z > 1 || sx < 0 || sx > innerWidth || sy < 0 || sy > innerHeight) {
      const a = Math.atan2(b.z - g.hz, b.x - g.hx);
      const ex = Math.max(m, Math.min(innerWidth - m, innerWidth / 2 + Math.cos(a) * innerWidth)), ey = Math.max(m + 80, Math.min(innerHeight - m, innerHeight / 2 + Math.sin(a) * innerHeight));
      arrowEl.hidden = false; arrowEl.style.transform = `translate(${ex}px,${ey}px) rotate(${a + Math.PI / 2}rad)`;
    } else arrowEl.hidden = true;
  } else arrowEl.hidden = true;
}

function winLevel() {
  const g = game; g.over = true; save.done[g.n] = true; persist();
  sfx.win(); confetti(); arrowEl.hidden = true;
  setTimeout(() => { if (game === g) $('#win').hidden = false; }, 900);
}
function confetti() {
  const c = $('#confetti'); c.hidden = false;
  const W = c.width = Math.ceil(innerWidth / 4), H = c.height = Math.ceil(innerHeight / 4), x = c.getContext('2d');
  const bits = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: -Math.random() * H * .6, v: rand(.6, 1.6), d: rand(-.4, .4), col: ['#ffd23a', '#ff5d8f', '#5ac8ff', '#6cc63a', '#fff'][Math.random() * 5 | 0] }));
  const t0 = performance.now();
  (function f(t) {
    x.clearRect(0, 0, W, H);
    bits.forEach(b => { b.y += b.v; b.x += b.d; x.fillStyle = b.col; x.fillRect(b.x | 0, b.y | 0, 2, 2); });
    if (t - t0 < 3200 && !c.hidden) requestAnimationFrame(f); else c.hidden = true;
  })(t0);
}

$('#backBtn').addEventListener('click', () => { sfx.tap(); showMenu(); });
$('#menuBtn').addEventListener('click', () => { sfx.tap(); showMenu(); });
$('#nextBtn').addEventListener('click', () => { sfx.tap(); const n = game ? (game.n + 1) % LEVELS.length : 0; $('#win').hidden = true; $('#confetti').hidden = true; start(n); });

// Si el aparato va lento, baja la resolución para que siga fluido
let slow = 0;
function checkPerf(dt) {
  if (dt > 1 / 40) slow++; else slow = Math.max(0, slow - 1);
  if (slow > 90 && pixelRatio > 1) { pixelRatio = Math.max(1, pixelRatio - .5); renderer.setPixelRatio(pixelRatio); resize(); slow = 0; }
}
let last = performance.now();
function loop(now) {
  const raw = (now - last) / 1000, dt = Math.min(.05, raw); last = now;
  if (game) { checkPerf(raw); step(dt); renderer.render(scene, camera); }
  requestAnimationFrame(loop);
}
resize();
requestAnimationFrame(loop);
showMenu();
window.__hole = { start, step, render: () => renderer.render(scene, camera), get game() { return game; } };
})();
</script>
