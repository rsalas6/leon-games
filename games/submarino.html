<title>Dino Submarino</title>

<style>
/* Layout: menú de niveles, luego juego de lado a pantalla completa */
@font-face{font-family:'Lilita One';font-style:normal;font-weight:400;font-display:block;src:url(__UP__vendor/fonts/i7dPIFZ9Zz-WBtRtedDbYEF8RXi4EwQ.woff2) format('woff2')}
:root{--ink:#2a1f3d;--sun:#ffd23a;--grass:#6cc63a;--pix:'Lilita One','Arial Rounded MT Bold',sans-serif;color-scheme:light}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#bfeee0;color:var(--ink);font-family:var(--pix);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button{font-family:var(--pix);touch-action:manipulation;-webkit-touch-callout:none;cursor:pointer;color:var(--ink)}
#app{position:fixed;inset:0;touch-action:none}
#app canvas{display:block;width:100%;height:100%;touch-action:none}
.bg{position:fixed;inset:0;background:url(__UP__img/menus/bg-sub-wide.webp) 50% 50%/cover no-repeat #9fe0c8}
@media (orientation:portrait){.bg{background-image:url(__UP__img/menus/bg-sub-tall.webp)}}
.bg::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(255,255,255,.4),rgba(255,255,255,.05) 70%)}
.px{border:0;border-radius:18px;background:var(--sun);box-shadow:0 0 0 4px var(--ink),0 8px 0 4px rgba(42,31,61,.3)}
.px:active{transform:translateY(4px);box-shadow:0 0 0 4px var(--ink),0 4px 0 4px rgba(42,31,61,.3)}
.ibtn{width:52px;height:52px;padding:0;display:grid;place-items:center;background:#fff}
.ibtn svg{width:26px;height:26px;shape-rendering:crispEdges}
.bar{position:fixed;left:0;right:0;top:0;z-index:50;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:12px;padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));pointer-events:none}
.bar>*{pointer-events:auto}
.side{display:flex;gap:16px}
.side.end{justify-content:flex-end}
h1{margin:0;font-weight:400;font-size:clamp(28px,5.4vw,50px);color:var(--sun);letter-spacing:.04em;text-align:center;-webkit-text-stroke:.08em var(--ink);paint-order:stroke fill;text-shadow:0 .1em 0 var(--ink)}
#hud{display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}

#goal{display:flex;align-items:center;gap:8px;padding:5px 16px 5px 8px;border-radius:99px;background:rgba(255,255,255,.92);box-shadow:0 0 0 4px var(--ink),0 6px 0 4px rgba(42,31,61,.25);font-size:clamp(22px,4vw,34px)}
#goal .ic{font-size:1.2em;line-height:1}

@keyframes bump{50%{transform:scale(1.18)}}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:calc(env(safe-area-inset-top,0px) + 96px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));box-sizing:border-box}
#levels{flex:1;min-height:0;width:100%;max-width:1100px;overflow-y:auto;-webkit-overflow-scrolling:touch;display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(120px,18vw,200px),1fr));gap:clamp(16px,3vw,28px);padding:10px 10px 24px;box-sizing:border-box;align-content:start}
.lv{position:relative;aspect-ratio:1;padding:0;overflow:visible;background:#fff}
.lv img{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);border-radius:13px;object-fit:cover;pointer-events:none}
.lv>b{position:absolute;left:-12px;top:-12px;width:clamp(38px,5vw,48px);height:clamp(38px,5vw,48px);display:grid;place-items:center;border-radius:50%;background:var(--sun);box-shadow:0 0 0 4px var(--ink),0 4px 0 4px rgba(42,31,61,.3);font-weight:400;font-size:clamp(19px,2.8vw,26px);color:var(--ink)}
.lv .nm{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);max-width:88%;overflow:hidden;text-overflow:ellipsis;background:rgba(255,255,255,.94);padding:3px 12px;border-radius:99px;box-shadow:0 0 0 3px var(--ink);font-size:clamp(13px,1.9vw,18px);white-space:nowrap}
.lv .goals{position:absolute;right:8px;top:8px;display:flex;gap:1px;padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.94);box-shadow:0 0 0 3px var(--ink);font-size:clamp(15px,2.2vw,21px);line-height:1.25}
.lv .stars{position:absolute;right:-10px;bottom:-12px;display:flex;gap:1px}
.lv .stars i{width:30px;height:30px;background:var(--sun);clip-path:polygon(50% 0,62% 34%,100% 36%,70% 58%,80% 100%,50% 76%,20% 100%,30% 58%,0 36%,38% 34%);filter:drop-shadow(0 3px 0 var(--ink))}
.lv:active img{filter:brightness(1.1)}

#goal{gap:12px;padding:6px 14px}
.prog{position:relative;width:clamp(120px,24vw,240px);height:20px;border-radius:99px;background:#eee;box-shadow:inset 0 0 0 3px var(--ink);overflow:visible;display:block}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#8fe04a,#6cc63a);transition:width .25s}
.prog b{position:absolute;right:-14px;top:50%;transform:translateY(-50%);font-weight:400;font-size:24px}
.cn{display:flex;align-items:center;gap:4px;min-width:3em}
.cn img{height:1.1em}
.lv.next{animation:nextp 1.1s ease-in-out infinite}

.lv img.chr{inset:auto;left:50%;top:44%;width:auto;height:52%;transform:translate(-50%,-50%);border-radius:0;object-fit:contain;filter:drop-shadow(0 4px 0 rgba(42,31,61,.25))}

#lvlLoad{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(42,31,61,.55);color:#fff;font-size:clamp(28px,6vw,44px);-webkit-text-stroke:.08em var(--ink);paint-order:stroke fill}
#lvlLoad span{width:min(60vw,360px);height:22px;padding:4px;box-sizing:border-box;border-radius:99px;background:var(--ink);box-shadow:0 0 0 4px #fff}
#lvlLoad i{display:block;height:100%;width:8%;border-radius:99px;background:linear-gradient(#ffe680,#ffc21a);transition:width .2s}
#banner{position:fixed;left:50%;top:40%;z-index:41;pointer-events:none;white-space:nowrap;font-size:clamp(34px,8vw,76px);color:#fff;-webkit-text-stroke:.08em var(--ink);paint-order:stroke fill;text-shadow:0 .08em 0 var(--ink);animation:gopop 1.6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes gopop{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}15%{transform:translate(-50%,-50%) scale(1.15);opacity:1}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
#hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 9vh);z-index:30;transform:translateX(-50%);pointer-events:none}
#hint svg{width:70px;height:70px;animation:tap 1s ease-in-out infinite;filter:drop-shadow(0 3px 0 rgba(42,31,61,.4))}
@keyframes tap{50%{transform:translate(6px,10px) scale(.9)}}
#joy{position:fixed;left:0;top:0;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.22);box-shadow:inset 0 0 0 5px rgba(255,255,255,.75),0 0 0 4px rgba(42,31,61,.35);pointer-events:none;z-index:30}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px #2a1f3d,0 6px 0 rgba(42,31,61,.35)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:950;width:100%;height:100%}
#win{position:fixed;inset:0;z-index:960;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:26px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 7vh);pointer-events:none}
#win .big{font-size:clamp(34px,8vw,76px);color:var(--sun);-webkit-text-stroke:.07em var(--ink);paint-order:stroke fill;text-shadow:0 .08em 0 var(--ink);animation:pop .6s cubic-bezier(.3,1.6,.5,1) both;text-align:center}
@keyframes pop{from{transform:scale(.2)}70%{transform:scale(1.15)}to{transform:none}}
#win .row{display:flex;gap:28px;pointer-events:auto}
.wbtn{min-width:clamp(110px,22vw,170px);height:clamp(64px,10vw,84px);padding:0 18px;display:flex;align-items:center;justify-content:center}

@media (max-width:620px){.bar{gap:8px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}.side{gap:8px}.ibtn{width:44px;height:44px}.ibtn svg{width:22px;height:22px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}

<script>
(() => {
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.random() * a.length | 0];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let save = { done: {}, muted: false };
try { Object.assign(save, JSON.parse(localStorage.getItem('dinoSub')) || {}); } catch (e) {}
const persist = () => { try { localStorage.setItem('dinoSub', JSON.stringify(save)); } catch (e) {} };

/* ---------- Sonido (sintetizado, sin voz) ---------- */
let actx = null, noiseBuf = null;
function unlockAudio() {
  try {
    if (!actx) { actx = new (window.AudioContext || window.webkitAudioContext)(); const b = actx.createBufferSource(); b.buffer = actx.createBuffer(1, 1, 22050); b.connect(actx.destination); b.start(0);
      noiseBuf = actx.createBuffer(1, actx.sampleRate * .5, actx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    if (actx.state !== 'running') actx.resume();
  } catch (e) {}
}
['pointerdown', 'touchend', 'keydown'].forEach(ev => window.addEventListener(ev, unlockAudio, { passive: true }));
function beep(f, dur = .1, type = 'square', vol = .06, slide = 0, delay = 0) {
  if (save.muted || !actx) return;
  try { const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + delay; o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + dur); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + .02); } catch (e) {}
}
function noise(vol = .12, dur = .3, freq = 1200, q = .8) {
  if (save.muted || !actx || !noiseBuf) return;
  try { const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain(), t = actx.currentTime; s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur); s.connect(f).connect(g).connect(actx.destination); s.start(t); s.stop(t + dur + .05); } catch (e) {}
}
const sfx = { tap: () => beep(520, .07, 'square', .05, 200), win: () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => beep(f, .16, 'square', .06, 0, i * .12)), go: () => [523, 784, 1047].forEach((f, i) => beep(f, .14, 'square', .05, 0, i * .07)) };
let songTimer = null, songStep = 0;
function music(on, SONG, BASS, ms = 240) {
  clearInterval(songTimer); songTimer = null; if (!on) return;
  songTimer = setInterval(() => { if (save.muted || !actx || document.hidden) return; const n = SONG[songStep % SONG.length]; if (songStep % 4 !== 3) beep(587.3 * Math.pow(2, n / 12), .2, 'triangle', .018); if (songStep % 2 === 0) beep(146.8 * Math.pow(2, BASS[(songStep >> 1) % BASS.length] / 12), .32, 'sine', .028); songStep++; }, ms);
}
const ICON_ON = '<svg viewBox="0 0 16 16" fill="#2a1f3d"><path d="M1 6h3l4-4h1v12H8l-4-4H1z"/><path d="M11 5h1v1h1v4h-1v1h-1zM13 3h1v1h1v8h-1v1h-1v-2h1V5h-1z"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 16 16" fill="#2a1f3d"><path d="M1 6h3l4-4h1v12H8l-4-4H1z"/><path fill="#ff5d8f" d="M10 5h2v1h1V5h2v2h-1v1h1v2h-2v-1h-1v1h-2V8h1V7h-1z"/></svg>';
function paintMute() { $('#muteBtn').innerHTML = save.muted ? ICON_OFF : ICON_ON; }
$('#muteBtn').addEventListener('click', () => { save.muted = !save.muted; persist(); paintMute(); sfx.tap(); });
paintMute();
if (window.LEON_HUB) { const b = $('#homeBtn'); b.hidden = false; b.addEventListener('click', () => { sfx.tap(); location.href = window.LEON_HUB; }); }
['gesturestart', 'gesturechange'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
document.addEventListener('contextmenu', e => e.preventDefault());

const app = $('#app');
function banner(t) { const b = document.createElement('div'); b.id = 'banner'; b.textContent = t; document.body.appendChild(b); setTimeout(() => b.remove(), 1700); }
function confetti() {
  const c = $('#confetti'); c.hidden = false; const W = c.width = Math.ceil(innerWidth / 3), H = c.height = Math.ceil(innerHeight / 3), x = c.getContext('2d');
  const bits = Array.from({ length: 90 }, () => ({ x: Math.random() * W, y: -Math.random() * H * .6, v: rand(.6, 1.6), d: rand(-.4, .4), r: rand(0, 6), col: pick(['#ffd23a', '#ff5d8f', '#5ac8ff', '#6cc63a', '#fff']) })); const t0 = performance.now();
  (function f(t) { x.clearRect(0, 0, W, H); bits.forEach(b => { b.y += b.v; b.x += b.d; b.r += .1; x.fillStyle = b.col; x.save(); x.translate(b.x, b.y); x.rotate(b.r); x.fillRect(-2, -1, 4, 2); x.restore(); }); if (t - t0 < 3600 && !c.hidden) requestAnimationFrame(f); else c.hidden = true; })(t0);
}
const keys = new Set(); addEventListener('keydown', e => { if (e.key.startsWith('Arrow')) { keys.add(e.key); e.preventDefault(); } }); addEventListener('keyup', e => keys.delete(e.key));

/* ---------- Lienzo 2D (se ve nítido en el iPad) ---------- */
const cv = document.createElement('canvas'); app.appendChild(cv); const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() { DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
addEventListener('resize', resize);
// Imágenes del juego: se cargan al abrir un nivel (con barrita)
const IMG = {};
function loadImgs(list) {
  const need = list.filter(n => !IMG[n]); if (!need.length) return Promise.resolve();
  const ov = $('#lvlLoad'), bar = ov.querySelector('i'); ov.hidden = false; let done = 0;
  return Promise.all(need.map(n => new Promise(res => { const im = new Image(); im.onload = im.onerror = () => { done++; bar.style.width = Math.max(8, done / need.length * 100) + '%'; IMG[n] = im; res(); }; im.src = '__UP__img/' + n + '.webp'; }))).then(() => { ov.hidden = true; });
}
// Dibuja una imagen centrada en (x, y) con alto h (y ancho según su forma), girada a
function sprite(name, x, y, h, a = 0, flip = false, alpha = 1) {
  const im = IMG[name]; if (!im || !im.width) return; const w = h * im.width / im.height;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); if (a) ctx.rotate(a); if (flip) ctx.scale(-1, 1); ctx.drawImage(im, -w / 2, -h / 2, w, h); ctx.restore();
}
// Chispitas y textos que flotan
const P2 = [];
function sparks(x, y, n, cols, sp = 220, size = 7) { for (let i = 0; i < n; i++) { const a = rand(0, 6.3), v = rand(.3, 1) * sp; P2.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - sp * .3, life: rand(.5, 1), c: pick(cols), s: size * rand(.6, 1.3), rot: rand(0, 6) }); } }
function floatText(x, y, t, c = '#ffd23a') { P2.push({ x, y, vx: 0, vy: -80, life: 1, text: t, c }); }
function stepP2(dt, camX = 0) {
  for (let i = P2.length - 1; i >= 0; i--) { const p = P2[i]; p.life -= dt; if (p.life <= 0) { P2.splice(i, 1); continue; } p.x += p.vx * dt; p.y += p.vy * dt; if (!p.text) { p.vy += 500 * dt; p.rot += dt * 6; } }
}
function drawP2(camX = 0) {
  for (const p of P2) {
    ctx.globalAlpha = Math.min(1, p.life * 2);
    if (p.text) { ctx.font = `${Math.round(H * .05)}px 'Lilita One',sans-serif`; ctx.textAlign = 'center'; ctx.lineWidth = 6; ctx.strokeStyle = '#2a1f3d'; ctx.strokeText(p.text, p.x - camX, p.y); ctx.fillStyle = p.c; ctx.fillText(p.text, p.x - camX, p.y); }
    else { ctx.save(); ctx.translate(p.x - camX, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); ctx.restore(); }
  }
  ctx.globalAlpha = 1;
}
// Fondo que se repite de lado y se mueve más lento que el piso (se siente profundo)
function drawBg(name, camX, k = .25) {
  // Cada copia va en espejo de la anterior: así no se nota la unión aunque el dibujo no empate
  const im = IMG[name]; if (!im || !im.width) return; const h = H, w = h * im.width / im.height, off = camX * k; let i = Math.floor(off / w), x = i * w - off;
  for (; x < W; x += w, i++) { if (i % 2) { ctx.save(); ctx.translate(Math.floor(x) + Math.ceil(w), 0); ctx.scale(-1, 1); ctx.drawImage(im, 0, 0, Math.ceil(w) + 1, h); ctx.restore(); } else ctx.drawImage(im, Math.floor(x), 0, Math.ceil(w) + 1, h); }
}

/* ---------- Dino Submarino: rescata a los pececitos atrapados en burbujas (el submarino dispara burbujas solo) ---------- */
const SONG = [0, 3, 7, 10, 7, 3, 5, 7, 0, 3, 7, 12, 10, 7, 5, 3], BASS = [0, 0, -4, -4, 5, 5, 3, 3];
const THEMES = { arrecife: { name: 'Arrecife', tint: null }, barco: { name: 'Barco pirata', tint: null }, hielo: { name: 'Mar helado', tint: null }, profundo: { name: 'Mar profundo', dark: 1 } };
// len: segundos; fish: pececitos que rescatar; jelly/puffer: estorbos (por cada 10 s)
const LEVELS = [
  ['arrecife', 40, 6, 0, 0], ['arrecife', 45, 8, 1, 0], ['arrecife', 50, 9, 1.5, .5],
  ['barco', 50, 9, 1.5, 1], ['barco', 55, 10, 2, 1], ['barco', 60, 11, 2, 1.5],
  ['hielo', 55, 10, 2, 1.5], ['hielo', 60, 11, 2.5, 1.5], ['hielo', 65, 12, 2.5, 2],
  ['profundo', 55, 10, 2, 1.5], ['profundo', 60, 12, 2.5, 2], ['profundo', 70, 14, 3, 2.5],
].map(([theme, len, fish, jelly, puffer], i) => ({ theme, len, fish, jelly, puffer, seed: 23 + i * 113 }));
const ssfx = {
  shoot: () => beep(rand(500, 700), .06, 'sine', .025, 400),
  free: k => [0, 4, 7, 12].forEach((n, i) => beep(659 * Math.pow(2, n / 12), .1, 'triangle', .05, 0, i * .06)),
  pearl: () => { beep(1319, .06, 'square', .04); beep(1760, .1, 'square', .04, 0, .06); },
  bonk: () => { beep(160, .2, 'sine', .07, -60); noise(.12, .2, 700, 1); },
  pop: () => noise(.12, .06, 2600, 1.2),
};
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

let game = null;
const IMGS = ['sub/sub', 'sub/fishbub', 'sub/fish', 'sub/jelly', 'sub/puffer', 'sub/clam', 'sub/chest', 'sub/bubble'];
async function start(n) { const L = LEVELS[n]; await loadImgs([...IMGS, 'sub/bg-' + L.theme]); startNow(n); }
function startNow(n) {
  const L = LEVELS[n], R = rng(L.seed), sp = .3;
  game = { n, L, t: 0, phase: 'play', x: 0, y: .5, vy: 0, ty: .5, sp, items: [], shots: [], friends: [], freed: 0, pearls: 0, hurt: 0, shootT: 0, trail: [] };
  const end = L.len * sp; game.end = end;
  // Pececitos repartidos a lo largo, estorbos en medio, perlas en el piso
  for (let i = 0; i < L.fish; i++) game.items.push({ k: 'fishbub', x: 1 + (i + R() * .6) * (end - 1.6) / L.fish, y: .2 + R() * .6, ph: R() * 6 });
  const nj = Math.round(L.len / 10 * L.jelly), np = Math.round(L.len / 10 * L.puffer);
  for (let i = 0; i < nj; i++) game.items.push({ k: 'jelly', x: 1.6 + R() * (end - 2), y: .25 + R() * .5, ph: R() * 6 });
  for (let i = 0; i < np; i++) game.items.push({ k: 'puffer', x: 1.8 + R() * (end - 2.2), y: .25 + R() * .5, ph: R() * 6, hp: 3 });
  for (let x = .8; x < end - .5; x += .7 + R() * .8) game.items.push({ k: 'clam', x, y: .9 });
  // Los estorbos no se encimen con los pececitos
  game.items = game.items.filter(a => a.k === 'fishbub' || a.k === 'clam' || !game.items.some(b => b.k === 'fishbub' && Math.abs(b.x - a.x) < .25 && Math.abs(b.y - a.y) < .2));
  paintHud();
  $('#lvl').textContent = 'NIVEL ' + (n + 1);
  $('#menu').hidden = true; $('#menuBg').hidden = true; $('#title').hidden = true; $('#win').hidden = true;
  app.hidden = false; $('#hud').hidden = false; $('#backBtn').hidden = false; $('#hint').hidden = false;
  resize(); music(true, SONG, BASS, 260); banner('¡RESCATA A LOS PECES!'); sfx.go();
}
function paintHud() { const g = game; $('#goal').innerHTML = `<span class="prog"><i style="width:${Math.min(100, g.x / g.end * 100)}%"></i><b>💰</b></span><span class="cn"><img alt="" src="__UP__img/sub/fish.webp">${g.freed}/${g.L.fish}</span>`; }

/* ---------- Dedo: el submarino sube o baja hacia el dedo ---------- */
let fy = null;
app.addEventListener('pointerdown', e => { fy = e.clientY / innerHeight; $('#hint').hidden = true; try { app.setPointerCapture(e.pointerId); } catch (er) {} });
app.addEventListener('pointermove', e => { if (fy != null) fy = e.clientY / innerHeight; });
['pointerup', 'pointercancel'].forEach(ev => app.addEventListener(ev, () => { fy = null; }));

function update(dt) {
  const g = game; g.t += dt;
  if (g.phase === 'play') {
    g.x += g.sp * dt;
    if (fy != null) g.ty = clamp(fy, .14, .84);
    if (keys.has('ArrowUp')) g.ty = clamp(g.y - .2, .14, .84); if (keys.has('ArrowDown')) g.ty = clamp(g.y + .2, .14, .84);
    if (g.auto != null) g.ty = g.auto;
    const prev = g.y; g.y += (g.ty - g.y) * Math.min(1, dt * 4); g.vy = (g.y - prev) / dt;
    // Burbujas automáticas hacia adelante
    g.shootT -= dt; if (g.shootT <= 0) { g.shootT = .45; g.shots.push({ x: g.x + .12, y: g.y + .01, life: 1.6 }); ssfx.shoot(); }
  }
  if (g.hurt > 0) g.hurt -= dt;
  // Burbujas que vuelan
  for (const s of g.shots) {
    s.x += .75 * dt; s.y += Math.sin(g.t * 8 + s.x * 20) * .02 * dt; s.life -= dt;
    for (const it of g.items) {
      if (it.done || s.life <= 0) continue; const dx = it.x - s.x, dy = it.y - s.y;
      if (it.k === 'fishbub' && Math.abs(dx) < .07 && Math.abs(dy) < .07) { s.life = 0; freeFish(it); }
      if ((it.k === 'jelly' || it.k === 'puffer') && Math.abs(dx) < .07 && Math.abs(dy) < .08) { s.life = 0; it.hit = .3; it.x += .05; ssfx.pop(); if (it.k === 'puffer' && --it.hp <= 0) { it.done = true; sparks(toX(it.x), it.y * H, 12, ['#ffd23a', '#fff', '#ff9a2e'], 200, 6); floatText(toX(it.x), it.y * H, '¡PUF!'); } }
    }
  }
  g.shots = g.shots.filter(s => s.life > 0);
  // Estorbos se mecen; tocar uno asusta a un pececito amigo (se va nadando) pero no se pierde el juego
  for (const it of g.items) {
    if (it.done) continue;
    if (it.k === 'jelly') it.y = clamp(it.y + Math.sin(g.t * 1.5 + it.ph) * .08 * dt, .15, .8);
    if (it.k === 'puffer') it.x -= .04 * dt;
    if (it.hit) it.hit = Math.max(0, it.hit - dt);
    const dx = it.x - g.x, dy = it.y - g.y;
    if ((it.k === 'jelly' || it.k === 'puffer') && Math.abs(dx) < .1 && Math.abs(dy) < .09 && g.hurt <= 0) hurt();
    if (it.k === 'clam' && !it.done && Math.abs(dx) < .08 && g.y > .74) { it.done = true; g.pearls++; ssfx.pearl(); sparks(toX(it.x), it.y * H, 8, ['#fff', '#ffd6f0'], 150, 6); floatText(toX(it.x), it.y * H - 30, '+1'); }
    if (it.k === 'fishbub' && !it.done && Math.abs(dx) < .08 && Math.abs(dy) < .08) freeFish(it); // también se rescata tocándolo
    if (dx < -.6) it.done = it.done || it.k !== 'fishbub' ? true : it.done;
  }
  // Pececitos rescatados nadan en fila detrás del submarino
  g.trail.unshift({ x: g.x, y: g.y }); if (g.trail.length > 400) g.trail.pop();
  g.friends.forEach((f, i) => { const p = g.trail[Math.min(g.trail.length - 1, (i + 1) * 9)]; f.x += (p.x - .14 - f.x) * Math.min(1, dt * 5); f.y += (p.y + Math.sin(g.t * 4 + i) * .015 - f.y) * Math.min(1, dt * 5); });
  if (Math.floor(g.t * 4) !== Math.floor((g.t - dt) * 4)) paintHud();
  if (g.phase === 'play' && g.x >= g.end) winLevel();
  if (g.phase === 'win') { g.y += (.55 - g.y) * dt * 2; }
  stepP2(dt);
}
const toX = x => W * .28 + (x - game.x) * H;
function freeFish(it) { const g = game; it.done = true; g.freed++; ssfx.free(g.freed); g.friends.push({ x: it.x, y: it.y }); sparks(toX(it.x), it.y * H, 12, ['#bfe8ff', '#fff', '#ff9a2e'], 200, 7); floatText(toX(it.x), it.y * H - 20, '¡GRACIAS!', '#fff'); paintHud(); }
function hurt() { const g = game; g.hurt = 1.6; ssfx.bonk(); banner('¡AY!'); if (g.friends.length) { const f = g.friends.pop(); g.freed--; f.away = true; sparks(toX(f.x), f.y * H, 8, ['#ff9a2e', '#fff'], 160, 6); } paintHud(); }
function winLevel() {
  const g = game; g.phase = 'win'; const pct = g.freed / g.L.fish, stars = pct >= .8 ? 3 : pct >= .5 ? 2 : 1;
  save.done[g.n] = Math.max(save.done[g.n] || 0, stars); persist(); confetti(); sfx.win();
  $('#winTxt').innerHTML = `¡${g.freed} PECES A SALVO!<br>` + '⭐'.repeat(stars);
  setTimeout(() => { if (game === g) $('#win').hidden = false; }, 1500);
}
function draw() {
  const g = game;
  ctx.clearRect(0, 0, W, H);
  drawBg('sub/bg-' + g.L.theme, g.x * H, .3);
  sprite('sub/chest', toX(g.end + .3), H * .8, H * .22);
  for (const it of g.items) {
    if (it.done && it.k !== 'clam') continue; const X = toX(it.x); if (X < -120 || X > W + 120) continue; const Y = it.y * H;
    if (it.k === 'clam') sprite('sub/clam', X, Y, H * .09, 0, false, it.done ? .45 : 1);
    if (it.k === 'fishbub') sprite('sub/fishbub', X, Y + Math.sin(g.t * 2 + it.ph) * H * .015, H * .13);
    if (it.k === 'jelly') sprite('sub/jelly', X + (it.hit ? rand(-3, 3) : 0), Y, H * .13 * (1 + Math.sin(g.t * 3 + it.ph) * .06));
    if (it.k === 'puffer') sprite('sub/puffer', X + (it.hit ? rand(-3, 3) : 0), Y, H * (.1 + (3 - it.hp) * .015), 0, true);
  }
  for (const s of g.shots) sprite('sub/bubble', toX(s.x), s.y * H, H * .045, 0, false, Math.min(1, s.life * 2));
  for (const f of g.friends) sprite('sub/fish', toX(f.x), f.y * H, H * .06);
  if (g.hurt <= 0 || Math.floor(g.t * 12) % 2) sprite('sub/sub', W * .28, g.y * H, H * .17, clamp(g.vy * .4, -.25, .25));
  drawP2(0);
  // Mar profundo: oscuro, con la luz del submarino
  if (THEMES[g.L.theme].dark) {
    const X = W * .28 + H * .06, Y = g.y * H, gr = ctx.createRadialGradient(X + H * .2, Y, H * .05, X + H * .2, Y, H * .55);
    gr.addColorStop(0, 'rgba(5,10,40,0)'); gr.addColorStop(1, 'rgba(5,10,40,.72)'); ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  }
}

/* ---------- Menú ---------- */
function buildMenu() {
  const box = $('#levels'); box.innerHTML = '';
  let next = LEVELS.findIndex((_, n) => !save.done[n]); if (next < 0) next = 0;
  LEVELS.forEach((L, n) => {
    const b = document.createElement('button'); b.className = 'px lv' + (n === next ? ' next' : ''); b.setAttribute('aria-label', 'Nivel ' + (n + 1) + ' ' + THEMES[L.theme].name);
    const st = save.done[n] ? '<span class="stars">' + '<i></i>'.repeat(save.done[n] === true ? 1 : save.done[n]) + '</span>' : '';
    b.innerHTML = `<img alt="" src="__UP__img/sub/card-${L.theme}.webp"><img class="chr" alt="" src="__UP__img/sub/sub.webp"><b>${n + 1}</b><span class="nm">${THEMES[L.theme].name}</span>${st}`;
    b.addEventListener('click', () => { sfx.tap(); start(n); }); box.appendChild(b);
  });
}
function showMenu() {
  music(false); game = null; app.hidden = true; $('#win').hidden = true; $('#confetti').hidden = true; $('#hud').hidden = true; $('#hint').hidden = true;
  $('#menu').hidden = false; $('#menuBg').hidden = false; $('#backBtn').hidden = true; $('#title').hidden = false; $('#winTxt').textContent = '¡LO LOGRASTE!';
  buildMenu();
}
$('#backBtn').addEventListener('click', () => { sfx.tap(); showMenu(); });
$('#menuBtn').addEventListener('click', () => { sfx.tap(); showMenu(); });
$('#againBtn').addEventListener('click', () => { sfx.tap(); start(game.n); });
$('#nextBtn').addEventListener('click', () => { sfx.tap(); start((game.n + 1) % LEVELS.length); });
let last = performance.now();
(function loop(t) { const dt = Math.min(.05, (t - last) / 1000); last = t; if (game && !app.hidden) { update(dt); draw(); } requestAnimationFrame(loop); })(last);
resize(); showMenu();
window.__sub = { start, update, draw, LEVELS, get game() { return game; } };
window.LEON_READY = true;

})();
</script>
