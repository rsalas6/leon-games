      k.bub.visible = true; k.bub.position.y = 3 + Math.sin(g.t * 3 + k.ph) * .2; k.bub.scale.setScalar(1.4 + Math.sin(g.t * 6 + k.ph) * .08);
      if (k.state === 'lost') { if (k.t > 2.5) { k.t = 0; play(o, 'jump', .1); setTimeout(() => { if (k.state === 'lost') play(o, 'idle'); }, 700); } turnTo(o, Math.atan2(m.x - k.x, m.z - k.z), dt, 3); }
      if (k.state === 'egg') { k.egg.rotation.z = Math.sin(g.t * 9 + k.ph) * (Math.sin(g.t * 1.3 + k.ph) > .6 ? .12 : .02); }
      const near = Math.hypot(m.x - k.x, m.z - k.z) < 2.3;
      if (near && g.phase === 'play') {
        if (k.state === 'egg') { k.state = 'hatch'; k.ht = 0; rsfx.crack(); }
        else { k.state = 'join'; k.jt = 0; rsfx.found(); burst(k.x, 1.2, k.z, 18, [0xff5d8f, 0xffffff, k.def.c], 4, .3, 5); play(o, 'jump', .1); banner('¡TE ENCONTRÉ!'); paintGoal(); g.sinceEvent = 0; }
      }
      if (!near && Math.random() < dt * .25 && Math.hypot(m.x - k.x, m.z - k.z) < 12) rsfx.cry();
      continue;
    }
    k.bub.visible = false;
    if (k.state === 'hatch') {
      k.ht += dt; k.egg.rotation.z = Math.sin(k.ht * 40) * .15 * (1 - k.ht);
      if (k.ht > .7) { const top = k.egg.userData.top; top.position.y += dt * 8; top.rotation.x += dt * 6; }
      if (k.ht > .75 && !o.visible) { o.visible = true; o.scale.multiplyScalar(.01); k.grow = 0; rsfx.crack(); burst(k.x, 1, k.z, 20, [0xfff6e4, 0xffffff, k.def.c], 4, .3, 5); }
      if (o.visible) { k.grow = Math.min(1, k.grow + dt * 3); const s = k.baseS || (k.baseS = o.scale.x / .01); o.scale.setScalar(s * (.01 + .99 * k.grow)); }
      if (k.ht > 1.3) { world.remove(k.egg); k.state = 'join'; k.jt = 0; rsfx.found(); play(o, 'jump', .1); banner('¡NACIÓ!'); paintGoal(); g.sinceEvent = 0; }
      continue;
    }
    if (k.state === 'join' || k.state === 'follow') {
      k.jt = (k.jt || 0) + dt; if (k.state === 'join' && k.jt > .8) { k.state = 'follow'; }
      if (k.state === 'follow') {
        line++; const tp = trailAt(line * 2.0 + 1.2), dx = tp.x - k.x, dz = tp.z - k.z, d = Math.hypot(dx, dz);
        const sp = Math.min(d * 6, 9); if (d > .05) { k.x += dx / d * Math.min(d, sp * dt); k.z += dz / d * Math.min(d, sp * dt); turnTo(o, Math.atan2(dx, dz), dt, 8); }
        const mv = d > .15; if (mv !== k.mv) { k.mv = mv; play(o, mv ? 'run' : 'idle'); }
        // ¡Llegamos al nido!
        if (Math.hypot(m.x - g.nest.x, m.z - g.nest.z) < 3.2 && g.phase === 'play') {
          k.state = 'nest'; k.nt = 0; const slot = g.home++; const a = slot / g.kids.length * Math.PI * 2 + .3; k.nx = g.nest.x + Math.cos(a) * 1.25; k.nz = g.nest.z + Math.sin(a) * 1.25; k.sx = k.x; k.sz = k.z;
          play(o, 'jump', .1); setTimeout(() => rsfx.home(slot * 2), slot * 120);
        }
      }
      o.position.set(k.x, 0, k.z); continue;
    }
    if (k.state === 'nest') {
      k.nt += dt; const f = Math.min(1, k.nt / .7);
      k.x = k.sx + (k.nx - k.sx) * f; k.z = k.sz + (k.nz - k.sz) * f; o.position.set(k.x, .35 + Math.sin(f * Math.PI) * 1.6, k.z); turnTo(o, Math.atan2(g.nest.x - k.x, g.nest.z - k.z) + Math.PI, dt, 6);
      if (f >= 1) { k.state = 'home'; burst(k.x, 1, k.z, 14, [0xffd23a, 0xff5d8f, 0xffffff], 3, .26, 4); play(o, 'idle'); paintGoal(); g.sinceEvent = 0; if (g.kids.every(q => q.state === 'home')) winLevel(); }
      continue;
    }
    if (k.state === 'home') { o.position.set(k.x, .35 + Math.max(0, Math.sin(g.t * 5 + k.ph)) * (g.phase === 'win' ? .6 : .12), k.z); turnTo(o, Math.atan2(k.x - g.nest.x, k.z - g.nest.z), dt, 4); }
  }
  // Flecha de ayuda: si mamá se queda quieta un rato, o lleva mucho sin encontrar a nadie
  let goalTile = null; const lost = g.kids.filter(k => k.state === 'lost' || k.state === 'egg'), following = g.kids.some(k => k.state === 'follow' || k.state === 'join');
  const [mx, my] = toTile(m.x, m.z), B = bfs(mx, my, false);
  if (following && (!lost.length || g.kids.filter(k => k.state === 'follow').length >= 3)) goalTile = [g.mz.cx, g.mz.cy];
  else { let bd = 1e9; for (const k of lost) { const d = B.dist[k.ty][k.tx]; if (d >= 0 && d < bd) { bd = d; goalTile = [k.tx, k.ty]; } }
    if (!goalTile) { for (const q of g.gates) if (!q.open && B.dist[q.by][q.bx] >= 0) { goalTile = [q.bx, q.by]; break; } }
    if (!goalTile && following) goalTile = [g.mz.cx, g.mz.cy]; }
  const help = goalTile && g.phase === 'play' && (g.idle > 2.2 || g.sinceEvent > 14) && !(goalTile[0] === mx && goalTile[1] === my);
  g.arrow.visible = g.arrowOut.visible = !!help;
  if (help) { const p = B.path(goalTile[0], goalTile[1]); const nx = p && p[1] ? p[1] : goalTile; const a = Math.atan2(tileX(nx[0]) - m.x, tileZ(nx[1]) - m.z), r = 1.9 + Math.sin(g.t * 6) * .2; for (const ar of [g.arrowOut, g.arrow]) { ar.position.set(m.x + Math.sin(a) * r, ar === g.arrow ? .1 : .08, m.z + Math.cos(a) * r); ar.rotation.y = a + Math.PI; } }
  g.helpTile = goalTile;
  g.marker.material.opacity = .5 + Math.sin(g.t * 8) * .3;
  // Animaciones
  mo.userData.mixer.update(dt); g.kids.forEach(k => k.obj.userData.mixer.update(dt));
  g.clouds.forEach(c => { c.position.x += c.userData.v * dt; if (c.position.x > 60) c.position.x = -60; });
  g.flies.forEach(f => { const u = f.userData; f.position.set(u.x + Math.sin(g.t * u.sp + u.ph) * 2, 1 + Math.sin(g.t * 1.7 + u.ph) * .6, u.z + Math.cos(g.t * u.sp * .8 + u.ph) * 2); });
  updateParts(dt); updateCamera(dt);
}

/* ---------- Menú ---------- */
function buildMenu() {
  const box = $('#levels'); box.innerHTML = '';
  LEVELS.forEach((L, n) => {
    const T = THEMES[L.theme], b = document.createElement('button'); b.className = 'px lv';
    b.setAttribute('aria-label', 'Nivel ' + (n + 1) + ' ' + T.name + (L.night ? ' de noche' : ''));
    b.innerHTML = `<img alt="" src="__UP__img/cards/rescue-${L.night ? 'noche' : L.theme}.webp"><b>${n + 1}</b><span class="goals">${'🦕'.repeat(L.babies)}${'🥚'.repeat(L.eggs)}${L.gates ? '🔑' : ''}</span>` + (save.done[n] ? '<span class="stars"><i></i></span>' : '');
    b.addEventListener('click', () => { sfx.tap(); start(n); });
    box.appendChild(b);
  });
}
function showMenu() {
  music(false);
  if (world) { scene.remove(world); world = null; }
  game = null; app.hidden = true; $('#win').hidden = true; $('#confetti').hidden = true; $('#hud').hidden = true; $('#hint').hidden = true;
  $('#menu').hidden = false; $('#menuBg').hidden = false; $('#backBtn').hidden = true; $('#title').hidden = false;
  buildMenu();
}
$('#backBtn').addEventListener('click', () => { sfx.tap(); showMenu(); });
$('#menuBtn').addEventListener('click', () => { sfx.tap(); showMenu(); });
$('#againBtn').addEventListener('click', () => { sfx.tap(); start(game.n); });
$('#nextBtn').addEventListener('click', () => { sfx.tap(); start((game.n + 1) % LEVELS.length); });

let last = performance.now();
(function loop(t) {
  const dt = Math.min(.05, (t - last) / 1000); last = t;
  if (game && !app.hidden) { update(dt); renderer.render(scene, camera); }
  requestAnimationFrame(loop);
})(last);
resize();
showMenu();
// Para pruebas: #nivel3 abre ese nivel; #nivel3diag lo juega solo (sigue la flecha de ayuda) y manda fotos a un servidor local
{ const m = /^#nivel(\d+)(diag)?$/.exec(location.hash); if (m) (async () => {
  await start(Math.min(LEVELS.length, +m[1]) - 1);
  if (!m[2]) return;
  const errs = []; addEventListener('error', e => errs.push(String(e.message)));
  const TG = 'rescue' + (game.n + 1);
  const post = (tag, info) => { renderer.render(scene, camera); return fetch('http://127.0.0.1:8799/', { method: 'POST', body: JSON.stringify({ tag, img: renderer.domElement.toDataURL('image/png'), info }) }); };
  const run = sec => { for (let i = 0; i < sec * 30; i++) update(1 / 30); };
  run(1); await post(TG + '-start', { n: game.n, gates: game.gates.length, kids: game.kids.length });
  let secs = 0, shots = 0, opened = 0;
  for (; secs < 300 && game.phase === 'play'; secs += 1) {
    game.idle = 3; run(.04); const tl = game.helpTile; if (tl) setTarget(tileX(tl[0]), tileZ(tl[1]));
    run(.96);
    if (shots === 0 && game.kids.some(k => k.state === 'follow')) { shots++; run(1.5); await post(TG + '-follow', { secs }); }
    if (shots === 1 && game.gates.some(q => q.open)) { shots++; await post(TG + '-gate', { secs }); }
  }
  run(2.5); await post(TG + '-end', { errs, phase: game.phase, secs, kids: game.kids.map(k => k.state), stars: game.starsGot, gates: game.gates.map(q => q.open) });
  if (/chain/.test(location.search) && game.n + 1 < LEVELS.length) { location.hash = '#nivel' + (game.n + 2) + 'diag'; location.reload(); }
})(); }
window.__rescue = { start, update, render: () => renderer.render(scene, camera), get game() { return game; }, camera, scene, setTarget };
window.LEON_READY = true;

})();
