<style>

<script>
(() => {
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.random() * a.length | 0];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let save = { done: {}, muted: false };
try { Object.assign(save, JSON.parse(localStorage.getItem('catapulta')) || {}); } catch (e) {}
const persist = () => { try { localStorage.setItem('catapulta', JSON.stringify(save)); } catch (e) {} };

/* ---------- Sonido (sintetizado, sin voz) ---------- */
let actx = null, noiseBuf = null;
function unlockAudio() {
  try {
    if (!actx) { actx = new (window.AudioContext || window.webkitAudioContext)(); const b = actx.createBufferSource(); b.buffer = actx.createBuffer(1, 1, 22050); b.connect(actx.destination); b.start(0);
      noiseBuf = actx.createBuffer(1, actx.sampleRate * .5, actx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    if (actx.state !== 'running') actx.resume();
  } catch (e) {}
}
['pointerdown', 'touchend', 'keydown'].forEach(ev => window.addEventListener(ev, unlockAudio, { passive: true }));
function beep(f, dur = .1, type = 'square', vol = .06, slide = 0, delay = 0) {
  if (save.muted || !actx) return;
  try { const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + delay; o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + dur); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + .02); } catch (e) {}
}
function noise(vol = .12, dur = .3, freq = 1200, q = .8) {
  if (save.muted || !actx || !noiseBuf) return;
  try { const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain(), t = actx.currentTime; s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur); s.connect(f).connect(g).connect(actx.destination); s.start(t); s.stop(t + dur + .05); } catch (e) {}
}
const sfx = { tap: () => beep(520, .07, 'square', .05, 200), win: () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => beep(f, .16, 'square', .06, 0, i * .12)), go: () => [523, 784, 1047].forEach((f, i) => beep(f, .14, 'square', .05, 0, i * .07)) };
let songTimer = null, songStep = 0;
function music(on, SONG, BASS, ms = 240) {
  clearInterval(songTimer); songTimer = null; if (!on) return;
  songTimer = setInterval(() => { if (save.muted || !actx || document.hidden) return; const n = SONG[songStep % SONG.length]; if (songStep % 4 !== 3) beep(587.3 * Math.pow(2, n / 12), .2, 'triangle', .018); if (songStep % 2 === 0) beep(146.8 * Math.pow(2, BASS[(songStep >> 1) % BASS.length] / 12), .32, 'sine', .028); songStep++; }, ms);
}
const ICON_ON = '<svg viewBox="0 0 16 16" fill="#2a1f3d"><path d="M1 6h3l4-4h1v12H8l-4-4H1z"/><path d="M11 5h1v1h1v4h-1v1h-1zM13 3h1v1h1v8h-1v1h-1v-2h1V5h-1z"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 16 16" fill="#2a1f3d"><path d="M1 6h3l4-4h1v12H8l-4-4H1z"/><path fill="#ff5d8f" d="M10 5h2v1h1V5h2v2h-1v1h1v2h-2v-1h-1v1h-2V8h1V7h-1z"/></svg>';
function paintMute() { $('#muteBtn').innerHTML = save.muted ? ICON_OFF : ICON_ON; }
$('#muteBtn').addEventListener('click', () => { save.muted = !save.muted; persist(); paintMute(); sfx.tap(); });
paintMute();
if (window.LEON_HUB) { const b = $('#homeBtn'); b.hidden = false; b.addEventListener('click', () => { sfx.tap(); location.href = window.LEON_HUB; }); }
['gesturestart', 'gesturechange'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
document.addEventListener('contextmenu', e => e.preventDefault());

const app = $('#app');
function banner(t) { document.querySelectorAll('#banner').forEach(x => x.remove()); const b = document.createElement('div'); b.id = 'banner'; b.textContent = t; document.body.appendChild(b); setTimeout(() => b.remove(), 1700); }
function confetti() {
  const c = $('#confetti'); c.hidden = false; const W = c.width = Math.ceil(innerWidth / 3), H = c.height = Math.ceil(innerHeight / 3), x = c.getContext('2d');
  const bits = Array.from({ length: 90 }, () => ({ x: Math.random() * W, y: -Math.random() * H * .6, v: rand(.6, 1.6), d: rand(-.4, .4), r: rand(0, 6), col: pick(['#ffd23a', '#ff5d8f', '#5ac8ff', '#6cc63a', '#fff']) })); const t0 = performance.now();
  (function f(t) { x.clearRect(0, 0, W, H); bits.forEach(b => { b.y += b.v; b.x += b.d; b.r += .1; x.fillStyle = b.col; x.save(); x.translate(b.x, b.y); x.rotate(b.r); x.fillRect(-2, -1, 4, 2); x.restore(); }); if (t - t0 < 3600 && !c.hidden) requestAnimationFrame(f); else c.hidden = true; })(t0);
}
const keys = new Set(); addEventListener('keydown', e => { if (e.key.startsWith('Arrow')) { keys.add(e.key); e.preventDefault(); } }); addEventListener('keyup', e => keys.delete(e.key));

/* ---------- Lienzo 2D (se ve nítido en el iPad) ---------- */
const cv = document.createElement('canvas'); app.appendChild(cv); const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() { DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
addEventListener('resize', resize);
// Imágenes del juego: se cargan al abrir un nivel (con barrita)
const IMG = {};
function loadImgs(list) {
  const need = list.filter(n => !IMG[n]); if (!need.length) return Promise.resolve();
  const ov = $('#lvlLoad'), bar = ov.querySelector('i'); ov.hidden = false; let done = 0;
  return Promise.all(need.map(n => new Promise(res => { const im = new Image(); im.onload = im.onerror = () => { done++; bar.style.width = Math.max(8, done / need.length * 100) + '%'; IMG[n] = im; res(); }; im.src = '__UP__img/' + n + '.webp'; }))).then(() => { ov.hidden = true; });
}
// Dibuja una imagen centrada en (x, y) con alto h (y ancho según su forma), girada a
function sprite(name, x, y, h, a = 0, flip = false, alpha = 1) {
  const im = IMG[name]; if (!im || !im.width) return; const w = h * im.width / im.height;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); if (a) ctx.rotate(a); if (flip) ctx.scale(-1, 1); ctx.drawImage(im, -w / 2, -h / 2, w, h); ctx.restore();
}
// Chispitas y textos que flotan
const P2 = [];
function sparks(x, y, n, cols, sp = 220, size = 7) { for (let i = 0; i < n; i++) { const a = rand(0, 6.3), v = rand(.3, 1) * sp; P2.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - sp * .3, life: rand(.5, 1), c: pick(cols), s: size * rand(.6, 1.3), rot: rand(0, 6) }); } }
function floatText(x, y, t, c = '#ffd23a') { P2.push({ x, y, vx: 0, vy: -80, life: 1, text: t, c }); }
function stepP2(dt, camX = 0) {
  for (let i = P2.length - 1; i >= 0; i--) { const p = P2[i]; p.life -= dt; if (p.life <= 0) { P2.splice(i, 1); continue; } p.x += p.vx * dt; p.y += p.vy * dt; if (!p.text) { p.vy += 500 * dt; p.rot += dt * 6; } }
}
function drawP2(camX = 0) {
  for (const p of P2) {
    ctx.globalAlpha = Math.min(1, p.life * 2);
    if (p.text) { ctx.font = `${Math.round(H * .05)}px 'Lilita One',sans-serif`; ctx.textAlign = 'center'; ctx.lineWidth = 6; ctx.strokeStyle = '#2a1f3d'; ctx.strokeText(p.text, p.x - camX, p.y); ctx.fillStyle = p.c; ctx.fillText(p.text, p.x - camX, p.y); }
    else { ctx.save(); ctx.translate(p.x - camX, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); ctx.restore(); }
  }
  ctx.globalAlpha = 1;
}
// Fondo que se repite de lado y se mueve más lento que el piso (se siente profundo)
function drawBg(name, camX, k = .25) {
  // Cada copia va en espejo de la anterior: así no se nota la unión aunque el dibujo no empate
  const im = IMG[name]; if (!im || !im.width) return; const h = H, w = h * im.width / im.height, off = camX * k; let i = Math.floor(off / w), x = i * w - off;
  for (; x < W; x += w, i++) { if (i % 2) { ctx.save(); ctx.translate(Math.floor(x) + Math.ceil(w), 0); ctx.scale(-1, 1); ctx.drawImage(im, 0, 0, Math.ceil(w) + 1, h); ctx.restore(); } else ctx.drawImage(im, Math.floor(x), 0, Math.ceil(w) + 1, h); }
}

/* ---------- Catapulta: jala la resortera y lanza pelotitas para tirar las torres y atrapar a los mapaches ladrones de galletas ---------- */

  { name: 'Hielo', bg: 'nieve', balls: ['red', 'blue', 'red'], parts: lvl(p => { const a = tower(17, 2, 'ice'), c = tower(21.5, 2, 'ice'); p.push(...a.blocks, ...c.blocks, r(17, 0), r(17, a.top), r(21.5, c.top)); }) },
  { name: 'Pirámide', bg: 'pradera', balls: ['red', 'yellow', 'red'], parts: lvl(p => { for (let row = 0; row < 4; row++) for (let i = 0; i <= 3 - row; i++) p.push(b(16 + i * 1.3 + row * .65, row * 1.1, 1.1, 1.1)); p.push(r(17.95, 4.4), r(15, 0), r(21, 0)); }) },

  { name: 'Iglú', bg: 'nieve', balls: ['blue', 'blue', 'red'], parts: lvl(p => { const a = tower(16, 1, 'ice', 2), c = tower(19, 2, 'ice', 2), d = tower(22, 1, 'ice', 2); p.push(...a.blocks, ...c.blocks, ...d.blocks, r(16, 0), r(19, 0), r(22, 0), r(19, c.top)); }) },

const ksx = {

const IMGS = ['catapulta/red', 'catapulta/blue', 'catapulta/yellow', 'catapulta/raccoon', 'catapulta/raccoon2', 'catapulta/sling', 'catapulta/cookie', 'catapulta/star'];

/* ---------- Juego ---------- */
let game = null;
async function start(n) { const L = LEVELS[n]; await loadImgs([...IMGS, 'catapulta/bg-' + L.bg]); startNow(n); }
const SLING = { x: 4, y: 2.6 }, BALL_R = .45;
function startNow(n) {

function g0() { const g = game; g.frozen = true; g.unfreezeT = -9; g.minX = Math.min(...g.blocks.map(o => o.body.getPosition().x - o.w / 2), ...g.racs.map(o => o.body.getPosition().x - .6)); }

function paintHud() { const g = game; $('#goal').innerHTML = `<span class="gi"><img alt="" src="__UP__img/catapulta/raccoon.webp">${g.racs.filter(r => !r.dead).length}</span><span class="balls">${[g.cur, ...g.balls].filter(Boolean).map(k => `<img alt="" src="__UP__img/catapulta/${k}.webp">`).join('')}</span>`; }

/* ---------- Pantalla: metros -> pixeles (se ve todo el nivel) ---------- */
const view = () => { const s = Math.min(W / 25.5, H / 13.5), gy = H * .86; return { s, gy, ox: (W - 25.5 * s) / 2 - 1.5 * s }; };
const toS = (x, y) => { const v = view(); return [v.ox + x * v.s, v.gy - y * v.s]; };
const toW = (px, py) => { const v = view(); return [(px - v.ox) / v.s, (v.gy - py) / v.s]; };

/* ---------- Jalar y soltar ---------- */
app.addEventListener('pointerdown', e => {
  const g = game; if (!g) return;
  if (g.phase === 'fly' && !g.power && g.shot.length) return usePower();
  if (g.phase !== 'aim') return; g.pull = { sx: e.clientX, sy: e.clientY, dx: 0, dy: 0 }; ksx.pull(); try { app.setPointerCapture(e.pointerId); } catch (er) {}

}
function usePower() {

  if (o.type === 'blue') { ksx.power(); for (const da of [-.22, .22]) { const ang = Math.atan2(v.y, v.x) + da, sp = Math.hypot(v.x, v.y); const body = g.world.createBody({ type: 'dynamic', position: V(p.x, p.y + da), bullet: true }); body.createFixture(pl.Circle(BALL_R * .75), { density: 3, friction: .5, restitution: .35 }); body.setLinearVelocity(V(Math.cos(ang) * sp, Math.sin(ang) * sp)); const n = { body, kind: 'ball', type: 'blue', small: 1, t: 0 }; body.setUserData(n); g.shot.push(n); } sparksW(p.x, p.y, ['#5ac8ff', '#fff']); }

function sparksW(x, y, cols, n = 12) { const [a, c] = toS(x, y); sparks(a, c, n, cols, 220, 7); }

function update(dt) {

/* ---------- Dibujo ---------- */

}

  let next = LEVELS.findIndex((_, n) => !save.done[n]); if (next < 0) next = 0;
  LEVELS.forEach((L, n) => {
    const bt = document.createElement('button'); bt.className = 'px lv' + (n === next ? ' next' : ''); bt.setAttribute('aria-label', 'Nivel ' + (n + 1) + ' ' + L.name);
    const st = save.done[n] ? '<span class="stars">' + '<i></i>'.repeat(save.done[n] === true ? 1 : save.done[n]) + '</span>' : '';
    bt.innerHTML = `<img alt="" src="__UP__img/catapulta/card-${L.bg}.webp"><img class="chr" alt="" src="__UP__img/catapulta/raccoon.webp"><b>${n + 1}</b><span class="nm">${L.name}</span>${st}`;
    bt.addEventListener('click', () => { sfx.tap(); start(n); }); box.appendChild(bt);
  });
}

  music(false); game = null; app.hidden = true; $('#win').hidden = true; $('#confetti').hidden = true; $('#hud').hidden = true; $('#hint').hidden = true;

  buildMenu();
}

let last = performance.now();
(function loop(t) { const dt = Math.min(.05, (t - last) / 1000); last = t; if (game && !app.hidden) { update(dt); draw(); } requestAnimationFrame(loop); })(last);
resize(); showMenu();
window.__cat = { start, update, draw, launch, usePower, LEVELS, get game() { return game; } };
window.LEON_READY = true;
