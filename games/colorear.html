<title>Colorear</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: arriba casita y sonido. Galería de dibujos (con estrellita los que ya terminó). Al abrir uno: el dibujo grande al centro y la paleta de colores (botes) a un lado; un toque rellena el área. */
@font-face{font-family:'Lilita One';font-style:normal;font-weight:400;font-display:block;src:url(__UP__vendor/fonts/i7dPIFZ9Zz-WBtRtedDbYEF8RXi4EwQ.woff2) format('woff2')}
:root{--ink:#2a1f3d;--sun:#ffd23a;--grass:#6cc63a;--pink:#ff6fae;--pix:'Lilita One','Arial Rounded MT Bold',sans-serif;color-scheme:light}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;color:var(--ink);font-family:var(--pix);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none;
  background:radial-gradient(circle at 20% 15%,#fff3b0 0 8%,transparent 9%),radial-gradient(circle at 85% 80%,#c8f0ff 0 10%,transparent 11%),radial-gradient(circle at 80% 20%,#ffd6ea 0 7%,transparent 8%),linear-gradient(#fff8ec,#ffeef8)}
button{font-family:var(--pix);touch-action:manipulation;-webkit-touch-callout:none;cursor:pointer;color:var(--ink);border:0}
.px{border-radius:18px;background:#fff;box-shadow:0 0 0 4px var(--ink),0 8px 0 4px rgba(42,31,61,.3)}
.px:active{transform:translateY(4px);box-shadow:0 0 0 4px var(--ink),0 4px 0 4px rgba(42,31,61,.3)}
.ibtn{width:56px;height:56px;padding:0;display:grid;place-items:center}
.ibtn svg{width:28px;height:28px}
.bar{position:fixed;left:0;right:0;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.bar>*{pointer-events:auto}
.bar .sp{flex:1}
h1{margin:0;font-weight:400;font-size:clamp(30px,6vw,54px);color:var(--pink);-webkit-text-stroke:.08em var(--ink);paint-order:stroke fill;text-shadow:0 .1em 0 var(--ink);pointer-events:none}
/* Galería */
#gallery{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 92px) max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(18px,env(safe-area-inset-left,0px))}
#pics{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(130px,22vw,220px),1fr));gap:clamp(14px,2.4vw,26px)}
.pic{position:relative;aspect-ratio:1;padding:10px;display:grid;place-items:center}
.pic img{position:absolute;inset:12px;width:calc(100% - 24px);height:calc(100% - 24px);object-fit:contain}
.pic .st{position:absolute;right:-12px;top:-12px;width:42px;height:42px;background:var(--sun);clip-path:polygon(50% 0,62% 34%,100% 36%,70% 58%,80% 100%,50% 76%,20% 100%,30% 58%,0 36%,38% 34%)}
/* Pintar */
#paint{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:calc(env(safe-area-inset-top,0px) + 84px) max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(14px,env(safe-area-inset-left,0px))}
#stage{position:relative;min-width:0;min-height:0;display:grid;place-items:center}
#cv{background:#fff;border-radius:22px;box-shadow:0 0 0 5px var(--ink),0 10px 0 5px rgba(42,31,61,.2);touch-action:none;max-width:100%;max-height:100%}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#pal{display:grid;grid-template-columns:repeat(2,var(--pb));gap:12px;align-content:center}
#pal button{width:var(--pb);height:var(--pb);border-radius:50%;padding:0;box-shadow:0 0 0 4px var(--ink),0 6px 0 4px rgba(42,31,61,.3);position:relative}
#pal button.on{transform:scale(1.14);box-shadow:0 0 0 4px var(--ink),0 0 0 9px #fff,0 0 0 13px var(--ink)}
#pal button.rain{background:conic-gradient(#ff4d6d,#ffb340,#ffe14a,#6cd24a,#3ab0ff,#a070ff,#ff4d6d)}
#pal button.tool{background:#fff;font-size:calc(var(--pb) * .45)}
@media (orientation:portrait){#paint{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}#pal{grid-template-columns:repeat(7,var(--pb));justify-content:center}}
#done{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;pointer-events:none}
#done h2{margin:0;font-weight:400;font-size:clamp(46px,10vw,100px);color:var(--sun);-webkit-text-stroke:.07em var(--ink);paint-order:stroke fill;text-shadow:0 .08em 0 var(--ink);animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
#done .row{display:flex;gap:18px;pointer-events:auto}
#done .row button{padding:16px 26px;font-size:clamp(20px,3vw,28px)}
#done .go{background:var(--grass)}
@keyframes pop{from{transform:scale(.2)}70%{transform:scale(1.15)}to{transform:none}}
</style>

<div class="bar">
  <button class="px ibtn" id="homeBtn" aria-label="Volver a los juegos" hidden><svg viewBox="0 0 16 16"><path fill="#2a1f3d" d="M8 1h0l7 6v1h-2v7H9v-4H7v4H3V8H1V7z"/><path fill="#ff5d8f" d="M4 8h8v6h-2v-4H6v4H4z"/></svg></button>
  <button class="px ibtn" id="backBtn" aria-label="Elegir otro dibujo" hidden><svg viewBox="0 0 16 16" fill="#2a1f3d"><path d="M1 1h6v6H1zM9 1h6v6H9zM1 9h6v6H1zM9 9h6v6H9z"/></svg></button>
  <div class="sp"></div><h1 id="title">¡A COLOREAR!</h1><div class="sp"></div>
  <button class="px ibtn" id="muteBtn" aria-label="Sonido"></button>
</div>
<main id="gallery"><div id="pics"></div></main>
<section id="paint" hidden>
  <div id="stage"><canvas id="cv"></canvas><canvas id="fx"></canvas></div>
  <div id="pal"></div>
</section>
<div id="done" hidden><h2>¡QUÉ BONITO!</h2><div class="row"><button class="px" id="moreBtn">Otro dibujo</button><button class="px go" id="keepBtn">Seguir pintando</button></div></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.random() * a.length | 0];
const UP = '__UP__img/color/';
const PICS = ['trex', 'trice', 'stego', 'longneck', 'egg', 'truck', 'rocket', 'fish', 'cat', 'house', 'butterfly', 'icecream'];
let save = { muted: false, art: {} };
try { Object.assign(save, JSON.parse(localStorage.getItem('colorear')) || {}); } catch (e) {}
const persist = () => { try { localStorage.setItem('colorear', JSON.stringify(save)); } catch (e) {} };

/* ---------- Sonido ---------- */
let actx = null;
function unlockAudio() { try { if (!actx) { actx = new (window.AudioContext || window.webkitAudioContext)(); const b = actx.createBufferSource(); b.buffer = actx.createBuffer(1, 1, 22050); b.connect(actx.destination); b.start(0); } if (actx.state !== 'running') actx.resume(); } catch (e) {} }
['pointerdown', 'touchend'].forEach(ev => addEventListener(ev, unlockAudio, { passive: true }));
function beep(f, dur = .1, type = 'square', vol = .05, slide = 0, delay = 0) { if (save.muted || !actx) return; try { const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + delay; o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + dur); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + .02); } catch (e) {} }
const sfx = {
  tap: () => beep(660, .06, 'triangle', .05, 200),
  fill: i => { beep(392 * Math.pow(2, [0, 2, 4, 7, 9, 12][i % 6] / 12), .1, 'triangle', .06, 300); beep(1200, .05, 'sine', .03, 600, .05); },
  pick: () => beep(880, .05, 'sine', .05, 200),
  undo: () => beep(500, .08, 'triangle', .05, -200),
  done: () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => beep(f, .14, 'square', .05, 0, i * .1)),
};
const ICON_ON = '<svg viewBox="0 0 16 16" fill="#2a1f3d"><path d="M1 6h3l4-4h1v12H8l-4-4H1z"/><path d="M11 5h1v1h1v4h-1v1h-1zM13 3h1v1h1v8h-1v1h-1v-2h1V5h-1z"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 16 16" fill="#2a1f3d"><path d="M1 6h3l4-4h1v12H8l-4-4H1z"/><path fill="#ff5d8f" d="M10 5h2v1h1V5h2v2h-1v1h1v2h-2v-1h-1v1h-2V8h1V7h-1z"/></svg>';
function paintMute() { $('#muteBtn').innerHTML = save.muted ? ICON_OFF : ICON_ON; }
$('#muteBtn').addEventListener('click', () => { save.muted = !save.muted; persist(); paintMute(); });
paintMute();
if (window.LEON_HUB) { const b = $('#homeBtn'); b.hidden = false; b.addEventListener('click', () => { location.href = window.LEON_HUB; }); }
['gesturestart', 'gesturechange'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));

/* ---------- Colores ---------- */
const COLORS = ['#ff3b5c', '#ff8a2a', '#ffd23a', '#7ad84a', '#2fb36a', '#3ab0ff', '#2a5ad8', '#a070ff', '#ff6fc8', '#9a5a2a', '#ffffff', '#2a1f3d'];
let cur = 0, rainbowI = 0;

/* ---------- Un dibujo: regiones listas para rellenar ---------- */
// El dibujo viene con líneas negras, interior blanco y afuera transparente. Se calcula una vez qué pixeles forman cada área cerrada.
const N = 720;   // resolución de trabajo
const pics = {};
function loadPic(name) {
  if (pics[name]) return Promise.resolve(pics[name]);
  return new Promise(res => { const im = new Image(); im.onload = () => {
    const c = document.createElement('canvas'); c.width = c.height = N; const x = c.getContext('2d');
    const k = Math.min(N * .94 / im.width, N * .94 / im.height), w = im.width * k, h = im.height * k; x.drawImage(im, (N - w) / 2, (N - h) / 2, w, h);
    const d = x.getImageData(0, 0, N, N).data, wall = new Uint8Array(N * N);
    for (let i = 0; i < N * N; i++) { const a = d[i * 4 + 3], l = (d[i * 4] + d[i * 4 + 1] + d[i * 4 + 2]) / 3; wall[i] = a < 128 ? 2 : l < 150 ? 1 : 0; }
    // Etiqueta cada área blanca (relleno por renglones)
    const lab = new Int32Array(N * N).fill(-1), regions = []; const st = [];
    for (let s = 0; s < N * N; s++) { if (wall[s] || lab[s] >= 0) continue; const id = regions.length; let n = 0; st.push(s); lab[s] = id;
      while (st.length) { const p = st.pop(); n++; const px = p % N, py = p / N | 0;
        if (px > 0 && !wall[p - 1] && lab[p - 1] < 0) { lab[p - 1] = id; st.push(p - 1); }
        if (px < N - 1 && !wall[p + 1] && lab[p + 1] < 0) { lab[p + 1] = id; st.push(p + 1); }
        if (py > 0 && !wall[p - N] && lab[p - N] < 0) { lab[p - N] = id; st.push(p - N); }
        if (py < N - 1 && !wall[p + N] && lab[p + N] < 0) { lab[p + N] = id; st.push(p + N); } }
      regions.push({ n }); }
    // Las líneas grises de la orilla se pintan con el área vecina (así no quedan bordes blancos)
    for (let pass = 0; pass < 3; pass++) { const add = []; for (let p = 0; p < N * N; p++) { if (lab[p] >= 0 || wall[p] === 2) continue; const l = (d[p * 4] + d[p * 4 + 1] + d[p * 4 + 2]) / 3; if (l < 70) continue; const nb = [p - 1, p + 1, p - N, p + N].find(q => q >= 0 && q < N * N && lab[q] >= 0); if (nb != null) add.push([p, lab[nb]]); } for (const [p, id] of add) lab[p] = id; }
    const big = regions.map((r, i) => r.n > 60 ? i : -1).filter(i => i >= 0);
    // Imagen de las líneas: lo blanco se vuelve transparente para dibujarla encima de los colores
    const li = x.getImageData(0, 0, N, N); for (let i = 0; i < N * N; i++) { const l = (li.data[i * 4] + li.data[i * 4 + 1] + li.data[i * 4 + 2]) / 3; li.data[i * 4 + 3] = li.data[i * 4 + 3] < 128 ? 0 : Math.max(0, Math.min(255, (255 - l) * 1.6)); li.data[i * 4] = li.data[i * 4 + 1] = li.data[i * 4 + 2] = 30; }
    const lc = document.createElement('canvas'); lc.width = lc.height = N; lc.getContext('2d').putImageData(li, 0, 0);
    const outside = new Uint8Array(N * N); for (let i = 0; i < N * N; i++) outside[i] = wall[i] === 2 ? 1 : 0;
    res(pics[name] = { name, lab, regions, big, lines: lc, outside });
  }; im.onerror = () => res(null); im.src = UP + name + '.webp'; });
}

/* ---------- Galería ---------- */
function showGallery() {
  $('#gallery').hidden = false; $('#paint').hidden = true; $('#done').hidden = true; $('#backBtn').hidden = true; $('#title').textContent = '¡A COLOREAR!';
  $('#pics').innerHTML = PICS.map(n => `<button class="px pic" data-n="${n}">${save.art[n] && save.art[n].img ? `<img alt="" src="${save.art[n].img}">` : `<img alt="" src="${UP}${n}.webp">`}${save.art[n] && save.art[n].done ? '<span class="st"></span>' : ''}</button>`).join('');
  $('#pics').querySelectorAll('.pic').forEach(b => b.addEventListener('click', () => { sfx.tap(); openPic(b.dataset.n); }));
}
$('#backBtn').addEventListener('click', () => { sfx.tap(); saveArt(); showGallery(); });

/* ---------- Pintar ---------- */
const cv = $('#cv'), cx = cv.getContext('2d'), fx = $('#fx'), fxc = fx.getContext('2d');
const fill = document.createElement('canvas'); fill.width = fill.height = N; const fc = fill.getContext('2d');
let P = null, colorsOf = {}, history = [], sparks = [];
function openPic(name) {
  loadPic(name).then(p => {
    if (!p) return;
    P = p; colorsOf = Object.assign({}, (save.art[name] && save.art[name].c) || {}); history = [];
    $('#gallery').hidden = true; $('#paint').hidden = false; $('#backBtn').hidden = false; $('#done').hidden = true; $('#title').textContent = '';
    repaintFill(); layout(); draw();
  });
}
function repaintFill() {
  const im = fc.createImageData(N, N), d = im.data, rgb = {};
  for (const [id, c] of Object.entries(colorsOf)) rgb[id] = [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
  for (let p = 0; p < N * N; p++) { const id = P.lab[p]; if (id < 0) { if (!P.outside[p]) { d[p * 4 + 3] = 255; d[p * 4] = d[p * 4 + 1] = d[p * 4 + 2] = 255; } continue; } const c = rgb[id]; d[p * 4] = c ? c[0] : 255; d[p * 4 + 1] = c ? c[1] : 255; d[p * 4 + 2] = c ? c[2] : 255; d[p * 4 + 3] = 255; }
  fc.putImageData(im, 0, 0);
}
function paintRegion(id, color) {
  const im = fc.getImageData(0, 0, N, N), d = im.data, r = parseInt(color.slice(1, 3), 16), g = parseInt(color.slice(3, 5), 16), b = parseInt(color.slice(5, 7), 16);
  for (let p = 0; p < N * N; p++) if (P.lab[p] === id) { d[p * 4] = r; d[p * 4 + 1] = g; d[p * 4 + 2] = b; d[p * 4 + 3] = 255; }
  fc.putImageData(im, 0, 0);
}
function layout() {
  const st = $('#stage').getBoundingClientRect(), s = Math.floor(Math.min(st.width, st.height) - 12), dpr = Math.min(2, devicePixelRatio || 1);
  cv.style.width = cv.style.height = s + 'px'; cv.width = cv.height = s * dpr;
  fx.width = st.width * dpr; fx.height = st.height * dpr; fxc.setTransform(dpr, 0, 0, dpr, 0, 0);
  const port = innerHeight > innerWidth, pb = port ? Math.min(58, (innerWidth - 40) / 7.6) : Math.min(76, (innerHeight - 140) / 7.4);
  document.documentElement.style.setProperty('--pb', Math.max(40, pb) + 'px');
}
addEventListener('resize', () => { if (!$('#paint').hidden) { layout(); draw(); } });
function draw() {
  if (!P) return; const s = cv.width; cx.clearRect(0, 0, s, s); cx.imageSmoothingEnabled = true;
  cx.drawImage(fill, 0, 0, s, s); cx.drawImage(P.lines, 0, 0, s, s);
}
// Paleta: 12 botes, arcoíris (cada toque otro color) y deshacer
$('#pal').innerHTML = COLORS.map((c, i) => `<button data-c="${i}" style="background:${c}" aria-label="Color"></button>`).join('') + '<button class="rain" data-c="r" aria-label="Arcoíris"></button><button class="tool" data-c="u" aria-label="Deshacer">↩️</button>';
function paintPal() { $('#pal').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.c === String(cur))); }
$('#pal').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
  const c = b.dataset.c;
  if (c === 'u') { const h = history.pop(); if (!h) return; if (h.prev) colorsOf[h.id] = h.prev; else delete colorsOf[h.id]; repaintFill(); draw(); sfx.undo(); return; }
  cur = c === 'r' ? 'r' : +c; paintPal(); sfx.pick();
}));
paintPal();
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); if (!P) return;
  const r = cv.getBoundingClientRect(), x = Math.floor((e.clientX - r.left) / r.width * N), y = Math.floor((e.clientY - r.top) / r.height * N);
  // Si tocó una línea, busca el área más cercana (para dedos chiquitos)
  let id = -1; for (let rad = 0; rad <= 14 && id < 0; rad += 2) for (let a = 0; a < 16 && id < 0; a++) { const px = Math.round(x + Math.cos(a / 16 * 6.28) * rad), py = Math.round(y + Math.sin(a / 16 * 6.28) * rad); if (px >= 0 && py >= 0 && px < N && py < N) { const l = P.lab[py * N + px]; if (l >= 0 && P.regions[l].n > 60) id = l; } if (rad === 0) break; }
  if (id < 0) return;
  const color = cur === 'r' ? COLORS[(rainbowI++) % 10] : COLORS[cur];
  history.push({ id, prev: colorsOf[id] }); colorsOf[id] = color; paintRegion(id, color); draw();
  sfx.fill(Object.keys(colorsOf).length);
  for (let i = 0; i < 14; i++) sparks.push({ x: e.clientX, y: e.clientY, vx: rand(-1, 1), vy: rand(-1.4, -.2), t: 0, c: pick(['#fff', color, '#ffd23a']) });
  saveArtSoon();
  // ¿Ya pintó casi todo? ¡Felicidades!
  const filled = P.big.filter(i => colorsOf[i]).length;
  if (!save.art[P.name]?.done && filled >= Math.ceil(P.big.length * .85)) { (save.art[P.name] = save.art[P.name] || {}).done = 1; saveArt(); setTimeout(() => { $('#done').hidden = false; sfx.done(); for (let i = 0; i < 80; i++) sparks.push({ x: innerWidth / 2 + rand(-200, 200), y: innerHeight * .4, vx: rand(-2, 2), vy: rand(-3, -.5), t: 0, c: pick(COLORS), conf: 1 }); }, 300); }
});
let saveT = null; function saveArtSoon() { clearTimeout(saveT); saveT = setTimeout(saveArt, 600); }
function saveArt() {
  if (!P) return; const t = document.createElement('canvas'); t.width = t.height = 220; const x = t.getContext('2d'); x.drawImage(fill, 0, 0, 220, 220); x.drawImage(P.lines, 0, 0, 220, 220);
  save.art[P.name] = Object.assign(save.art[P.name] || {}, { c: colorsOf, img: t.toDataURL('image/webp', .7) }); persist();
}
$('#moreBtn').addEventListener('click', () => { sfx.tap(); saveArt(); showGallery(); });
$('#keepBtn').addEventListener('click', () => { sfx.tap(); $('#done').hidden = true; });

// Chispitas al rellenar
let lt = performance.now();
(function loop(t) { const dt = Math.min(.05, (t - lt) / 1000); lt = t;
  if (sparks.length || fx._dirty) { const r = $('#stage').getBoundingClientRect(); fxc.clearRect(0, 0, r.width + 400, r.height + 400);
    for (const s of sparks) { s.t += dt; const X = s.x - r.left + s.vx * s.t * (s.conf ? 300 : 160), Y = s.y - r.top + s.vy * s.t * (s.conf ? 300 : 160) + s.t * s.t * (s.conf ? 500 : 260); fxc.fillStyle = s.c; fxc.strokeStyle = '#2a1f3d'; fxc.lineWidth = 2;
      if (s.conf) { fxc.save(); fxc.translate(X, Y); fxc.rotate(s.t * 8); fxc.fillRect(-7, -4, 14, 8); fxc.restore(); } else { const rr = 8 * (1 - s.t); fxc.beginPath(); for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5, q = i % 2 ? rr * .45 : rr; fxc.lineTo(X + Math.cos(a) * q, Y + Math.sin(a) * q); } fxc.closePath(); fxc.fill(); fxc.stroke(); } }
    sparks = sparks.filter(s => s.t < (s.conf ? 2.5 : 1)); fx._dirty = sparks.length > 0; }
  requestAnimationFrame(loop); })(lt);

showGallery();
window.LEON_READY = true;
window.__color = { openPic, get P() { return P; }, get colorsOf() { return colorsOf; }, COLORS, PICS, loadPic };
if (location.hash === '#diag') (async () => {
  const errs = []; addEventListener('error', e => errs.push(e.message));
  const info = []; for (const n of PICS) { const p = await loadPic(n); info.push(n + ':' + (p ? p.big.length : 'X')); }
  // Pinta un dibujo completo tocando el centro de cada área
  openPic('trex'); await new Promise(r => setTimeout(r, 400));
  const p = pics.trex, r = cv.getBoundingClientRect();
  for (const id of p.big) { let sx = 0, sy = 0, n = 0; for (let i = 0; i < N * N; i += 7) if (p.lab[i] === id) { sx += i % N; sy += i / N | 0; n++; } let px = Math.round(sx / n), py = Math.round(sy / n); if (p.lab[py * N + px] !== id) { for (let i = 0; i < N * N; i++) if (p.lab[i] === id) { px = i % N; py = i / N | 0; break; } }
    cur = Math.random() * 10 | 0; cv.dispatchEvent(new PointerEvent('pointerdown', { clientX: r.left + (px + .5) / N * r.width, clientY: r.top + (py + .5) / N * r.height, bubbles: true })); }
  await new Promise(r2 => setTimeout(r2, 900));
  fetch('http://127.0.0.1:8799/', { method: 'POST', body: JSON.stringify({ tag: 'color-trex', img: cv.toDataURL('image/png'), info: { ua: navigator.userAgent, errs, regions: info, filled: Object.keys(colorsOf).length, done: !$('#done').hidden } }) });
