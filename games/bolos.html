      if (b.gutter) { b.x += (Math.sign(b.x) * (LANE_W / 2 + .4) - b.x) * .2; b.y = BALL_R - .35; }
      // Choque con bolos parados
      if (!b.gutter) for (const p of g.pins) if (!p.down) { const dx = p.x - b.x, dz = p.z - b.z, d = Math.hypot(dx, dz); if (d < BALL_R + p.r) { const sp = Math.hypot(b.vx, b.vz); knock(p, dx / d * sp * .45 + b.vx * .25 + rand(-1.5, 1.5), dz / d * sp * .45 + b.vz * .25); b.vx -= dx / d * 2.2; b.vz *= .9; } }
    }
    b.obj.position.set(b.x, b.y, b.z); b.obj.rotation.x += b.vz * dt / BALL_R;
    if (b.z < PIN_Z - 2.5) { b.obj.visible = false; b.vx = b.vz = 0; }
  }
  // Bolos que vuelan y tumban a otros
  let moving = false;
  for (const p of g.pins) {
    if (!p.down) continue;
    if (Math.hypot(p.vx, p.vz) > .3) moving = true;
    p.x += p.vx * dt; p.z += p.vz * dt; p.vy -= 14 * dt; p.y = Math.max(0, p.y + p.vy * dt); if (p.y === 0) { p.vx *= Math.pow(.15, dt); p.vz *= Math.pow(.15, dt); }
    p.tilt = Math.min(Math.PI / 2, p.tilt + dt * 7);
    for (const q of g.pins) if (!q.down && q !== p) { const dx = q.x - p.x, dz = q.z - p.z, d = Math.hypot(dx, dz); if (d < p.r + q.r + .25 * Math.sin(p.tilt) && Math.hypot(p.vx, p.vz) > 2.6 && !q.miss) { if (Math.random() < .3) { q.miss = true; continue; } knock(q, p.vx * .5 + dx / d * 1.2, p.vz * .5 + dz / d * 1.2); p.vx *= .6; p.vz *= .6; } }
    if (p.z < PIN_Z - 2.4) { p.vz = Math.max(p.vz, -1); p.y = Math.max(-.6, p.y - dt * 2); }
    p.obj.position.set(p.x, p.y, p.z); p.obj.rotation.set(0, 0, 0); p.obj.rotateY(p.tiltDir); p.obj.rotateX(p.tilt); p.obj.rotateY(p.spin * p.tilt * .3);
  }
  g.pins.forEach(p => { if (!p.down) p.obj.position.x = p.x; if (p.obj.userData.mixer) p.obj.userData.mixer.update(dt); });
  // Fin del tiro: la bola ya pasó y nada se mueve
  if (g.phase === 'roll' && ((!b.obj.visible || b.gutter && b.z < PIN_Z) && !moving && g.rollT > 1.2 || g.rollT > 7)) endThrow();
  if (g.phase === 'wait') { g.waitT -= dt; if (g.waitT <= 0) nextStep(); }
  (g.glows || []).forEach(f => { const u = f.userData; f.position.set(u.x + Math.sin(g.t + u.ph), 1 + Math.sin(g.t * 1.7 + u.ph) * .5, u.z); });
  updateParts(dt); updateCamera(dt);
}
function endThrow() {
  const g = game; g.phase = 'wait'; g.waitT = 1.6;
  const fresh = g.pins.filter(p => p.down && !p.counted); fresh.forEach(p => { p.counted = true; g.score += p.gold ? 5 : 1; });
  const left = g.pins.filter(p => !p.down).length;
  if (fresh.length) { bsfx.hit(fresh.length); fresh.forEach(p => burst(p.x, .8, p.z, 4, [0xffd23a, 0xffffff, 0xff5d8f], 3, .25, 4)); }
  if (!left) { banner(g.throwN === 1 ? '¡CHUZA!' : '¡TODOS!'); bsfx.strike(); confetti(); g.cleared = true; }
  else if (!fresh.length) banner('¡OTRA VEZ!');
  else banner(fresh.length + ' ' + (fresh.length === 1 ? 'BOLO' : 'BOLOS'));
  paintHud();
}
function nextStep() {
  const g = game;
  if (g.cleared || g.throwN >= 2) {
    g.cleared = false; g.round++; g.throwN = 1;
    if (g.round > ROUNDS) return winLevel();
    setPins(false);
  } else { g.throwN++; setPins(true); }
  resetBall(); paintHud();
}
function winLevel() {
  const g = game; g.phase = 'done'; const max = ROUNDS * (g.L.pins === 'gigantes' ? 10 : 10), pct = g.score / max, stars = pct >= .8 ? 3 : pct >= .5 ? 2 : 1;
  save.done[g.n] = Math.max(save.done[g.n] || 0, stars); persist();
  sfx.win(); confetti(); $('#winTxt').innerHTML = '¡' + g.score + ' BOLOS!<br>' + '⭐'.repeat(stars);
  setTimeout(() => { if (game === g) $('#win').hidden = false; }, 900);
}

/* ---------- Menú ---------- */
function buildMenu() {
  const box = $('#levels'); box.innerHTML = '';
  LEVELS.forEach((L, n) => {
    const b = document.createElement('button'); b.className = 'px lv'; b.setAttribute('aria-label', 'Nivel ' + (n + 1) + ' ' + L.name);
    const st = save.done[n] ? '<span class="stars">' + '<i></i>'.repeat(save.done[n] === true ? 1 : save.done[n]) + '</span>' : '';
    b.innerHTML = `<img alt="" src="__UP__img/cards/bolos-${L.card}.webp"><b>${n + 1}</b><span class="nm">${L.name}</span>${st}`;
    b.addEventListener('click', () => { sfx.tap(); start(n); }); box.appendChild(b);
  });
}
function showMenu() {
  music(false); if (world) { scene.remove(world); world = null; }
  game = null; app.hidden = true; $('#win').hidden = true; $('#confetti').hidden = true; $('#hud').hidden = true; $('#hint').hidden = true;
  $('#menu').hidden = false; $('#menuBg').hidden = false; $('#backBtn').hidden = true; $('#title').hidden = false; $('#winTxt').textContent = '¡LO LOGRASTE!';
  buildMenu();
}
$('#backBtn').addEventListener('click', () => { sfx.tap(); showMenu(); });
$('#menuBtn').addEventListener('click', () => { sfx.tap(); showMenu(); });
$('#againBtn').addEventListener('click', () => { sfx.tap(); start(game.n); });
$('#nextBtn').addEventListener('click', () => { sfx.tap(); start((game.n + 1) % LEVELS.length); });
let last = performance.now();
(function loop(t) { const dt = Math.min(.05, (t - last) / 1000); last = t; if (game && !app.hidden) { update(dt); renderer.render(scene, camera); } requestAnimationFrame(loop); })(last);
resize(); showMenu();
window.__bolos = { start, update, throwBall, render: () => renderer.render(scene, camera), get game() { return game; }, camera, scene };
window.LEON_READY = true;

})();
</script>
