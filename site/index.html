<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Juegos de León">
<meta name="theme-color" content="#5ac8ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Juegos de León</title>
<link rel="stylesheet" href="vendor/fonts.css">
<style>
/* Layout: cielo con colinas y nubes; los juegos como íconos grandes de app en una cuadrícula centrada. Un solo look brillante, pensado para dedos pequeños. */
:root{
  --sky-top:#5ac8ff;
  --sky-low:#bff0e0;
  --hill:#7bd63a;
  --hill-d:#5db82a;
  --ink:#2a1f3d;
  --sun:#ffd23a;
  --paper:#fffaf0;
  --display:'Lilita One','Trebuchet MS','Arial Rounded MT Bold',sans-serif;
  --body:'Nunito','Avenir Next',system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;color:var(--ink);font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none;background:var(--sky-top)}
a,button{touch-action:manipulation;-webkit-touch-callout:none}
img{-webkit-user-drag:none}
.world{position:fixed;inset:0;background:linear-gradient(var(--sky-top),var(--sky-low) 70%);overflow:hidden}
.sun{position:absolute;right:8%;top:9%;width:min(22vw,130px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff6b0,var(--sun) 60%);box-shadow:0 0 0 18px rgba(255,210,58,.25),0 0 0 40px rgba(255,210,58,.12);animation:spin 30s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cloud{position:absolute;height:44px;width:120px;background:#fff;border-radius:44px;opacity:.95;animation:drift linear infinite}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:56px;height:56px;left:18px;top:-26px}
.cloud::after{width:42px;height:42px;left:58px;top:-18px}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(calc(100vw + 160px))}}
.hill{position:absolute;bottom:-40vh;border-radius:50%;background:var(--hill)}
.hill.a{left:-30vw;width:110vw;height:70vh}
.hill.b{right:-35vw;width:120vw;height:62vh;background:var(--hill-d)}

.page{position:relative;height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(20px,5vh,44px);padding-top:calc(env(safe-area-inset-top,0px) + 20px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--display);font-weight:400;margin:0;font-size:clamp(42px,11vw,76px);line-height:.95;color:#fff;text-align:center;text-shadow:0 5px 0 var(--ink),0 10px 0 rgba(0,0,0,.15);letter-spacing:.02em;text-wrap:balance}
h1 span{color:var(--sun)}
.apps{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(24px,6vw,56px)}
.app{display:flex;flex-direction:column;align-items:center;gap:10px;text-decoration:none;color:#fff}
.icon{width:clamp(120px,28vw,190px);aspect-ratio:1;border-radius:24%;overflow:hidden;background:#fff;box-shadow:0 0 0 6px #fff,0 12px 0 rgba(42,31,61,.35),0 20px 30px rgba(0,0,0,.25);transition:transform .15s;animation:float 3s ease-in-out infinite}
.app:nth-child(2) .icon{animation-delay:-1s}
.app:nth-child(3) .icon{animation-delay:-2s}
.icon img{width:100%;height:100%;display:block;object-fit:cover}
@keyframes float{50%{transform:translateY(-10px)}}
.app:active .icon{transform:scale(.92);animation:none}
.app:focus-visible{outline:none}
.app:focus-visible .icon{box-shadow:0 0 0 6px var(--ink),0 12px 0 rgba(42,31,61,.35)}
.name{font-family:var(--display);font-size:clamp(20px,5vw,28px);letter-spacing:.04em;text-shadow:0 3px 0 var(--ink);white-space:nowrap}
.parent{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);border:0;background:rgba(42,31,61,.55);color:#fff;font-family:var(--body);font-weight:800;font-size:13px;padding:8px 14px;border-radius:99px;cursor:pointer}
.sheet{position:fixed;inset:0;display:flex;align-items:flex-start;overflow-y:auto;box-sizing:border-box;padding-top:calc(env(safe-area-inset-top,0px) + 16px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(42,31,61,.55)}
.card{margin:auto;width:min(100%,440px);box-sizing:border-box;background:var(--paper);border-radius:28px;padding:22px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 0 rgba(0,0,0,.18)}
.card h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0;text-align:center}
.card p{margin:0;font-weight:700;line-height:1.45;color:#5a4d6e}
.card ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-weight:800;line-height:1.4}
.ok{align-self:center;font-family:var(--display);font-size:22px;letter-spacing:.06em;border:0;cursor:pointer;color:#fff;background:linear-gradient(#8fe04a,#5db82a);padding:12px 36px;border-radius:999px;box-shadow:0 5px 0 #3f8a1c}
@media (orientation:landscape) and (max-height:520px){.icon{width:clamp(110px,22vh,170px)}h1{font-size:44px}}
@media (prefers-reduced-motion:reduce){.sun,.cloud,.icon{animation:none}}
</style>
</head>
<body>
<div id="leonIntro" aria-hidden="true">
  <div class="li-stars"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="li-egg">
    <svg class="li-baby" viewBox="0 0 120 100"><path d="M20 100c0-40 18-62 44-62 30 0 44 22 44 46v16z" fill="#7bd63a" stroke="#2a1f3d" stroke-width="5"/><circle cx="52" cy="62" r="11" fill="#fff" stroke="#2a1f3d" stroke-width="4"/><circle cx="55" cy="63" r="5" fill="#2a1f3d"/><circle cx="57" cy="60" r="1.8" fill="#fff"/><circle cx="84" cy="62" r="11" fill="#fff" stroke="#2a1f3d" stroke-width="4"/><circle cx="87" cy="63" r="5" fill="#2a1f3d"/><circle cx="89" cy="60" r="1.8" fill="#fff"/><path d="M60 82c6 6 16 6 22 0" fill="none" stroke="#2a1f3d" stroke-width="4" stroke-linecap="round"/><path d="M44 40l6-12 8 10 8-12 8 12 8-10 4 12" fill="#ffd23a" stroke="#2a1f3d" stroke-width="4" stroke-linejoin="round"/></svg>
    <div class="li-shell li-bottom"></div>
    <div class="li-shell li-top"></div>
  </div>
  <div class="li-title"><span>L</span><span>E</span><span>Ó</span><span>N</span></div>
  <div class="li-sub">GAMES</div>
</div>
<style>
#leonIntro{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:radial-gradient(circle at 50% 42%,#bff0ff,#5ac8ff 55%,#2f7fe0);font-family:'Lilita One','Trebuchet MS','Arial Rounded MT Bold',sans-serif;overflow:hidden;transition:opacity .45s,transform .45s;-webkit-user-select:none;user-select:none;touch-action:none}
#leonIntro.out{opacity:0;transform:scale(1.08);pointer-events:none}
.li-egg{position:relative;width:min(34vw,170px);aspect-ratio:.8;margin-bottom:6px;animation:li-wobble .5s ease-in-out 3 alternate}
.li-shell{position:absolute;left:0;right:0;background:#fffaf0;border:5px solid #2a1f3d;box-sizing:border-box;background-image:radial-gradient(circle at 30% 30%,#ffd8e4 0 9%,transparent 10%),radial-gradient(circle at 70% 60%,#bfeaff 0 8%,transparent 9%),radial-gradient(circle at 40% 80%,#ffe8a0 0 7%,transparent 8%)}
.li-bottom{bottom:0;height:56%;border-radius:0 0 50% 50% / 0 0 62% 62%;border-top:0;clip-path:polygon(0 0,12% 14%,26% 0,40% 14%,54% 0,68% 14%,82% 0,100% 12%,100% 100%,0 100%)}
.li-top{top:0;height:50%;border-radius:50% 50% 0 0 / 70% 70% 0 0;border-bottom:0;transform-origin:20% 100%;animation:li-pop .6s cubic-bezier(.3,1.6,.6,1) 1.3s forwards}
.li-baby{position:absolute;left:5%;width:90%;bottom:30%;transform:translateY(40%) scale(.6);opacity:0;animation:li-peek .5s cubic-bezier(.3,1.6,.6,1) 1.45s forwards}
.li-title{display:flex;gap:.04em;font-size:min(24vw,128px);line-height:.9;color:#ffd23a;text-shadow:0 6px 0 #2a1f3d,0 12px 0 rgba(0,0,0,.18);letter-spacing:.02em}
.li-title span{display:inline-block;opacity:0;transform:translateY(-120%) rotate(-10deg);animation:li-drop .55s cubic-bezier(.3,1.5,.6,1) forwards}
.li-title span:nth-child(1){animation-delay:1.7s}
.li-title span:nth-child(2){animation-delay:1.8s}
.li-title span:nth-child(3){animation-delay:1.9s}
.li-title span:nth-child(4){animation-delay:2s}
.li-sub{font-size:min(9vw,46px);letter-spacing:.42em;padding-left:.42em;color:#fff;text-shadow:0 4px 0 #2a1f3d;opacity:0;animation:li-fade .4s ease-out 2.2s forwards}
.li-stars i{position:absolute;width:22px;height:22px;background:#fff;clip-path:polygon(50% 0,61% 38%,100% 50%,61% 62%,50% 100%,39% 62%,0 50%,39% 38%);opacity:0;animation:li-twinkle 1.6s ease-in-out infinite}
.li-stars i:nth-child(1){left:14%;top:18%;animation-delay:.2s}
.li-stars i:nth-child(2){right:16%;top:24%;animation-delay:.7s;transform:scale(1.4)}
.li-stars i:nth-child(3){left:22%;bottom:22%;animation-delay:1.1s}
.li-stars i:nth-child(4){right:24%;bottom:18%;animation-delay:.4s;transform:scale(.8)}
.li-stars i:nth-child(5){left:48%;top:10%;animation-delay:1.4s}
.li-stars i:nth-child(6){right:8%;top:56%;animation-delay:.9s;transform:scale(1.2)}
@keyframes li-wobble{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
@keyframes li-pop{to{transform:translate(30%,-110%) rotate(48deg);opacity:0}}
@keyframes li-peek{to{transform:translateY(0) scale(1);opacity:1}}
@keyframes li-drop{to{opacity:1;transform:none}}
@keyframes li-fade{to{opacity:1}}
@keyframes li-twinkle{0%,100%{opacity:0}50%{opacity:.9}}
@media (prefers-reduced-motion:reduce){#leonIntro *{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
<script>
// Intro de LEÓN GAMES: dura ~2.8 s; tocar la pantalla la salta
(() => {
  const el = document.getElementById('leonIntro');
  let gone = false;
  const done = () => { if (gone) return; gone = true; el.classList.add('out'); setTimeout(() => el.remove(), 500); };
  setTimeout(done, matchMedia('(prefers-reduced-motion: reduce)').matches ? 900 : 2900);
  el.addEventListener('pointerdown', done);
})();
</script>

<div class="world" aria-hidden="true">
  <div class="sun"></div>
  <div class="cloud" style="top:14%;animation-duration:46s;animation-delay:-10s"></div>
  <div class="cloud" style="top:28%;animation-duration:60s;animation-delay:-35s;transform:scale(.8)"></div>
  <div class="cloud" style="top:6%;animation-duration:52s;animation-delay:-22s"></div>
  <div class="hill a"></div>
  <div class="hill b"></div>
</div>

<main class="page">
  <h1>Juegos de <span>León</span></h1>
  <nav class="apps">
    <a class="app" href="dino-race/" aria-label="Dino Race"><span class="icon"><img src="icons/dino-race.png" alt=""></span><span class="name">Dino Race</span></a>
  </nav>
  <button class="parent" id="helpBtn">Instalar en el iPad</button>
</main>

<div class="sheet" id="help" hidden>
  <div class="card">
    <h2>Instalar como app</h2>
    <p>Así los juegos se abren en pantalla completa y funcionan sin internet:</p>
    <ol>
      <li>Abre esta página en Safari.</li>
      <li>Toca Compartir (el cuadrito con la flecha).</li>
      <li>Elige "Agregar a pantalla de inicio".</li>
      <li>Abre "Juegos de León" desde el ícono.</li>
    </ol>
    <button class="ok" id="helpOk">ENTENDIDO</button>
  </div>
</div>

<script>
(() => {
  const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches;
  const help = document.getElementById('help'), btn = document.getElementById('helpBtn');
  btn.hidden = standalone;
  btn.addEventListener('click', () => { help.hidden = false; });
  document.getElementById('helpOk').addEventListener('click', () => { help.hidden = true; });
  ['gesturestart', 'gesturechange'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
  document.addEventListener('contextmenu', e => e.preventDefault());
})();
</script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js',{scope:'./'});</script>
</body>
</html>
