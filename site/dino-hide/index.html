<script>
// Pantalla de carga de LEÓN GAMES: dura al menos ~2.6 s; en los juegos 3D espera a que terminen de cargar los modelos
// (la barra muestra el avance real). Tocar la pantalla la salta solo cuando ya no hay nada cargando.
(() => {
  const el = document.getElementById('leonIntro'), bar = el.querySelector('.li-bar i'), t0 = performance.now();
  const MIN = matchMedia('(prefers-reduced-motion: reduce)').matches ? 800 : 2600;
  let gone = false;
  const ready = () => !window.LEON_WAIT || window.LEON_READY;
  const done = () => { if (gone) return; gone = true; bar.style.width = '100%'; setTimeout(() => el.classList.add('out'), 150); setTimeout(() => el.remove(), 700); };
  (function tick() {
    if (gone) return;
    const t = performance.now() - t0, timeP = Math.min(1, t / MIN);
    const p = window.LEON_WAIT ? Math.min(timeP, .1 + .9 * (window.LEON_READY ? 1 : (window.LEON_PROGRESS || 0) * .95)) : timeP;
    bar.style.width = Math.max(6, p * 100) + '%';
    if ((t >= MIN && ready()) || t > 25000) done(); else setTimeout(tick, 100);
  })();
  // El toque que salta la intro no debe llegar a los botones de atrás
  el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (ready()) done(); });
  ['click', 'pointerup', 'touchend'].forEach(ev => el.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); }));
})();
</script>

<script>/* Modelos 3D (glTF) compartidos: se cargan una vez y se clonan; funcionan sin internet porque se guardan con la app */
const MODELS = {};
function loadModels(names, base) {
  const loader = new THREE.GLTFLoader();
  let done = 0; const tick = () => { done++; window.LEON_PROGRESS = done / names.length; };
  return Promise.all(names.map(n => MODELS[n] ? (tick(), Promise.resolve()) : new Promise(res => {
    loader.load(base + n + '.glb', g => { tick();
      // Los juegos usan colores "tal cual" (sin conversión de color), así que las texturas también se leen tal cual,
      // y los materiales pasan a Lambert: luz suave, barata para el iPad y pareja con el resto del mundo
      g.scene.traverse(o => {
        if (!o.isMesh) return;
        o.castShadow = true; o.receiveShadow = true;
        // Pesos del esqueleto en decimales (vienen como enteros 0-255/65535 y Three r128 no los convierte al calcular poses a mano)
        const sw = o.geometry && o.geometry.attributes.skinWeight;
        if (sw && sw.normalized && !(sw.array instanceof Float32Array)) {
          const max = sw.array instanceof Uint8Array ? 255 : 65535, f = new Float32Array(sw.array.length);
          for (let i = 0; i < f.length; i++) f[i] = sw.array[i] / max;
          o.geometry.setAttribute('skinWeight', new THREE.BufferAttribute(f, sw.itemSize));
        }
        // glTF guarda los colores en espacio lineal; los juegos pintan los colores tal cual, así que se regresan a sRGB (si no, salen casi negros)
        // Una textura que no cargó (imagen vacía) haría el objeto negro: mejor sin textura
        const okMap = mt => mt.map && mt.map.image && (mt.map.image.width || mt.map.image.naturalWidth) ? mt.map : null;
        const conv = mt => { const l = new THREE.MeshLambertMaterial({ name: mt.name, color: mt.color.clone().convertLinearToSRGB(), map: okMap(mt), skinning: !!o.isSkinnedMesh, vertexColors: mt.vertexColors }); if (l.map) l.map.encoding = THREE.LinearEncoding; return l; };
        o.material = Array.isArray(o.material) ? o.material.map(conv) : conv(o.material);
      });
      MODELS[n] = g; res();
    }, undefined, () => { tick(); console.warn('modelo no encontrado', n); res(); });
  })));
}
// Clona un modelo (con esqueleto si es animado) y lo escala para que su lado más largo mida `size`
function modelClone(name, size) {
  const src = MODELS[name]; if (!src) return new THREE.Group();
  const o = src.animations.length ? THREE.SkeletonUtils.clone(src.scene) : src.scene.clone(true);
  if (size) { const s = modelBox(o).getSize(new THREE.Vector3()); o.scale.multiplyScalar(size / Math.max(s.x, s.y, s.z)); }
  return o;
}
// Caja real del modelo: con esqueleto, la caja de la geometría no sirve (los huesos la reescalan), así que se mide con los huesos y los vértices deformados
function modelBox(o) {
  o.updateMatrixWorld(true);
  const box = new THREE.Box3(), v = new THREE.Vector3();
  let skinned = false;
  o.traverse(m => {
    if (!m.isSkinnedMesh) return; skinned = true;
    const p = m.geometry.attributes.position, step = Math.max(1, Math.floor(p.count / 300));
    for (let i = 0; i < p.count; i += step) { v.fromBufferAttribute(p, i); m.boneTransform(i, v); box.expandByPoint(v.applyMatrix4(m.matrixWorld)); }
  });
  return skinned ? box : box.setFromObject(o);
}
// Pinta los materiales de un clon: fn(nombreMaterial) devuelve un color (o null para dejarlo igual).
// Los materiales pintados se comparten entre clones para no crear cientos de copias.
const RECOLOR_CACHE = new Map();
function recolor(o, fn) {
  o.traverse(m => {
    if (!m.isMesh) return;
    const one = mt => {
      const col = fn(mt.name, mt); if (col == null) return mt;
      const key = mt.uuid + ':' + col;
      if (!RECOLOR_CACHE.has(key)) { const c = mt.clone(); c.color.setHex(col); RECOLOR_CACHE.set(key, c); }
      return RECOLOR_CACHE.get(key);
    };
    m.material = Array.isArray(m.material) ? m.material.map(one) : one(m.material);
  });
  return o;
}

<script>
(() => {
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.random() * a.length | 0];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

let save = { done: {}, muted: false };
try { Object.assign(save, JSON.parse(localStorage.getItem('dinoHide')) || {}); } catch (e) {}

  // Cielo y luces

  scene.fog = new THREE.Fog(night ? 0x1a2550 : new THREE.Color(T.sky[1]).getHex(), 60, 160);
  hemi.intensity = night ? .16 : .95; hemi.color.setHex(night ? 0x7a8cff : 0xffffff); hemi.groundColor.setHex(night ? 0x202040 : T.ground2);
  sun.intensity = night ? .12 : .8; sun.color.setHex(night ? 0x8aa0ff : 0xfff0d0);
  torch.intensity = night ? 1.9 : 0; torchGlow.visible = night;
  // Piso: una islita ovalada con su orilla de tierra (como un juguete)
  const shape = new THREE.Shape(); shape.absellipse(0, 0, W + 4, D + 4, 0, Math.PI * 2, false, 0);
  const top = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth: 2.2, bevelEnabled: true, bevelThickness: .4, bevelSize: .5, bevelSegments: 3, curveSegments: 64 }), [M(T.ground), M(T.side)]);
  top.rotation.x = Math.PI / 2; top.position.y = -.4; top.receiveShadow = true; world.add(top);
  // Manchas de pasto más oscuro / arena mojada para que el piso no sea plano
  for (let i = 0; i < 14; i++) { const p = new THREE.Mesh(new THREE.CircleGeometry(rand(1.5, 4), 20), M(T.ground2)); p.rotation.x = -Math.PI / 2; p.position.set(rand(-W, W), .02, rand(-D, D)); p.scale.y = rand(.5, 1); p.receiveShadow = true; world.add(p); }
  // Agua o lava alrededor de la isla
  if (T.water || T.lava) { const w = new THREE.Mesh(new THREE.CircleGeometry(160, 48), M(T.water || 0xff5a1a, T.lava ? { emissive: 0xff4a00, emissiveIntensity: .6 } : {})); w.rotation.x = -Math.PI / 2; w.position.y = -1.6; w.scale.y = .7; world.add(w); }
  else { const g = new THREE.Mesh(new THREE.CircleGeometry(160, 48), M(night ? 0x223060 : shadeHex(T.ground2, -.08))); g.rotation.x = -Math.PI / 2; g.position.y = -2.4; world.add(g); }
  // Calle con banquetas en la ciudad
  if (T.road) {
    const r = new THREE.Mesh(new THREE.PlaneGeometry(W * 2 + 8, 3.4), M(0x4e5260)); r.rotation.x = -Math.PI / 2; r.position.set(0, .03, 7.2); r.receiveShadow = true; world.add(r);
    for (const z of [5.3, 9.1]) { const s = new THREE.Mesh(new THREE.BoxGeometry(W * 2 + 8, .12, .5), M(0xd0d2da)); s.position.set(0, .06, z); s.receiveShadow = true; world.add(s); }
    for (let x = -W - 3; x < W + 3; x += 2.4) { const l = new THREE.Mesh(new THREE.PlaneGeometry(1.2, .16), M(0xffd23a)); l.rotation.x = -Math.PI / 2; l.position.set(x, .04, 7.2); world.add(l); }
  }
  // Árboles (o casas, palmeras, rocas) en la orilla de atrás y de los lados
  for (let k = 0; k < (L.wide ? 26 : 16); k++) {
    const a = Math.PI + (k / ((L.wide ? 26 : 16) - 1)) * Math.PI, o = kenney(pick(T.border));
    fit(o, rand(3, 4.2), rand(3.4, 5)); o.position.x = Math.cos(a) * (W + 2.5) + rand(-.6, .6); o.position.z = Math.sin(a) * (D + 2.5) + rand(-.6, .6); o.rotation.y = rand(0, 6.3); world.add(o);
  }
  // Adornos chiquitos en las orillas (no son escondites)
  for (let k = 0; k < (L.wide ? 10 : 6); k++) {
    const o = kenney(pick(T.decor)); fit(o, rand(1.2, 1.9), rand(1.2, 2)); const sx = k % 2 ? 1 : -1;
    o.position.x = sx * rand(W - 1.5, W + 1.8); o.position.z = rand(-3, 6.5); o.rotation.y = rand(0, 6.3); world.add(o);
  }
  // Pastito y florecitas
  if (T.grass) {
    const tuft = new THREE.ConeGeometry(.08, .45, 3); const n = L.wide ? 700 : 420, gm = new THREE.InstancedMesh(tuft, M(T.grass, { emissive: T.grass, emissiveIntensity: night ? .05 : .35 }), n), m4 = new THREE.Matrix4();
    for (let i = 0; i < n; i++) { m4.makeTranslation(rand(-W - 2, W + 2), .2, rand(-D - 2, D + 2)); gm.setMatrixAt(i, m4); } world.add(gm);
  }
  const fl = new THREE.CircleGeometry(.14, 6).rotateX(-Math.PI / 2), nf = L.wide ? 160 : 90, fm = new THREE.InstancedMesh(fl, new THREE.MeshBasicMaterial({ color: 0xffffff }), nf), m4 = new THREE.Matrix4(), fc = new THREE.Color();
  for (let i = 0; i < nf; i++) { m4.makeTranslation(rand(-W - 2, W + 2), .04, rand(-D - 2, D + 2)); fm.setMatrixAt(i, m4); fm.setColorAt(i, fc.setHex(pick(T.flowers)).multiplyScalar(night ? .3 : 1)); } world.add(fm);
  // Luciérnagas de noche

  // De día: mariposas de colores y nubes esponjosas que pasan despacio
  if (!night) {
    for (let i = 0; i < (L.wide ? 12 : 8); i++) {
      const b = new THREE.Group(), c = pick([0xff5d8f, 0xffd23a, 0x5ac8ff, 0xa98bff, 0xff9a2e]), wings = [];
      for (const sd of [-1, 1]) { const w = new THREE.Group(); const wm = new THREE.Mesh(new THREE.CircleGeometry(.24, 10), new THREE.MeshLambertMaterial({ color: c, side: THREE.DoubleSide })); wm.rotation.x = -Math.PI / 2; wm.position.x = sd * .22; w.add(wm); b.add(w); wings.push(w); }

      const cl = new THREE.Group(), cm = M(0xffffff, { emissive: 0xffffff, emissiveIntensity: .35 });

}
function shadeHex(h, l) { const c = new THREE.Color(h); c.offsetHSL(0, 0, l); return c.getHex(); }

// Acomoda los escondites en filas escalonadas, sin encimarse, dejando el frente libre para los dinos encontrados
function placeSpots(L, W, D) {
  const T = THEMES[L.theme], out = [], names = shuffle([...T.spots, ...T.spots]).slice(0, L.spots);
  const zMin = -D + 1.5, zMax = T.road ? 2.8 : 3.8;
  for (let i = 0; i < L.spots; i++) {
    let best = null, bd = -1;
    for (let t = 0; t < 60; t++) {
      const x = rand(-W + 1.8, W - 1.8), z = rand(zMin, zMax), d = Math.min(99, ...out.map(o => Math.hypot((o.x - x) * .8, o.z - z)));
      if (d > bd) { bd = d; best = { x, z }; }
    }
    out.push({ ...best, name: names[i % names.length] });
  }
  return out;
}

function makeSpot(s) {
  const o = kenney(s.name); fit(o, rand(3.2, 3.7), rand(2.6, 3.2));
  // Los escondites bajitos (rocas, troncos) se estiran hacia arriba para que de veras tapen a un dino
  { const hh = modelBox(o).getSize(new THREE.Vector3()).y; if (hh < 2.4) { o.scale.y *= Math.min(1.9, 2.4 / hh); o.position.y *= Math.min(1.9, 2.4 / hh); } }
  const pivot = new THREE.Group(); pivot.position.set(s.x, 0, s.z); pivot.add(o); world.add(pivot);
  o.rotation.y = rand(-.4, .4) + (/sedan|van|truck|delivery|suv|boat|canoe|log/.test(s.name) ? Math.PI / 2 * (Math.random() < .5 ? 1 : -1) + rand(-.3, .3) : 0);
  o.updateMatrixWorld(true);
  const b = new THREE.Box3().setFromObject(o), sz = b.getSize(new THREE.Vector3());
  const r = Math.max(sz.x, sz.z) / 2, proxy = new THREE.Mesh(new THREE.CylinderGeometry(Math.max(1.5, r + .4), Math.max(1.5, r + .4), sz.y + 1.4, 12), PROXY_MAT);
  proxy.position.y = (sz.y + 1.4) / 2; pivot.add(proxy);
  const spot = { ...s, pivot, obj: o, proxy, w: sz.x, d: sz.z, h: sz.y, anim: 0, dino: null };
  proxy.userData.spot = spot;
  return spot;
}

function makeDino(def, k) {
  const g = makeAnimal(def.m, def.c); fit(g.userData.model, 2.8, 1.9);
  world.add(g);
  // Ojitos que brillan en la oscuridad (solo de noche, mientras está escondido)
  const eyes = new THREE.Group(), em = new THREE.MeshBasicMaterial({ color: 0xfff27a });
  for (const sx of [-1, 1]) { const e = new THREE.Mesh(new THREE.SphereGeometry(.15, 10, 8), em); e.position.x = sx * .22; e.scale.y = 1.3; eyes.add(e); }
  eyes.visible = false; world.add(eyes);
  const proxy = new THREE.Mesh(new THREE.SphereGeometry(1.1, 8, 6), PROXY_MAT); proxy.position.y = .8; g.add(proxy);
  const d = { def, k, obj: g, eyes, proxy, state: 'play', spot: null, peek: 0, t: 0, from: new THREE.Vector3(), to: new THREE.Vector3(), slot: -1 };
  proxy.userData.dino = d;
  return d;
}

// Retratos de los dinos (para la bandeja de arriba), hechos con el mismo motor 3D

  const sc = new THREE.Scene(); sc.add(new THREE.HemisphereLight(0xffffff, 0x8a9a70, 1)); const dl = new THREE.DirectionalLight(0xffffff, .6); dl.position.set(3, 6, 5); sc.add(dl);

function spotHidePos(sp, peek) {
  // Detrás del escondite (visto desde la cámara) y un poco hacia un lado: con `peek` alto se le ve la cola o la cabeza
  const back = tmpV.set(sp.x - camera.position.x, 0, sp.z - camera.position.z).normalize();
  const side = new THREE.Vector3(-back.z, 0, back.x).multiplyScalar(sp.side || 1);
  const depth = Math.max(sp.d, sp.w) * .3 + .4;
  return new THREE.Vector3(sp.x, 0, sp.z).addScaledVector(back, depth).addScaledVector(side, (Math.max(sp.w, sp.d) * .5 + .6) * peek);
}

let loadingLvl = false;
async function start(n) {
  if (loadingLvl) return;
  const L = LEVELS[n], need = [...themeModels(L.theme), ...ALWAYS];
  if (need.some(m => !MODELS[m])) {
    loadingLvl = true; const ov = $('#lvlLoad'), bar = ov.querySelector('i'); ov.hidden = false; window.LEON_PROGRESS = 0;
    const iv = setInterval(() => (bar.style.width = Math.max(8, (window.LEON_PROGRESS || 0) * 100) + '%'), 100);
    await loadModels(need, '../models/');
    clearInterval(iv); ov.hidden = true; loadingLvl = false;
  }
  startNow(n);
}
function startNow(n) {
  const L = LEVELS[n];
  game = { n, L, t: 0, phase: 'play', found: 0, idle: 0, sneakT: rand(9, 13), critters: [], hintT: 0 };
  const { W, D } = buildWorld(L); game.W = W; game.D = D;
  framing();
  game.spots = placeSpots(L, W, D).map(makeSpot);
  const defs = shuffle([...DINOS]).slice(0, L.dinos);
  game.dinos = defs.map(makeDino);
  // Los dinos empiezan jugando en el claro del frente
  game.dinos.forEach((d, i) => { const x = (i - (L.dinos - 1) / 2) * 3.2; d.obj.position.set(x, 0, 5.8); d.obj.rotation.y = 0; play(d.obj, i % 2 ? 'jump' : 'idle'); d.t = rand(0, 1); });
  // Cada dino escoge su escondite
  const free = shuffle([...game.spots]);
  game.dinos.forEach(d => { d.spot = free.pop(); d.spot.dino = d; d.spot.side = Math.random() < .5 ? -1 : 1; d.peek = L.peek; });
  // Bandeja de retratos
  const tray = $('#tray'); tray.innerHTML = '';
  game.dinos.forEach(d => { const im = document.createElement('img'); im.alt = ''; im.src = portrait(d.def); tray.appendChild(im); d.img = im; });
  $('#lvl').textContent = 'NIVEL ' + (n + 1);
  $('#menu').hidden = true; $('#menuBg').hidden = true; $('#title').hidden = true; $('#win').hidden = true;
  app.hidden = false; $('#hud').hidden = false; $('#backBtn').hidden = false;
  resize(); music(true);
  // Juegan un ratito, luego la carita se tapa los ojos y cuenta 1-2-3 mientras corren a esconderse
  game.countAt = 1.6;
}

// Cámara: se aleja lo necesario para que quepa toda la isla (o, en los panorámicos, se desliza con el dedo)
function framing() {
  const g = game, aspect = innerWidth / innerHeight;
  const vFov = camera.fov * Math.PI / 180, hFov = 2 * Math.atan(Math.tan(vFov / 2) * aspect);
  // Lo que se ve de ancho: toda la isla, salvo en los panorámicos o en el teléfono parado (ahí se desliza con el dedo)
  const halfW = Math.min(g.L.wide ? 11 : g.W + 1, Math.max(5.2, 9 * aspect));
  const dist = Math.max(halfW / Math.tan(hFov / 2), (g.D + 2.5) / Math.tan(vFov / 2) * .62);
  g.camDist = dist; g.panMax = Math.max(0, g.W - halfW + 1.5); if (g.pan == null) g.pan = 0;
}
function updateCamera(dt) {
  const g = game, d = g.camDist, sway = Math.sin(g.t * .3) * .3;
  g.pan = Math.max(-g.panMax, Math.min(g.panMax, g.pan + (g.panV || 0) * dt)); g.panV = (g.panV || 0) * Math.pow(.02, dt);
  // Parado (teléfono): más desde arriba, para que la isla llene la pantalla a lo alto
  if (innerHeight > innerWidth) { camera.position.set(g.pan + sway, d * .88, d * .5 + 2); camera.lookAt(g.pan, 0, .6); }
  else { camera.position.set(g.pan + sway, d * .62, d * .78 + 2); camera.lookAt(g.pan, .5, -.6); }
  if (g.shake > 0) { g.shake -= dt; camera.position.x += rand(-.15, .15); camera.position.y += rand(-.1, .1); }
}

function countdown() {
  const g = game, el = $('#count'), num = $('#countN');
  el.style.setProperty('--veil', (1 - g.L.watch) * .88 + .06); el.hidden = false; g.phase = 'count';
  // Los dinos corren a esconderse mientras cuenta
  g.dinos.forEach((d, i) => setTimeout(() => { if (game !== g) return; d.state = 'run'; d.from.copy(d.obj.position); d.to.copy(spotHidePos(d.spot, d.peek)); d.t = 0; play(d.obj, 'run'); }, 150 + i * 220));
  sfx.run();
  [0, 1, 2].forEach(i => setTimeout(() => { if (game !== g) return; num.textContent = i + 1; num.classList.remove('pop'); void num.offsetWidth; num.classList.add('pop'); sfx.count(i); }, i * 900));
  setTimeout(() => {
    if (game !== g) return; el.hidden = true; g.phase = 'search'; sfx.go();
    const go = document.createElement('div'); go.id = 'go'; go.textContent = '¿DÓNDE ESTÁN?'; document.body.appendChild(go); setTimeout(() => go.remove(), 1400);
    // Por si alguno no llegó todavía
    g.dinos.forEach(d => { if (d.state === 'run') { d.obj.position.copy(d.to); d.state = 'hidden'; play(d.obj, 'idle'); hideIn(d); } });
  }, 2900);
}

// Toque: busca primero dinos que se están cambiando de escondite, luego escondites
function onTap(cx, cy) {
  const g = game; if (!g || g.phase !== 'search') return;
  camera.updateMatrixWorld(); world.updateMatrixWorld(true);
  ptr.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1); ray.setFromCamera(ptr, camera);
  const objs = [...g.dinos.filter(d => d.state === 'sneak' || d.state === 'hidden').map(d => d.proxy), ...g.spots.map(s => s.proxy)];
  // Generoso para dedos chiquitos: si el toque pasa por varios escondites, gana el que tiene un dino
  const hits = ray.intersectObjects(objs, false);
  const hit = hits.find(h => h.object.userData.dino || (h.object.userData.spot && h.object.userData.spot.dino && h.object.userData.spot.dino.state === 'hidden')) || hits[0];
  g.idle = 0;
  if (!hit) { sfx.tap(); return; }
  const d0 = hit.object.userData.dino;
  if (d0) return reveal(d0);
  const sp = hit.object.userData.spot;
  shakeSpot(sp);
  if (sp.dino && sp.dino.state === 'hidden') reveal(sp.dino);
  else if (!sp.busy) surprise(sp);
}
function leafCols() { const t = game.L.theme; return t === 'nieve' ? [0xffffff, 0xdff0ff] : t === 'playa' || t === 'desierto' ? [0xf6dc9a, 0xe8c070, 0xffffff] : t === 'volcan' ? [0xff8a2a, 0xffd23a, 0x5a4a4a] : t === 'ciudad' ? [0xffd23a, 0xffffff, 0x5ac8ff] : [0x5cc241, 0x2f9e44, 0x9be05a]; }
function shakeSpot(sp) { sp.anim = 1; rustle(); burst(sp.x, sp.h * .6, sp.z, 12, leafCols(), 4, .26, 5); }
// El dino se mete al escondite: ¡puf! hojitas y desaparece
function hideIn(d) { d.obj.visible = false; d.spot.anim = 1; rustle(.08, .3); burst(d.spot.x, d.spot.h * .6, d.spot.z, 8, leafCols(), 3, .24, 4); }
function reveal(d) {
  const g = game; if (d.state === 'out' || d.state === 'found') return;
  if (d.spot) { d.spot.dino = null; shakeSpot(d.spot); if (d.state === 'hidden') d.obj.position.set(d.spot.x, 0, d.spot.z); }
  d.obj.visible = true; d.state = 'out'; d.t = 0; d.from.copy(d.obj.position); d.eyes.visible = false;
  d.slot = g.found++;
  const n = g.L.dinos, x = (d.slot - (n - 1) / 2) * Math.min(3.1, 18 / n) + g.pan;
  d.to.set(x, 0, THEMES[g.L.theme].road ? 7.2 : 7);
  play(d.obj, 'jump', .1); sfx.found(d.slot); g.shake = .25;
  burst(d.from.x, 1.6, d.from.z, 22, [0xffd23a, 0xff5d8f, 0x5ac8ff, 0xffffff, 0x8fe04a], 6, .3, 8);
  d.img.classList.add('got');
}
// En un escondite vacío sale una sorpresa: conejito que saluda, perrito, rana u oveja
function surprise(sp) {
  sp.busy = true; sfx.boing();
  if (Math.random() < .3) {   // a veces, en vez de un animalito, sale volando una parvada de pajaritos
    for (let i = 0; i < 5; i++) {
      const o = new THREE.Group(), c = pick([0x5ac8ff, 0xffd23a, 0xff5d8f]), w = [];
      o.add(ell(.16, .14, .24, M(c))); const hd = ell(.11, .11, .11, M(c)); hd.position.set(0, .1, .2); o.add(hd);
      const bk = new THREE.Mesh(new THREE.ConeGeometry(.04, .12, 6), M(0xff9a2e)); bk.rotation.x = Math.PI / 2; bk.position.set(0, .1, .33); o.add(bk);
      for (const sd of [-1, 1]) { const g2 = new THREE.Group(); const wm = ell(.2, .03, .12, M(shadeHex(c, -.1))); wm.position.x = sd * .2; g2.add(wm); o.add(g2); w.push(g2); }
      o.position.set(sp.x + rand(-.6, .6), sp.h * .7, sp.z + rand(-.4, .4)); const v = new THREE.Vector3(rand(-3, 3), rand(2.5, 4), rand(-2, 2)); o.lookAt(o.position.clone().add(v));
      world.add(o); game.birds.push({ o, v, w, t: 0 });

  const p = spotHidePos(sp, 0); c.position.copy(p); c.rotation.y = 0; world.add(c);
  play(c, c.userData.acts.wave ? 'wave' : c.userData.acts.jump ? 'jump' : c.userData.acts.gallop_jump ? 'gallop_jump' : 'idle');
  game.critters.push({ o: c, sp, t: 0, p0: p.clone() });
}

}
function winLevel() {
  const g = game; g.phase = 'win'; save.done[g.n] = true; persist();
  sfx.win(); confetti();
  // Todos al centro a bailar
  g.dinos.forEach((d, i) => { d.state = 'dance'; d.t = 0; d.from.copy(d.obj.position); d.to.set((i - (g.L.dinos - 1) / 2) * Math.min(3.1, 18 / g.L.dinos) + g.pan, 0, 4.5); play(d.obj, 'run'); });
  setTimeout(() => { if (game === g) $('#win').hidden = false; }, 1700);
}

function update(dt) {
  const g = game; if (!g) return;
  g.t += dt;
  if (g.countAt != null) { g.countAt -= dt; if (g.countAt <= 0) { g.countAt = null; countdown(); } }
  // Dinos
  for (const d of g.dinos) {
    d.obj.userData.mixer.update(dt);
    d.t += dt;
    if (d.state === 'play') { d.obj.position.y = 0; d.obj.rotation.y = Math.sin(g.t * 2 + d.k) * .4; }
    else if (d.state === 'run' || d.state === 'sneak') {
      const dur = d.state === 'sneak' ? 2.4 : 1.5, k = Math.min(1, d.t / dur), e = k * k * (3 - 2 * k);
      d.obj.position.lerpVectors(d.from, d.to, e); d.obj.position.y = Math.abs(Math.sin(k * Math.PI * 4)) * .25;
      d.obj.rotation.y = Math.atan2(d.to.x - d.from.x, d.to.z - d.from.z);
      if (k >= 1) { d.state = 'hidden'; d.obj.position.copy(d.to); play(d.obj, 'idle'); hideIn(d); }
    } else if (d.state === 'hidden') {
      // Adentro del escondite no se ve: el escondite se mueve solito de vez en cuando (más seguido en los primeros niveles)
      d.obj.visible = false; d.wig = (d.wig == null ? rand(1, 3) : d.wig) - dt;
      if (d.wig < 0 && g.phase === 'search') { d.wig = rand(2.2, 3.4) + g.n * .45; d.spot.anim = Math.max(d.spot.anim, .55); rustle(.05, .25); burst(d.spot.x, d.spot.h * .7, d.spot.z, 4, leafCols(), 2.5, .22, 3.5); }
      // Escondido: mira hacia la cámara, de vez en cuando se asoma un poquito más
      const sneakPeek = Math.pow(Math.max(0, Math.sin(g.t * .55 + d.k * 2.1)), 10) * .35;   // de vez en cuando se asoma tantito y se vuelve a esconder
      const target = spotHidePos(d.spot, d.peek + sneakPeek); d.obj.position.lerp(target, Math.min(1, dt * 3)); d.obj.position.y = 0;
      const face = Math.atan2(camera.position.x - d.obj.position.x, camera.position.z - d.obj.position.z) + (d.spot.side || 1) * .6;
      d.obj.rotation.y += (face - d.obj.rotation.y) * Math.min(1, dt * 4);
      if (g.L.night) {
        // Ojitos que brillan asomándose por un ladito del escondite, del lado de la cámara
        d.eyes.visible = true; const sp = d.spot, toCam = new THREE.Vector3(camera.position.x - sp.x, 0, camera.position.z - sp.z).normalize();
        d.eyes.position.set(sp.x + toCam.x * Math.max(sp.w, sp.d) * .42 + toCam.z * (sp.side || 1) * .6, sp.h * .62, sp.z + toCam.z * Math.max(sp.w, sp.d) * .42 - toCam.x * (sp.side || 1) * .6); d.eyes.lookAt(camera.position);
        const blink = (g.t + d.k * 1.7) % 3.4 < .14; d.eyes.scale.set(1, blink ? .15 : 1, 1);
      }
    } else if (d.state === 'out') {
      const k = Math.min(1, d.t / 1.1), e = k * (2 - k);
      d.obj.position.lerpVectors(d.from, d.to, e); d.obj.position.y = Math.sin(k * Math.PI) * 3.2;
      d.obj.rotation.y = Math.atan2(d.to.x - d.from.x, d.to.z - d.from.z) * (1 - k) + k * 0;
      if (k >= 1) { d.state = 'found'; d.obj.position.copy(d.to); play(d.obj, 'idle'); burst(d.to.x, .4, d.to.z, 10, [0xffd23a, 0xffffff], 3, .22, 4); if (g.found === g.L.dinos) setTimeout(() => game === g && winLevel(), 700); }
    } else if (d.state === 'found') {
      d.obj.rotation.y = Math.sin(g.t * 2.5 + d.k) * .35; d.obj.position.y = Math.abs(Math.sin(g.t * 5 + d.k)) * .18;
    } else if (d.state === 'dance') {
      const k = Math.min(1, d.t / 1.2); d.obj.position.lerpVectors(d.from, d.to, k);
      if (k >= 1 && d.obj.userData.cur !== d.obj.userData.acts.jump) play(d.obj, 'jump');
      d.obj.rotation.y = k < 1 ? Math.atan2(d.to.x - d.from.x, d.to.z - d.from.z) : Math.sin(g.t * 3 + d.k) * .6;
    }
  }
  // Escondites que se sacuden
  for (const sp of g.spots) {
    if (sp.anim > 0) {
      sp.anim = Math.max(0, sp.anim - dt * 1.6); const a = sp.anim, w = Math.sin((1 - a) * 22) * a;
      sp.pivot.rotation.z = w * .14 * (sp.side || 1); sp.pivot.scale.set(1 + w * .06, 1 - w * .08 + a * .05, 1 + w * .06);
    } else { sp.pivot.rotation.z = 0; sp.pivot.scale.set(1, 1, 1); }
  }
  // Sorpresas que se asoman y se vuelven a esconder
  g.critters = g.critters.filter(c => {
    c.t += dt; c.o.userData.mixer.update(dt);
    const up = c.t < .35 ? c.t / .35 : c.t > 1.8 ? Math.max(0, 1 - (c.t - 1.8) / .35) : 1;
    c.o.position.set(c.p0.x, (c.sp.h * .55 + .2) * Math.sin(up * Math.PI / 2), c.p0.z + up * .8);
    c.o.rotation.y = Math.atan2(camera.position.x - c.o.position.x, camera.position.z - c.o.position.z);
    if (c.t > 2.2) { world.remove(c.o); c.sp.busy = false; return false; }
    return true;
  });
  if (g.phase === 'search') {
    g.idle += dt;
    // Pista: si tarda, el escondite de un dino se sacude solito y el dino se asoma más
    if (g.idle > 7) {
      g.idle = 3.5; const hid = g.dinos.filter(d => d.state === 'hidden');
      if (hid.length) { const d = pick(hid); shakeSpot(d.spot); sfx.giggle(); d.peek = Math.min(.9, d.peek + .18); showHand(d.spot); }
    }
    // Dinos traviesos: uno se cambia de escondite corriendo a la vista
    if (g.L.sneak) {
      g.sneakT -= dt;
      if (g.sneakT < 0) {
        g.sneakT = rand(9, 14); const hid = g.dinos.filter(d => d.state === 'hidden'), empty = g.spots.filter(s => !s.dino && !s.busy);
        if (hid.length && empty.length) {
          const d = pick(hid), ns = pick(empty); shakeSpot(d.spot); d.obj.position.set(d.spot.x, 0, d.spot.z); d.spot.dino = null; d.spot = ns; ns.dino = d; ns.side = Math.random() < .5 ? -1 : 1;
          d.state = 'sneak'; d.t = 0; d.obj.visible = true; d.from.copy(d.obj.position); d.to.copy(spotHidePos(ns, d.peek)); d.eyes.visible = false; play(d.obj, 'run'); sfx.giggle();
        }
      }
    }
  }
  // Linterna: sigue al dedo; si no lo mueve, pasea solita despacito
  if (g.L.night) {
    if (!g.torchHit) g.torchHit = new THREE.Vector3(0, 0, 0);
    if (performance.now() - (g.lastMove || 0) > 2500) g.torchHit.set(g.pan + Math.sin(g.t * .35) * g.W * .7, 0, Math.sin(g.t * .5) * 3 - 2);
    torch.target.position.lerp(g.torchHit, Math.min(1, dt * 8)); torch.position.set(torch.target.position.x * .5 + g.pan * .5, 15, 12);
    torchGlow.position.set(torch.target.position.x, .06, torch.target.position.z); torchGlow.scale.setScalar(4.6);
    for (const f of g.flies) { const u = f.userData; f.position.set(u.x + Math.sin(g.t * u.sp + u.ph) * 1.5, 1 + Math.sin(g.t * 2 + u.ph) * .5, u.z + Math.cos(g.t * u.sp * .8 + u.ph) * 1.2); }
  }
  for (const b of g.butterflies) {
    const u = b.userData, a = g.t * u.sp + u.ph;
    b.position.set(u.x + Math.cos(a) * u.r, u.h + Math.sin(g.t * 2.6 + u.ph) * .4, u.z + Math.sin(a * 1.3) * u.r * .6); b.rotation.y = -a;
    const f = Math.sin(g.t * 16 + u.ph) * .9; u.wings[0].rotation.z = f; u.wings[1].rotation.z = -f;
  }
  for (const c of g.clouds) { c.position.x += c.userData.v * dt; if (c.position.x > 50) c.position.x = -50; }
  g.birds = g.birds.filter(b => {
    b.t += dt; const u = b; u.o.position.addScaledVector(u.v, dt); u.v.y += 1.5 * dt;
    const f = Math.sin(b.t * 22) * .8; u.w[0].rotation.z = f; u.w[1].rotation.z = -f;
    if (b.t > 3) { world.remove(u.o); return false; } return true;
  });
  updateParts(dt);
  updateCamera(dt);
}

/* ---------- Dedo: tocar, deslizar (mundo panorámico) y mover la linterna ---------- */
let down = null;
app.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: performance.now(), lx: e.clientX, moved: false }; moveTorch(e); });
app.addEventListener('pointermove', e => {
  if (game && game.L.night) moveTorch(e);
  if (!down) return;
  const dx = e.clientX - down.lx; down.lx = e.clientX;
  if (Math.hypot(e.clientX - down.x, e.clientY - down.y) > 14) down.moved = true;
  if (down.moved && game && game.panMax) { game.pan -= dx * game.camDist / innerWidth * .9; game.panV = -dx * 30 * game.camDist / innerWidth; }
});
app.addEventListener('pointerup', e => { if (down && !down.moved) onTap(e.clientX, e.clientY); down = null; });
app.addEventListener('pointercancel', () => (down = null));
function moveTorch(e) {
  const g = game; if (!g || !g.L.night) return;
  ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ptr, camera);
  const p = new THREE.Vector3(); if (ray.ray.intersectPlane(groundPlane, p)) { g.torchHit = p; g.lastMove = performance.now(); }
}

/* ---------- Menú ---------- */
function buildMenu() {
  const box = $('#levels'); box.innerHTML = '';
  LEVELS.forEach((L, n) => {
    const b = document.createElement('button'); b.className = 'px lv'; b.setAttribute('aria-label', 'Nivel ' + (n + 1) + ' ' + THEMES[L.theme].name + (L.night ? ' de noche' : ''));
    b.innerHTML = `<img alt="" src="../img/hide/card-${L.night ? 'noche' : L.theme}.webp">` + `<b>${n + 1}</b>` + (L.night ? '<span class="moon"></span>' : '') + (save.done[n] ? '<span class="star"></span>' : '');
    b.addEventListener('click', () => { sfx.tap(); start(n); });
    box.appendChild(b);
  });
}
function showMenu() {
  music(false);
  if (world) { scene.remove(world); world = null; }
  game = null; app.hidden = true; $('#win').hidden = true; $('#count').hidden = true; $('#confetti').hidden = true; $('#hud').hidden = true;
  $('#menu').hidden = false; $('#menuBg').hidden = false; $('#backBtn').hidden = true; $('#title').hidden = false;
  buildMenu();
}
$('#backBtn').addEventListener('click', () => { sfx.tap(); showMenu(); });
$('#menuBtn').addEventListener('click', () => { sfx.tap(); showMenu(); });
$('#againBtn').addEventListener('click', () => { sfx.tap(); start(game.n); });
$('#nextBtn').addEventListener('click', () => { sfx.tap(); start((game.n + 1) % LEVELS.length); });
addEventListener('resize', () => { if (game) framing(); });

function confetti() {
  const c = $('#confetti'); c.hidden = false;
  const W = c.width = Math.ceil(innerWidth / 3), H = c.height = Math.ceil(innerHeight / 3), x = c.getContext('2d');
  const bits = Array.from({ length: 90 }, () => ({ x: Math.random() * W, y: -Math.random() * H * .6, v: rand(.6, 1.6), d: rand(-.4, .4), r: rand(0, 6), col: ['#ffd23a', '#ff5d8f', '#5ac8ff', '#6cc63a', '#fff'][Math.random() * 5 | 0] }));
  const t0 = performance.now();
  (function f(t) {
    x.clearRect(0, 0, W, H);
    bits.forEach(b => { b.y += b.v; b.x += b.d; b.r += .1; x.fillStyle = b.col; x.save(); x.translate(b.x, b.y); x.rotate(b.r); x.fillRect(-2, -1, 4, 2); x.restore(); });
    if (t - t0 < 3600 && !c.hidden) requestAnimationFrame(f); else c.hidden = true;
  })(t0);
}

let last = performance.now();
(function loop(t) {
  const dt = Math.min(.05, (t - last) / 1000); last = t;
  if (game && !app.hidden) { update(dt); renderer.render(scene, camera); }
  requestAnimationFrame(loop);
})(last);

resize();
showMenu();
// Para pruebas: #nivel3 abre directo ese nivel
{ const m = /^#nivel(\d+)(diag)?$/.exec(location.hash); if (m) (async () => {
  await start(Math.min(LEVELS.length, +m[1]) - 1);
  if (!m[2]) return;
  // Diagnóstico (solo pruebas): manda fotos del juego (contando y buscando) a un servidor local
  const shot = tag => { renderer.render(scene, camera); fetch('http://127.0.0.1:8799/', { method: 'POST', body: JSON.stringify({ tag, img: renderer.domElement.toDataURL('image/png'), info: { ua: navigator.userAgent, phase: game.phase } }) }); };
  const run = async (sec) => { for (let i = 0; i < sec * 30; i++) update(1 / 30); };
  await run(2.2); shot('hide-count');
  await run(1.6); game.dinos.forEach(d => { if (d.state !== 'hidden') { d.obj.position.copy(spotHidePos(d.spot, d.peek)); d.state = 'hidden'; hideIn(d); } }); game.phase = 'search'; $('#count').hidden = true; await run(2); shot('hide-search');
  const sp = game.spots.find(s => s.dino); camera.updateMatrixWorld(); const v = new THREE.Vector3(sp.x, sp.h * .5, sp.z).project(camera);
  onTap((v.x + 1) / 2 * innerWidth, (1 - v.y) / 2 * innerHeight); await run(.6); shot('hide-found');
})(); }
window.__hide = { start, update, render: () => renderer.render(scene, camera), get game() { return game; }, onTap, camera, scene };
window.LEON_READY = true;
})();
</script>
