/* Layout: jardín a pantalla completa con agujeros; los topos se asoman y se aplastan con un toque (al dino bebé no). Sin niveles: salen más agujeros y los topos se esconden más rápido. */
@font-face{font-family:'Lilita One';font-style:normal;font-weight:400;font-display:block;src:url(../vendor/fonts/i7dPIFZ9Zz-WBtRtedDbYEF8RXi4EwQ.woff2) format('woff2')}

[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#6cc63a;color:var(--ink);font-family:var(--pix);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
button{font-family:var(--pix);touch-action:manipulation;-webkit-touch-callout:none;cursor:pointer;color:var(--ink)}

@media (orientation:portrait){.bg{background-image:url(../img/mole/molebg-tall.webp)}}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.px{border:0;border-radius:18px;background:var(--sun);box-shadow:0 0 0 4px var(--ink),0 8px 0 4px rgba(42,31,61,.3)}
.px:active{transform:translateY(4px);box-shadow:0 0 0 4px var(--ink),0 4px 0 4px rgba(42,31,61,.3)}
.ibtn{width:52px;height:52px;padding:0;display:grid;place-items:center;background:#fff}
.ibtn svg{width:26px;height:26px;shape-rendering:crispEdges}
.bar{position:fixed;left:0;right:0;top:0;z-index:50;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:12px;padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));pointer-events:none}

.over{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center;background:rgba(42,31,61,.35)}
.over h2{margin:0;font-weight:400;font-size:clamp(40px,9vw,92px);color:var(--sun);-webkit-text-stroke:.07em var(--ink);paint-order:stroke fill;text-shadow:0 .08em 0 var(--ink);animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.over .pic{max-width:clamp(150px,30vmin,260px);max-height:30vh;width:auto;height:auto;object-fit:contain;filter:drop-shadow(0 8px 0 rgba(42,31,61,.3));animation:bob 1.6s ease-in-out infinite}
.over .final{display:flex;align-items:center;gap:10px;font-size:clamp(28px,5.6vw,52px);color:#fff;-webkit-text-stroke:.08em var(--ink);paint-order:stroke fill}
.over .final img{width:58px;height:58px}
.over .best{font-size:clamp(18px,3vw,26px);color:#fff;-webkit-text-stroke:.08em var(--ink);paint-order:stroke fill}
.go{min-width:clamp(150px,30vw,230px);height:clamp(76px,12vw,100px);background:var(--grass);display:flex;align-items:center;justify-content:center}
.go svg{width:44px;height:44px}
@keyframes pop{from{transform:scale(.2)}70%{transform:scale(1.15)}to{transform:none}}
@keyframes bob{50%{transform:translateY(-10px) rotate(-4deg)}}
@media (max-width:620px){.bar{gap:6px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}.ibtn{width:44px;height:44px}.side{gap:8px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}

.li-bar{height:min(5vw,26px);box-sizing:border-box;padding:4px;border-radius:99px;background:rgba(42,31,61,.75);box-shadow:0 0 0 4px #fff,0 6px 0 4px rgba(42,31,61,.3)}

<script>
// Pantalla de carga de LEÓN GAMES: dura al menos ~2.6 s; en los juegos 3D espera a que terminen de cargar los modelos
// (la barra muestra el avance real). Tocar la pantalla la salta solo cuando ya no hay nada cargando.
(() => {
  const el = document.getElementById('leonIntro'), bar = el.querySelector('.li-bar i'), t0 = performance.now();
  const MIN = matchMedia('(prefers-reduced-motion: reduce)').matches ? 800 : 2600;
  let gone = false;
  const ready = () => !window.LEON_WAIT || window.LEON_READY;
  const done = () => { if (gone) return; gone = true; bar.style.width = '100%'; setTimeout(() => el.classList.add('out'), 150); setTimeout(() => el.remove(), 700); };
  (function tick() {
    if (gone) return;
    const t = performance.now() - t0, timeP = Math.min(1, t / MIN);
    const p = window.LEON_WAIT ? Math.min(timeP, .1 + .9 * (window.LEON_READY ? 1 : (window.LEON_PROGRESS || 0) * .95)) : timeP;
    bar.style.width = Math.max(6, p * 100) + '%';
    if ((t >= MIN && ready()) || t > 25000) done(); else setTimeout(tick, 100);
  })();
  // El toque que salta la intro no debe llegar a los botones de atrás
  el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (ready()) done(); });
  ['click', 'pointerup', 'touchend'].forEach(ev => el.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); }));
})();
</script>

<script>
(() => {
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.random() * a.length | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

let save = { best: 0, muted: false };
try { Object.assign(save, JSON.parse(localStorage.getItem('topos')) || {}); } catch (e) {}
const persist = () => { try { localStorage.setItem('topos', JSON.stringify(save)); } catch (e) {} };

/* ---------- Sonido (sintetizado, sin voz) ---------- */
let actx = null;
function unlockAudio() {
  try {
    if (!actx) { actx = new (window.AudioContext || window.webkitAudioContext)(); const b = actx.createBufferSource(); b.buffer = actx.createBuffer(1, 1, 22050); b.connect(actx.destination); b.start(0); }
    if (actx.state !== 'running') actx.resume();
  } catch (e) {}
}
['pointerdown', 'touchend', 'keydown'].forEach(ev => window.addEventListener(ev, unlockAudio, { passive: true }));
function beep(f, dur = .1, type = 'square', vol = .06, slide = 0, delay = 0) {
  if (save.muted || !actx) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + delay;
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + .02);
  } catch (e) {}
}
function noise(dur, freq, vol, delay = 0) {
  if (save.muted || !actx) return;
  try {
    const n = actx.createBufferSource(), b = actx.createBuffer(1, actx.sampleRate * dur, actx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const f = actx.createBiquadFilter(), g = actx.createGain(), t = actx.currentTime + delay; f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = vol;
    n.buffer = b; n.connect(f).connect(g).connect(actx.destination); n.start(t);
  } catch (e) {}
}
let combo = 0, comboT = 0;
const sfx = {
  tap: () => beep(520, .07, 'square', .05, 200),
  swish: () => noise(.08, 2400, .05),
  splat: () => { noise(.12, 700, .12); const k = Math.min(combo, 8); beep(440 * Math.pow(2, k / 12), .08, 'square', .045, 300, .02); },
  big: () => { noise(.2, 500, .16); [0, 4, 7, 12].forEach((s, i) => beep(523 * Math.pow(2, s / 12), .1, 'square', .05, 0, i * .07)); },
  hit: () => { noise(.06, 900, .08); beep(200, .08, 'triangle', .06, 80); },
  miss: () => beep(330, .25, 'triangle', .06, -180),
  heart: () => [784, 1047, 1319].forEach((f, i) => beep(f, .1, 'square', .045, 0, i * .07)),
  over: () => [523, 440, 392, 330, 392, 523].forEach((f, i) => beep(f, .16, 'square', .05, 0, i * .14)),
  start: () => [523, 659, 784, 1047].forEach((f, i) => beep(f, .1, 'square', .05, 0, i * .08)),
};
// Musiquita de picnic, alegre y saltarina; se acelera cuando el juego se pone difícil
const SONG = [0, 4, 7, 4, 9, 7, 4, 2, 0, 4, 7, 12, 9, 7, 5, 4], BASS = [0, 0, 5, 5, 7, 7, 0, 0];
let songStep = 0, songNext = 0;
function musicTick(now, speed) {
  if (save.muted || !actx || document.hidden || now < songNext) return;
  songNext = now + 200 / speed;
  beep(523 * Math.pow(2, SONG[songStep % SONG.length] / 12), .14, 'square', .018);
  if (songStep % 2 === 0) beep(131 * Math.pow(2, BASS[(songStep >> 1) % BASS.length] / 12), .22, 'triangle', .045);
  songStep++;
}
const ICON_ON = '<svg viewBox="0 0 16 16" fill="#2a1f3d"><path d="M1 6h3l4-4h1v12H8l-4-4H1z"/><path d="M11 5h1v1h1v4h-1v1h-1zM13 3h1v1h1v8h-1v1h-1v-2h1V5h-1z"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 16 16" fill="#2a1f3d"><path d="M1 6h3l4-4h1v12H8l-4-4H1z"/><path fill="#ff5d8f" d="M10 5h2v1h1V5h2v2h-1v1h1v2h-2v-1h-1v1h-2V8h1V7h-1z"/></svg>';
function paintMute() { $('#muteBtn').innerHTML = save.muted ? ICON_OFF : ICON_ON; $('#muteBtn').setAttribute('aria-label', save.muted ? 'Activar sonido' : 'Silenciar sonido'); }
$('#muteBtn').addEventListener('click', e => { e.stopPropagation(); save.muted = !save.muted; persist(); paintMute(); sfx.tap(); });
paintMute();
if (window.LEON_HUB) { const b = $('#homeBtn'); b.hidden = false; b.addEventListener('click', () => { sfx.tap(); location.href = window.LEON_HUB; }); }
['gesturestart', 'gesturechange'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
document.addEventListener('contextmenu', e => e.preventDefault());


/* ---------- Dibujos ---------- */
const HEART = '../img/bugs/heart.webp', UPM = '../img/mole/';
const NAMES = ['mole', 'mole-hit', 'gold', 'gold-hit', 'helmet', 'helmet-hit', 'baby', 'hammer', 'hole', 'lip'];
const IMG = {};
const ready = Promise.all(NAMES.map(n => new Promise(res => { const im = new Image(); im.onload = im.onerror = () => { IMG[n] = im; res(); }; im.src = UPM + n + '.webp'; })));

const cv = $('#game'), cx = cv.getContext('2d');
let W = 0, H = 0, U = 60, game = null;
function drawImg(n, x, y, w, opts = {}) {
  const im = IMG[n]; if (!im || !im.width) return false;
  const h = w * im.height / im.width; cx.save(); cx.globalAlpha = opts.a == null ? 1 : opts.a; cx.translate(x, y); if (opts.rot) cx.rotate(opts.rot); if (opts.flip) cx.scale(-1, 1); cx.drawImage(im, -w / 2, opts.bottom ? -h : -h / 2, w, h); cx.restore(); return true;
}
function paintHearts() { $('#hearts').innerHTML = Array.from({ length: MAXH }, (_, i) => `<img alt="" class="${i < game.hearts ? '' : 'off'}" src="${HEART}">`).join(''); }
function paintScore(bump) { $('#scoreN').textContent = game.score; if (bump) { const s = $('#score'); s.classList.remove('bump'); void s.offsetWidth; s.classList.add('bump'); } }
function text(txt, x, y, size, color, a = 1) { cx.save(); cx.globalAlpha = a; cx.font = `${Math.round(size)}px 'Lilita One', sans-serif`; cx.textAlign = 'center'; cx.lineWidth = Math.max(4, size * .14); cx.strokeStyle = '#2a1f3d'; cx.fillStyle = color; cx.strokeText(txt, x, y); cx.fillText(txt, x, y); cx.restore(); }
function star(x, y, r, c = '#ffd23a') { cx.fillStyle = c; cx.strokeStyle = '#2a1f3d'; cx.lineWidth = 2; cx.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; cx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } cx.closePath(); cx.fill(); cx.stroke(); }
function finishGame() {
  const g = game; g.over = true; sfx.over();
  const best = g.score > save.best; if (best) { save.best = g.score; persist(); }
  setTimeout(() => { $('#finalN').textContent = g.score; $('#bestTxt').textContent = best ? '¡NUEVO RÉCORD!' : 'Récord: ' + save.best; $('#endScr').hidden = false; $('#hud').hidden = true; }, 900);
}

const MAXH = 5;
let holes = [];
// Los agujeros: empiezan 3, luego 5, 6 y 9 conforme pasa el tiempo
function layout(n) {
  const cols = 3, rows = Math.ceil(n / cols), top = 130, bot = 30, aw = W - 40, ah = H - top - bot;
  const cw = aw / cols, ch = ah / rows; U = Math.max(60, Math.min(cw * .62, ch * .7, 170));
  holes = Array.from({ length: n }, (_, i) => { const r = Math.floor(i / cols), c = i % cols, inRow = Math.min(cols, n - r * cols); return { x: 20 + (c + (cols - inRow) / 2 + .5) * cw, y: top + (r + .62) * ch, m: holes[i] ? holes[i].m : null }; });
}
function resize() { const d = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0); layout(holes.length || 3); }
addEventListener('resize', resize); resize();
const nHoles = () => game.t < 20 ? 3 : game.t < 45 ? 6 : 9;
function start() {
  holes = []; layout(3);
  game = { t: 0, score: 0, hearts: MAXH, fx: [], spawnT: .8, over: false, shake: 0, swing: null, nextHeart: 50 };
  $('#startScr').hidden = true; $('#endScr').hidden = true; $('#hud').hidden = false; paintHearts(); paintScore(); sfx.start();
}
const diff = () => game.t < 100 ? game.t / 100 : 1 + (game.t - 100) / 250;
function spawn() {
  const free = holes.filter(h => !h.m); if (!free.length) return;
  const d = diff(), h = pick(free), r = Math.random();
  const kind = game.t > 10 && r < .14 ? 'baby' : game.t > 25 && r < .3 ? 'helmet' : r > .92 ? 'gold' : 'mole';
  // Cuánto tiempo se queda afuera: mucho al principio, menos con el tiempo
  h.m = { kind, t: 0, up: Math.max(.95, 2.2 - d * 1.1) * (kind === 'gold' ? .7 : 1), hp: kind === 'helmet' ? 2 : 1, hit: 0 };
}
function update(dt) {
  const g = game; if (!g || g.over) return;
  g.t += dt; g.shake = Math.max(0, g.shake - dt * 20);
  if (holes.length !== nHoles()) { layout(nHoles()); sfx.more(); }
  const d = diff();
  g.spawnT -= dt; if (g.spawnT <= 0) { spawn(); if (d > .6 && Math.random() < d * .35) spawn(); g.spawnT = Math.max(.4, 1.3 - d * .8) * rand(.8, 1.2); }
  for (const h of holes) { const m = h.m; if (!m) continue; m.t += dt;
    if (m.hit) { m.hit += dt; if (m.hit > .55) h.m = null; continue; }
    if (m.t > m.up + .5) { if (m.kind !== 'baby') { g.hearts--; paintHearts(); sfx.miss(); g.fx.push({ t: 0, txt: '¡Se fue!', x: h.x, y: h.y - U * .9, bad: 1 }); if (g.hearts <= 0) { h.m = null; return finishGame(); } } h.m = null; } }
  // Corazón de premio flotando: tócalo para recuperar una vida
  if (g.t > g.nextHeart && g.hearts < MAXH && !g.fx.some(f => f.heart)) { g.nextHeart = g.t + rand(35, 50); g.fx.push({ t: 0, heart: 1, x: rand(W * .2, W * .8), y: rand(H * .35, H * .75) }); }
  if (g.swing) { g.swing.t += dt; if (g.swing.t > .25) g.swing = null; }
  for (const f of g.fx) f.t += dt; g.fx = g.fx.filter(f => f.t < (f.heart ? 6 : 1));
  musicTick(performance.now(), 1 + Math.min(1, d) * .6);
}
// ¿Cuánto se asoma? sube rápido, se queda, baja
const rise = m => m.hit ? Math.max(0, 1 - m.hit * 2.2) : m.t < .18 ? m.t / .18 : m.t < m.up ? 1 : Math.max(0, 1 - (m.t - m.up) / .3);
function tapAt(x, y) {
  const g = game; if (!g || g.over) return;
  g.swing = { x, y, t: 0 };
  const hi = g.fx.find(f => f.heart && Math.hypot(f.x - x, f.y - y) < U * .8);
  if (hi) { hi.t = 99; g.hearts = Math.min(MAXH, g.hearts + 1); paintHearts(); sfx.heart(); return; }
  // Golpe generoso: cuenta todo el agujero y lo que sale de él
  let best = null, bd = 1e9; for (const h of holes) { if (!h.m || h.m.hit || rise(h.m) < .3) continue; const dd = Math.hypot(h.x - x, (h.y - U * .45) - y); if (dd < U * 1.05 && dd < bd) { bd = dd; best = h; } }
  if (!best) { sfx.whoosh(); return; }
  const m = best.m;
  if (m.kind === 'baby') { m.hit = .001; g.hearts--; paintHearts(); sfx.ouch(); g.shake = 6; g.fx.push({ t: 0, txt: '¡Al dino no!', x: best.x, y: best.y - U * 1.1, bad: 1 }); if (g.hearts <= 0) return finishGame(); return; }
  m.hp--; g.shake = 4;
  if (m.hp > 0) { sfx.clang(); g.fx.push({ t: 0, txt: '¡Clang!', x: best.x, y: best.y - U * 1.1 }); m.t = Math.min(m.t, m.up - .4); return; }
  m.hit = .001; const p = m.kind === 'gold' ? 5 : m.kind === 'helmet' ? 2 : 1; g.score += p; paintScore(true); m.kind === 'gold' ? sfx.gold() : sfx.bonk();
  g.fx.push({ t: 0, txt: '+' + p, x: best.x, y: best.y - U * 1.1 });
  for (let i = 0; i < (p > 1 ? 10 : 5); i++) g.fx.push({ t: 0, star: 1, x: best.x, y: best.y - U * .5, vx: rand(-1, 1), vy: rand(-1.6, -.6) });
}
function render() {
  cx.clearRect(0, 0, W, H);
  const g = game;
  cx.save(); if (g && g.shake) cx.translate(rand(-g.shake, g.shake), rand(-g.shake, g.shake));
  for (const h of holes) {
    const hw = U * 1.6; drawImg('hole', h.x, h.y, hw);
    const m = h.m;
    if (m) { const k = rise(m), n = m.hit && m.kind !== 'baby' ? m.kind + '-hit' : m.kind, mw = U * 1.15, im = IMG[n];
      if (im && im.width) { const mh = mw * im.height / im.width; cx.save(); cx.beginPath(); cx.rect(h.x - hw, 0, hw * 2, h.y + U * .12); cx.clip(); cx.drawImage(im, h.x - mw / 2, h.y + U * .12 - mh * k, mw, mh); cx.restore(); } }
    drawImg('lip', h.x, h.y + U * .28, hw);
  }
  if (g) {
    for (const f of g.fx) { if (f.heart) drawHeart(f.x, f.y, U * .75 * (1 + Math.sin(f.t * 6) * .08), Math.min(1, (6 - f.t) * 2));
      else if (f.star) star(f.x + f.vx * f.t * 150, f.y + f.vy * f.t * 150 + f.t * f.t * 220, U * .14 * (1 - f.t));
      else text(f.txt, f.x, f.y - f.t * 50, U * .38, f.bad ? '#ff8fa8' : '#ffd23a', 1 - f.t); }
    // El martillo baja donde tocaste
    if (g.swing) { const p = g.swing.t / .25, ang = p < .35 ? -.9 + p / .35 * 1.2 : .3 - (p - .35) * .9; const im = IMG.hammer;
      if (im && im.width) { const w = U * 1.1, hh = w * im.height / im.width; cx.save(); cx.globalAlpha = p > .8 ? (1 - p) * 5 : 1; cx.translate(g.swing.x + w * .55, g.swing.y + hh * .55); cx.rotate(ang - .5); cx.drawImage(im, -w / 2, -hh, w, hh); cx.restore(); } }
  }
  cx.restore();
}
const HEARTIMG = new Image(); HEARTIMG.src = HEART;
function drawHeart(x, y, s, a) { if (!HEARTIMG.width) return; cx.save(); cx.globalAlpha = a; cx.drawImage(HEARTIMG, x - s / 2, y - s / 2, s, s); cx.restore(); }
cv.addEventListener('pointerdown', e => { e.preventDefault(); tapAt(e.clientX, e.clientY); });
sfx.bonk = () => { noise(.1, 800, .12); beep(500, .08, 'square', .05, 300, .02); };
sfx.gold = () => [0, 4, 7, 12, 16].forEach((s2, i) => beep(523 * Math.pow(2, s2 / 12), .08, 'square', .05, 0, i * .05));
sfx.clang = () => { beep(1200, .12, 'triangle', .06, -300); beep(1800, .1, 'triangle', .04, 0, .02); };
sfx.ouch = () => beep(330, .3, 'triangle', .07, -160);
sfx.whoosh = () => noise(.06, 2400, .04);
sfx.more = () => [523, 784].forEach((f, i) => beep(f, .1, 'square', .045, 0, i * .08));

let last = performance.now();
(function loop(t) { const dt = Math.min(.05, (t - last) / 1000); last = t; update(dt); render(); requestAnimationFrame(loop); })(last);
$('#playBtn').addEventListener('click', () => { unlockAudio(); start(); });
$('#againBtn').addEventListener('click', () => { unlockAudio(); start(); });
ready.then(() => { window.LEON_READY = true; render(); });
window.__topos = { start, update, render, tapAt, get game() { return game; }, get holes() { return holes; } };
if (location.hash === '#diag') ready.then(async () => {
  const errs = []; addEventListener('error', e => errs.push(e.message));
  const shot = (tag, info) => fetch('http://127.0.0.1:8799/', { method: 'POST', body: JSON.stringify({ tag, img: cv.toDataURL('image/png'), info: Object.assign({ ua: navigator.userAgent, errs, t: game && game.t, score: game && game.score, hearts: game && game.hearts, holes: holes.length }, info || {}) }) });
  start();
  // Pega a todos los topos (nunca al dino bebé)
  for (let i = 0; i < 60 * 70; i++) { update(1 / 60); if (i % 12 === 0) for (const h of holes) if (h.m && !h.m.hit && h.m.kind !== 'baby' && rise(h.m) > .6) { tapAt(h.x, h.y - U * .45); break; } if (i === 60 * 15) { render(); await shot('mole-15s'); } } render(); await shot('mole-70s');
  for (let i = 0; i < 60 * 120 && !game.over; i++) update(1 / 60); await new Promise(r => setTimeout(r, 1100)); render(); await shot('mole-end', { over: game.over, endShown: !$('#endScr').hidden });
});

})();
</script>
