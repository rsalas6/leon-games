<script>
// Pantalla de carga de LEÓN GAMES: dura al menos ~2.6 s; en los juegos 3D espera a que terminen de cargar los modelos
// (la barra muestra el avance real). Tocar la pantalla la salta solo cuando ya no hay nada cargando.
(() => {
  const el = document.getElementById('leonIntro'), bar = el.querySelector('.li-bar i'), t0 = performance.now();
  const MIN = matchMedia('(prefers-reduced-motion: reduce)').matches ? 800 : 2600;
  let gone = false;
  const ready = () => !window.LEON_WAIT || window.LEON_READY;
  const done = () => { if (gone) return; gone = true; bar.style.width = '100%'; setTimeout(() => el.classList.add('out'), 150); setTimeout(() => el.remove(), 700); };
  (function tick() {
    if (gone) return;
    const t = performance.now() - t0, timeP = Math.min(1, t / MIN);
    const p = window.LEON_WAIT ? Math.min(timeP, .1 + .9 * (window.LEON_READY ? 1 : (window.LEON_PROGRESS || 0) * .95)) : timeP;
    bar.style.width = Math.max(6, p * 100) + '%';
    if ((t >= MIN && ready()) || t > 25000) done(); else setTimeout(tick, 100);
  })();
  // El toque que salta la intro no debe llegar a los botones de atrás
  el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (ready()) done(); });
  ['click', 'pointerup', 'touchend'].forEach(ev => el.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); }));
})();
</script>

<script>
(() => {
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.random() * a.length | 0];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let save = { done: {}, muted: false };
try { Object.assign(save, JSON.parse(localStorage.getItem('dinoMoto')) || {}); } catch (e) {}
const persist = () => { try { localStorage.setItem('dinoMoto', JSON.stringify(save)); } catch (e) {} };

/* ---------- Sonido (sintetizado, sin voz) ---------- */
let actx = null, noiseBuf = null;
function unlockAudio() {
  try {
    if (!actx) { actx = new (window.AudioContext || window.webkitAudioContext)(); const b = actx.createBufferSource(); b.buffer = actx.createBuffer(1, 1, 22050); b.connect(actx.destination); b.start(0);
      noiseBuf = actx.createBuffer(1, actx.sampleRate * .5, actx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    if (actx.state !== 'running') actx.resume();
  } catch (e) {}
}
['pointerdown', 'touchend', 'keydown'].forEach(ev => window.addEventListener(ev, unlockAudio, { passive: true }));
function beep(f, dur = .1, type = 'square', vol = .06, slide = 0, delay = 0) {
  if (save.muted || !actx) return;
  try { const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + delay; o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + dur); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + .02); } catch (e) {}
}
function noise(vol = .12, dur = .3, freq = 1200, q = .8) {
  if (save.muted || !actx || !noiseBuf) return;

  ctx.lineTo(sx(x1), H + 5); ctx.closePath();
  const gr = ctx.createLinearGradient(0, sy(g.camY), 0, H); gr.addColorStop(0, T.dirt); gr.addColorStop(1, T.dirt2); ctx.fillStyle = gr; ctx.fill();
  // Piedritas en la tierra
  ctx.fillStyle = T.dots; for (let x = Math.floor(x0); x < x1; x++) { const r = (Math.sin(x * 12.9898) * 43758.5453) % 1, yy = groundY(x) - 1 - Math.abs(r) * 3; ctx.beginPath(); ctx.ellipse(sx(x + Math.abs(r)), sy(yy), s * .14, s * .09, 0, 0, 7); ctx.fill(); }
  // Pasto/arena/nieve arriba con orilla
  ctx.lineJoin = 'round'; ctx.beginPath(); for (let x = x0; x <= x1; x += STEP) { const X = sx(x), Y = sy(groundY(x)); x === x0 ? ctx.moveTo(X, Y) : ctx.lineTo(X, Y); }
  ctx.strokeStyle = T.top2; ctx.lineWidth = s * .55; ctx.stroke(); ctx.strokeStyle = T.top; ctx.lineWidth = s * .35; ctx.stroke();
  ctx.strokeStyle = 'rgba(42,31,61,.55)'; ctx.lineWidth = 3; ctx.stroke();
  // Banderines de los 40 m y la meta
  for (let x = 40; x < g.L.len; x += 40) if (x > x0 - 2 && x < x1 + 2) { const X = sx(x), Y = sy(groundY(x)); ctx.fillStyle = '#2a1f3d'; ctx.fillRect(X - 2, Y - s * 1.6, 4, s * 1.6); ctx.fillStyle = x <= g.check ? '#6cc63a' : '#ff5d8f'; ctx.beginPath(); ctx.moveTo(X + 2, Y - s * 1.6); ctx.lineTo(X + s * .8, Y - s * 1.35); ctx.lineTo(X + 2, Y - s * 1.1); ctx.fill(); }
  sprite('moto/flag', sx(g.L.len), sy(groundY(g.L.len) + 1.4), s * 2.8);
  // Monedas que giran
  for (const c of g.coins) if (!c.got && c.x > x0 - 1 && c.x < x1 + 1) { const k = Math.abs(Math.cos(g.t * 4 + c.x)); const im = IMG['moto/coin']; if (im && im.width) { const hh = s * .8, ww = hh * im.width / im.height * (.3 + .7 * k); ctx.drawImage(im, sx(c.x) - ww / 2, sy(c.y) - hh / 2, ww, hh); } }
  // Moto
  if (g.crashT <= 0 || Math.floor(g.t * 10) % 2) {
    const X = sx(b.x), Y = sy(b.y);
    ctx.save(); ctx.translate(X, Y); ctx.rotate(-b.a);
    for (const side of [-1, 1]) { ctx.save(); ctx.translate(side * WB * s, -WY * s); ctx.rotate(g.wheelRot || 0); const im = IMG['moto/wheel']; if (im && im.width) ctx.drawImage(im, -WR * s * 1.12, -WR * s * 1.12, WR * s * 2.24, WR * s * 2.24); ctx.restore(); }
    const im = IMG['moto/rider']; if (im && im.width) { const hh = s * 2.6, ww = hh * im.width / im.height; ctx.drawImage(im, -ww * .5 - (.004 * ww), -hh * .72, ww, hh); }
    ctx.restore();
  }
  drawP2(0);
}

/* ---------- Menú ---------- */
function buildMenu() {
  const box = $('#levels'); box.innerHTML = '';
  let next = LEVELS.findIndex((_, n) => !save.done[n]); if (next < 0) next = 0;
  LEVELS.forEach((L, n) => {
    const b = document.createElement('button'); b.className = 'px lv' + (n === next ? ' next' : ''); b.setAttribute('aria-label', 'Nivel ' + (n + 1) + ' ' + THEMES[L.theme].name);
    const st = save.done[n] ? '<span class="stars">' + '<i></i>'.repeat(save.done[n] === true ? 1 : save.done[n]) + '</span>' : '';
    b.innerHTML = `<img alt="" src="../img/moto/card-${L.theme}.webp"><img class="chr" alt="" src="../img/moto/rider.webp"><b>${n + 1}</b><span class="nm">${THEMES[L.theme].name}</span>${st}`;
    b.addEventListener('click', () => { sfx.tap(); start(n); }); box.appendChild(b);
  });
}
function showMenu() {
  music(false); engineOn(false); game = null; app.hidden = true; $('#win').hidden = true; $('#confetti').hidden = true; $('#hud').hidden = true; $('#pads').hidden = true; $('#hint').hidden = true;
  $('#menu').hidden = false; $('#menuBg').hidden = false; $('#backBtn').hidden = true; $('#title').hidden = false; $('#winTxt').textContent = '¡LO LOGRASTE!';
  buildMenu();
}
$('#backBtn').addEventListener('click', () => { sfx.tap(); showMenu(); });
$('#menuBtn').addEventListener('click', () => { sfx.tap(); showMenu(); });
$('#againBtn').addEventListener('click', () => { sfx.tap(); start(game.n); });
$('#nextBtn').addEventListener('click', () => { sfx.tap(); start((game.n + 1) % LEVELS.length); });
let last = performance.now();
(function loop(t) { const dt = Math.min(.05, (t - last) / 1000); last = t; if (game && !app.hidden) { update(dt); draw(); } requestAnimationFrame(loop); })(last);
resize(); showMenu();
window.__moto = { start, update, draw, LEVELS, get game() { return game; }, set auto(v) { game.auto = v; } };
window.LEON_READY = true;

})();
</script>
