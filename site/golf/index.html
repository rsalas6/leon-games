<script>
// Pantalla de carga de LEÓN GAMES: dura al menos ~2.6 s; en los juegos 3D espera a que terminen de cargar los modelos
// (la barra muestra el avance real). Tocar la pantalla la salta solo cuando ya no hay nada cargando.
(() => {
  const el = document.getElementById('leonIntro'), bar = el.querySelector('.li-bar i'), t0 = performance.now();
  const MIN = matchMedia('(prefers-reduced-motion: reduce)').matches ? 800 : 2600;
  let gone = false;
  const ready = () => !window.LEON_WAIT || window.LEON_READY;
  const done = () => { if (gone) return; gone = true; bar.style.width = '100%'; setTimeout(() => el.classList.add('out'), 150); setTimeout(() => el.remove(), 700); };
  (function tick() {
    if (gone) return;
    const t = performance.now() - t0, timeP = Math.min(1, t / MIN);
    const p = window.LEON_WAIT ? Math.min(timeP, .1 + .9 * (window.LEON_READY ? 1 : (window.LEON_PROGRESS || 0) * .95)) : timeP;
    bar.style.width = Math.max(6, p * 100) + '%';
    if ((t >= MIN && ready()) || t > 25000) done(); else setTimeout(tick, 100);
  })();
  // El toque que salta la intro no debe llegar a los botones de atrás
  el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (ready()) done(); });
  ['click', 'pointerup', 'touchend'].forEach(ev => el.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); }));
})();
</script>

<script>/* Modelos 3D (glTF) compartidos: se cargan una vez y se clonan; funcionan sin internet porque se guardan con la app */
const MODELS = {};
function loadModels(names, base) {
  const loader = new THREE.GLTFLoader();
  let done = 0; const tick = () => { done++; window.LEON_PROGRESS = done / names.length; };
  return Promise.all(names.map(n => MODELS[n] ? (tick(), Promise.resolve()) : new Promise(res => {
    loader.load(base + n + '.glb', g => { tick();
      // Los juegos usan colores "tal cual" (sin conversión de color), así que las texturas también se leen tal cual,
      // y los materiales pasan a Lambert: luz suave, barata para el iPad y pareja con el resto del mundo
      g.scene.traverse(o => {
        if (!o.isMesh) return;
        o.castShadow = true; o.receiveShadow = true;
        // Pesos del esqueleto en decimales (vienen como enteros 0-255/65535 y Three r128 no los convierte al calcular poses a mano)
        const sw = o.geometry && o.geometry.attributes.skinWeight;
        if (sw && sw.normalized && !(sw.array instanceof Float32Array)) {
          const max = sw.array instanceof Uint8Array ? 255 : 65535, f = new Float32Array(sw.array.length);
          for (let i = 0; i < f.length; i++) f[i] = sw.array[i] / max;
          o.geometry.setAttribute('skinWeight', new THREE.BufferAttribute(f, sw.itemSize));
        }
        // glTF guarda los colores en espacio lineal; los juegos pintan los colores tal cual, así que se regresan a sRGB (si no, salen casi negros)
        // Una textura que no cargó (imagen vacía) haría el objeto negro: mejor sin textura
        const okMap = mt => mt.map && mt.map.image && (mt.map.image.width || mt.map.image.naturalWidth) ? mt.map : null;
        const conv = mt => { const l = new THREE.MeshLambertMaterial({ name: mt.name, color: mt.color.clone().convertLinearToSRGB(), map: okMap(mt), skinning: !!o.isSkinnedMesh, vertexColors: mt.vertexColors }); if (l.map) l.map.encoding = THREE.LinearEncoding; return l; };
        o.material = Array.isArray(o.material) ? o.material.map(conv) : conv(o.material);
      });
      MODELS[n] = g; res();
    }, undefined, () => { tick(); console.warn('modelo no encontrado', n); res(); });
  })));
}
// Clona un modelo (con esqueleto si es animado) y lo escala para que su lado más largo mida `size`
function modelClone(name, size) {
  const src = MODELS[name]; if (!src) return new THREE.Group();
  const o = src.animations.length ? THREE.SkeletonUtils.clone(src.scene) : src.scene.clone(true);
  if (size) { const s = modelBox(o).getSize(new THREE.Vector3()); o.scale.multiplyScalar(size / Math.max(s.x, s.y, s.z)); }
  return o;
}
// Caja real del modelo: con esqueleto, la caja de la geometría no sirve (los huesos la reescalan), así que se mide con los huesos y los vértices deformados
function modelBox(o) {
  o.updateMatrixWorld(true);
  const box = new THREE.Box3(), v = new THREE.Vector3();
  let skinned = false;
  o.traverse(m => {
    if (!m.isSkinnedMesh) return; skinned = true;
    const p = m.geometry.attributes.position, step = Math.max(1, Math.floor(p.count / 300));
    for (let i = 0; i < p.count; i += step) { v.fromBufferAttribute(p, i); m.boneTransform(i, v); box.expandByPoint(v.applyMatrix4(m.matrixWorld)); }
  });
  return skinned ? box : box.setFromObject(o);
}
// Pinta los materiales de un clon: fn(nombreMaterial) devuelve un color (o null para dejarlo igual).
// Los materiales pintados se comparten entre clones para no crear cientos de copias.
const RECOLOR_CACHE = new Map();
function recolor(o, fn) {
  o.traverse(m => {
    if (!m.isMesh) return;
    const one = mt => {

  if (night) for (let i = 0; i < 6; i++) { const p = new THREE.Mesh(new THREE.SphereGeometry(rand(.8, 2.2), 20, 14), M(pick([0xff9a2e, 0x5ac8ff, 0xff5d8f, 0xffd23a]), { emissive: 0x302040 })); const a = rand(0, 6.3); p.position.set(Math.cos(a) * rand(14, 22), rand(2, 8), Math.sin(a) * rand(14, 22) - 4); world.add(p); }
  game.water = []; game.sand = []; game.bumpers = []; game.mills = []; game.blocks = [];
  for (let r = 0; r < game.Hh; r++) for (let c = 0; c < game.W; c++) {
    const ch = m[r][c], x = cx(c), z = cz(r);
    if (ch === '#') {
      // Bordes de madera solo junto al pasto (lo de afuera queda bajito)
      const touches = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dc, dr]) => !solid(c + dc, r + dr));
      if (touches) { const b = new THREE.Mesh(new THREE.BoxGeometry(CELL, .5, CELL), M(T.rail)); b.position.set(x, .25, z); b.castShadow = true; b.receiveShadow = true; world.add(b); }

    const t = new THREE.Mesh(new THREE.BoxGeometry(CELL, .2, CELL), M(col, ch === 'W' ? { emissive: 0x1a70b0, emissiveIntensity: .3 } : {})); t.position.set(x, ch === 'W' ? -.15 : -.1, z); t.receiveShadow = true; world.add(t);
    if (ch === 'W') game.water.push({ c, r });
    if (ch === 'A') game.sand.push({ c, r });
    if (ch === 'S') game.start = { x, z };
    if (ch === 'H') { game.hole = { x, z }; const cup = new THREE.Mesh(new THREE.CircleGeometry(.52, 24).rotateX(-Math.PI / 2), M(0x1a1420)); cup.position.set(x, .01, z); world.add(cup);
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(.04, .04, 2.2, 8), M(0xffffff)); pole.position.set(x, 1.1, z); pole.castShadow = true; world.add(pole);
      const fs = new THREE.Shape(); fs.moveTo(0, 0); fs.lineTo(.9, -.25); fs.lineTo(0, -.5); fs.closePath(); const fl = new THREE.Mesh(new THREE.ShapeGeometry(fs), M(0xff3a3a, { side: THREE.DoubleSide })); fl.position.set(x + .04, 2.2, z); world.add(fl); game.flag = fl; }
    if (ch === 'O') { const g = new THREE.Group(); const st = new THREE.Mesh(new THREE.CylinderGeometry(.25, .32, .5, 12), M(0xfff2e0)); st.position.y = .25; g.add(st); const cap = new THREE.Mesh(new THREE.SphereGeometry(.55, 16, 10, 0, Math.PI * 2, 0, Math.PI / 2), M(0xe8423a)); cap.position.y = .45; g.add(cap); for (let i = 0; i < 5; i++) { const d = new THREE.Mesh(new THREE.SphereGeometry(.09, 8, 6), M(0xffffff)); const a = i / 5 * 6.3; d.position.set(Math.cos(a) * .35, .75, Math.sin(a) * .35); g.add(d); } g.traverse(o => o.castShadow = true); g.position.set(x, 0, z); world.add(g); game.bumpers.push({ x, z, r: .5, obj: g, pop: 0 }); }
    if (ch === 'M') { // molino: casita con aspas que giran (las aspas estorban)
      const g = new THREE.Group(); const hut = new THREE.Mesh(new THREE.CylinderGeometry(.5, .7, 1.6, 8), M(0xfff0d8)); hut.position.set(0, .8, -.9); hut.castShadow = true; g.add(hut); const rf = new THREE.Mesh(new THREE.ConeGeometry(.75, .8, 8), M(0xe8423a)); rf.position.set(0, 2, -.9); g.add(rf);
      const hub = new THREE.Group(); hub.position.set(0, .45, 0); g.add(hub); const cols = [0xff5d8f, 0xffd23a, 0x5ac8ff, 0x8fe04a];
      for (let i = 0; i < 4; i++) { const bl = new THREE.Mesh(new THREE.BoxGeometry(.25, .3, 1.7), M(cols[i])); bl.position.z = .85; const arm = new THREE.Group(); arm.rotation.y = i * Math.PI / 2; arm.add(bl); hub.add(arm); bl.castShadow = true; }
      g.position.set(x, 0, z); world.add(g); game.mills.push({ x, z, a: 0, hub, sp: 1.4 + game.mills.length * .3 }); }
    if (ch === 'X') { const b = new THREE.Mesh(new THREE.BoxGeometry(CELL * .7, .6, CELL * .5), M(0x8a5ad8)); b.position.set(x, .3, z); b.castShadow = true; world.add(b); game.blocks.push({ c, r, x0: x, x, z, obj: b, ph: (c % 2) * Math.PI }); }
  }
  // Los bloques que se mueven: uno por fila, que va de lado a lado
  const rows = {}; game.blocks.forEach(b => (rows[b.r] = rows[b.r] || []).push(b));
  game.blocks.forEach(b => world.remove(b.obj)); game.blocks = Object.values(rows).map((bs, i) => { const minx = Math.min(...bs.map(b => b.x0)), maxx = Math.max(...bs.map(b => b.x0)), o = new THREE.Mesh(new THREE.BoxGeometry(CELL * 1.2, .6, CELL * .55), M(0x8a5ad8)); o.castShadow = true; world.add(o); return { minx, maxx, z: bs[0].z, x: minx, obj: o, ph: i * 1.7, w: CELL * .6, d: CELL * .28 }; });
  // Adornos alrededor
  const T2 = THEMES[H.theme];
  for (let i = 0; i < 14 && T2.decor.length; i++) { const a = i / 14 * Math.PI * 2, rr = Math.max(game.W, game.Hh) * 1.1 + rand(0, 2); const o = mdl(pick(T2.decor)); fit(o, 1.8, rand(1.5, 3)); o.position.set(Math.cos(a) * rr, 0, Math.sin(a) * rr * .9); world.add(o); }
}

/* ---------- Empezar ---------- */
let loadingLvl = false;
async function start(n) {
  if (loadingLvl) return; const H = HOLES[n], need = levelModels(H);
  if (need.some(m => !MODELS[m])) { loadingLvl = true; const ov = $('#lvlLoad'); ov.hidden = false; await loadModels(need, '../models/'); ov.hidden = true; loadingLvl = false; }
  startNow(n);
}
function startNow(n) {
  const H = HOLES[n];
  game = { n, H, t: 0, phase: 'aim', strokes: 0, last: null };
  buildWorld(H);
  const b = new THREE.Mesh(new THREE.SphereGeometry(BR, 24, 16), new THREE.MeshLambertMaterial({ map: BALL_TEX })); b.castShadow = true; world.add(b);
  game.ball = { obj: b, x: game.start.x, z: game.start.z, vx: 0, vz: 0, y: BR, sink: 0 }; game.last = { ...game.start };
  // Flecha para apuntar: puntitos y una flecha
  game.aim = new THREE.Group(); for (let i = 0; i < 10; i++) { const d = new THREE.Mesh(new THREE.CircleGeometry(.11, 12).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, depthWrite: false })); game.aim.add(d); } world.add(game.aim); game.aim.visible = false;
  game.pow = new THREE.Mesh(new THREE.RingGeometry(.4, .55, 32, 1, 0, 0).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffd23a, side: THREE.DoubleSide, transparent: true, depthWrite: false })); world.add(game.pow);
  paintHud(); framing();
  $('#lvl').textContent = 'HOYO ' + (n + 1);
  $('#menu').hidden = true; $('#menuBg').hidden = true; $('#title').hidden = true; $('#win').hidden = true;
  app.hidden = false; $('#hud').hidden = false; $('#backBtn').hidden = false; $('#hint').hidden = false;
  resize(); music(true, SONG, BASS, 250); banner('PAR ' + H.par); sfx.go();
}
function paintHud() { const g = game; $('#goal').innerHTML = `<span class="gi">🏌️ ${g.strokes}</span><span class="par">PAR ${g.H.par}</span>`; }
function framing() {
  const g = game, aspect = innerWidth / innerHeight, vFov = camera.fov * Math.PI / 180, hFov = 2 * Math.atan(Math.tan(vFov / 2) * aspect);
  const hw = g.W * CELL / 2 + 1, hh = g.Hh * CELL / 2 + 1.5, dist = Math.max(hw / Math.tan(hFov / 2), hh / Math.tan(vFov / 2) * .9) * 1.05;
  camera.position.set(0, dist * .86, dist * .55); camera.lookAt(0, 0, .4);
}
addEventListener('resize', () => { if (game) framing(); });

/* ---------- Tirar: jalar hacia atrás y soltar ---------- */
let drag = null;
app.addEventListener('pointerdown', e => { if (!game || game.phase !== 'aim') return; drag = { x: e.clientX, y: e.clientY, dx: 0, dy: 0 }; try { app.setPointerCapture(e.pointerId); } catch (er) {} });
app.addEventListener('pointermove', e => { if (!drag) return; drag.dx = e.clientX - drag.x; drag.dy = e.clientY - drag.y; });
['pointerup', 'pointercancel'].forEach(ev => app.addEventListener(ev, () => { if (!drag) return; const d = drag; drag = null; game.aim.visible = false; const p = shotFrom(d); if (p && p.pow > .06) shoot(p.dx, p.dz, p.pow); }));
// Dirección en el piso: lo contrario a donde jaló el dedo (como resortera)
function shotFrom(d) { const len = Math.hypot(d.dx, d.dy); if (len < 12) return null; const pow = Math.min(1, len / (Math.min(innerWidth, innerHeight) * .35)); const k = 1 / len; return { dx: -d.dx * k, dz: -d.dy * k, pow }; }
function shoot(dx, dz, pow) { const g = game, b = g.ball; if (g.phase !== 'aim') return; const sp = 3 + pow * 15; b.vx = dx * sp; b.vz = dz * sp; g.phase = 'roll'; g.strokes++; g.last = { x: b.x, z: b.z }; gsf.hit(pow); paintHud(); }

/* ---------- Física ---------- */
function collideBox(b, x0, z0, x1, z1, rest, vbx = 0) {
  const qx = clamp(b.x, x0, x1), qz = clamp(b.z, z0, z1), dx = b.x - qx, dz = b.z - qz, d = Math.hypot(dx, dz);
  if (d >= BR || d === 0 && !(b.x > x0 && b.x < x1 && b.z > z0 && b.z < z1)) return false;
  let nx, nz; if (d > 1e-5) { nx = dx / d; nz = dz / d; } else { const l = b.x - x0, r = x1 - b.x, t = b.z - z0, bo = z1 - b.z, m = Math.min(l, r, t, bo); nx = m === l ? -1 : m === r ? 1 : 0; nz = m === t ? -1 : m === bo ? 1 : 0; }
  b.x = qx + nx * BR * 1.001; b.z = qz + nz * BR * 1.001; if (d < 1e-5) { b.x += nx * BR; b.z += nz * BR; }
  const rvx = b.vx - vbx, vn = rvx * nx + b.vz * nz; if (vn < 0) { b.vx -= (1 + rest) * vn * nx; b.vz -= (1 + rest) * vn * nz; if (-vn > 1) gsf.wall(-vn); }
  return true;
}
function update(dt) {
  const g = game, b = g.ball; g.t += dt;
  // Molinos y bloques se mueven siempre
  g.mills.forEach(m => { m.a += m.sp * dt; m.hub.rotation.y = m.a; });
  g.blocks.forEach(k => { const span = k.maxx - k.minx; k.x = k.minx + (Math.sin(g.t * 1.2 + k.ph) * .5 + .5) * span; k.vx = Math.cos(g.t * 1.2 + k.ph) * .5 * span * 1.2; k.obj.position.set(k.x, .3, k.z); });
  g.bumpers.forEach(o => { o.pop = Math.max(0, o.pop - dt * 4); o.obj.scale.set(1 + o.pop * .3, 1 - o.pop * .2, 1 + o.pop * .3); });
  if (g.flag) g.flag.rotation.y = Math.sin(g.t * 3) * .3;
  if (g.phase === 'roll') {
    const steps = 6, h = dt / steps;
    for (let s = 0; s < steps; s++) {
      b.x += b.vx * h; b.z += b.vz * h;
      // Paredes (cuadritos sólidos alrededor)
      const c0 = Math.round(b.x / CELL + (g.W - 1) / 2), r0 = Math.round(b.z / CELL + (g.Hh - 1) / 2);
      for (let r = r0 - 1; r <= r0 + 1; r++) for (let c = c0 - 1; c <= c0 + 1; c++) if (solid(c, r)) collideBox(b, cx(c) - CELL / 2, cz(r) - CELL / 2, cx(c) + CELL / 2, cz(r) + CELL / 2, .72);
      // Hongos que rebotan (más fuerte)
      for (const o of g.bumpers) { const dx = b.x - o.x, dz = b.z - o.z, d = Math.hypot(dx, dz); if (d < o.r + BR) { const nx = dx / d, nz = dz / d; b.x = o.x + nx * (o.r + BR); b.z = o.z + nz * (o.r + BR); const vn = b.vx * nx + b.vz * nz; if (vn < 0) { b.vx -= 2 * vn * nx; b.vz -= 2 * vn * nz; const sp = Math.hypot(b.vx, b.vz), ns = Math.max(sp * 1.15, 5); b.vx *= ns / sp; b.vz *= ns / sp; o.pop = 1; gsf.boing(); } } }
      // Aspas del molino: 4 brazos que giran
      for (const m of g.mills) for (let i = 0; i < 4; i++) { const a = m.a + i * Math.PI / 2, ex = Math.sin(a), ez = Math.cos(a); const px = b.x - m.x, pz = b.z - m.z, t = clamp(px * ex + pz * ez, 0, 1.7), qx = ex * t, qz = ez * t, dx = px - qx, dz = pz - qz, d = Math.hypot(dx, dz);
        if (d < BR + .14) { const nx = dx / (d || 1), nz = dz / (d || 1); b.x = m.x + qx + nx * (BR + .15); b.z = m.z + qz + nz * (BR + .15); const bvx = -m.sp * qz * 1, bvz = m.sp * qx; const rvx = b.vx - bvx, rvz = b.vz - bvz, vn = rvx * nx + rvz * nz; if (vn < 0) { b.vx -= 1.6 * vn * nx; b.vz -= 1.6 * vn * nz; gsf.wall(-vn); } } }
      // Bloques que se mueven
      for (const k of g.blocks) collideBox(b, k.x - k.w, k.z - k.d, k.x + k.w, k.z + k.d, .8, k.vx);
    }
    // Arena frena mucho, el pasto un poquito
    const c0 = Math.round(b.x / CELL + (g.W - 1) / 2), r0 = Math.round(b.z / CELL + (g.Hh - 1) / 2), here = cellAt(c0, r0);
    const sp = Math.hypot(b.vx, b.vz), fr = here === 'A' ? 7 : 1.6, ns = Math.max(0, sp - fr * dt) * Math.exp(-.35 * dt);
    if (sp > 0) { b.vx *= ns / sp; b.vz *= ns / sp; }
    b.obj.rotation.x += b.vz * dt / BR; b.obj.rotation.z -= b.vx * dt / BR;
    // ¡Al hoyo! (si no va muy rápido)
    const hx = g.hole.x - b.x, hz = g.hole.z - b.z, hd = Math.hypot(hx, hz);
    if (hd < .5 && ns < 9) { g.phase = 'cup'; b.sink = 0; gsf.cup(); }
    else if (hd < .9 && ns > .3) { b.vx += hx / hd * 1.2 * dt; b.vz += hz / hd * 1.2 * dt; } // se curva tantito hacia el hoyo
    // Agua: regresa a donde tiró
    if (here === 'W' && ns < 7) { gsf.splash(); burst(b.x, .1, b.z, 18, [0xffffff, 0x9ad8ff], 3, .25, 4); banner('¡AL AGUA!'); b.x = g.last.x; b.z = g.last.z; b.vx = b.vz = 0; g.strokes++; paintHud(); g.phase = 'aim'; }
    else if (ns < .05) { b.vx = b.vz = 0; g.phase = 'aim'; }
  }
  if (g.phase === 'cup') { b.sink += dt; const k = Math.min(1, b.sink / .3); b.x += (g.hole.x - b.x) * k; b.z += (g.hole.z - b.z) * k; b.y = BR - b.sink * 1.6; if (b.sink > .45) holeDone(); }
  else b.y = BR;
  b.obj.position.set(b.x, b.y, b.z);
  // Apuntar: puntitos hacia donde va a salir, más largos con más fuerza

  g.aim.visible = !!p; g.pow.visible = g.phase === 'aim';
  if (p) { const n = 3 + Math.round(p.pow * 7); g.aim.children.forEach((d, i) => { d.visible = i < n; d.position.set(b.x + p.dx * (.6 + i * .55), .03, b.z + p.dz * (.6 + i * .55)); d.material.color.setHex(p.pow > .75 ? 0xff5d5d : p.pow > .4 ? 0xffd23a : 0xffffff); }); }
  g.pow.position.set(b.x, .03, b.z); g.pow.geometry.dispose(); g.pow.geometry = new THREE.RingGeometry(.42, .56, 32, 1, 0, Math.max(.01, (p ? p.pow : 0) * Math.PI * 2)).rotateX(-Math.PI / 2);
  updateParts(dt);
}
function holeDone() {
  const g = game; if (g.phase === 'done') return; g.phase = 'done'; const d = g.strokes - g.H.par, stars = d <= 0 ? 3 : d <= 2 ? 2 : 1;
  save.done[g.n] = Math.max(save.done[g.n] || 0, stars); persist(); sfx.win(); confetti(); burst(g.hole.x, .5, g.hole.z, 30, [0xffd23a, 0xff5d8f, 0x5ac8ff, 0xffffff], 5, .3, 7);
  const word = g.strokes === 1 ? '¡HOYO EN UNO!' : d < 0 ? '¡BIRDIE!' : d === 0 ? '¡PAR!' : '¡LO LOGRASTE!';
  $('#winTxt').innerHTML = word + '<br>' + '⭐'.repeat(stars);
  setTimeout(() => { if (game === g) $('#win').hidden = false; }, 1200);
}

/* ---------- Menú ---------- */
function buildMenu() {
  const box = $('#levels'); box.innerHTML = '';
  let next = HOLES.findIndex((_, n) => !save.done[n]); if (next < 0) next = 0;
  HOLES.forEach((H, n) => {
    const b = document.createElement('button'); b.className = 'px lv' + (n === next ? ' next' : ''); b.setAttribute('aria-label', 'Hoyo ' + (n + 1) + ' ' + THEMES[H.theme].name);
    const st = save.done[n] ? '<span class="stars">' + '<i></i>'.repeat(save.done[n] === true ? 1 : save.done[n]) + '</span>' : '';
    b.innerHTML = `<img alt="" src="../img/golf/mc-${H.theme}.webp"><b>${n + 1}</b><span class="goals">PAR ${H.par}</span><span class="nm">${THEMES[H.theme].name}</span>${st}`;
    b.addEventListener('click', () => { sfx.tap(); start(n); }); box.appendChild(b);
  });
}
function showMenu() {
  music(false); if (world) { scene.remove(world); world = null; }
  game = null; app.hidden = true; $('#win').hidden = true; $('#confetti').hidden = true; $('#hud').hidden = true; $('#hint').hidden = true;
  $('#menu').hidden = false; $('#menuBg').hidden = false; $('#backBtn').hidden = true; $('#title').hidden = false; $('#winTxt').textContent = '¡LO LOGRASTE!';
  buildMenu();
}
$('#backBtn').addEventListener('click', () => { sfx.tap(); showMenu(); });
$('#menuBtn').addEventListener('click', () => { sfx.tap(); showMenu(); });
$('#againBtn').addEventListener('click', () => { sfx.tap(); start(game.n); });
$('#nextBtn').addEventListener('click', () => { sfx.tap(); start((game.n + 1) % HOLES.length); });
let last = performance.now();
(function loop(t) { const dt = Math.min(.05, (t - last) / 1000); last = t; if (game && !app.hidden) { update(dt); renderer.render(scene, camera); } requestAnimationFrame(loop); })(last);
resize(); showMenu();
window.__golf = { start, update, shoot, HOLES, render: () => renderer.render(scene, camera), get game() { return game; } };
window.LEON_READY = true;

})();
</script>
