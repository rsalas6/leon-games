<script>
// Pantalla de carga de LEÓN GAMES: dura al menos ~2.6 s; en los juegos 3D espera a que terminen de cargar los modelos
// (la barra muestra el avance real). Tocar la pantalla la salta solo cuando ya no hay nada cargando.
(() => {
  const el = document.getElementById('leonIntro'), bar = el.querySelector('.li-bar i'), t0 = performance.now();
  const MIN = matchMedia('(prefers-reduced-motion: reduce)').matches ? 800 : 2600;
  let gone = false;
  const ready = () => !window.LEON_WAIT || window.LEON_READY;
  const done = () => { if (gone) return; gone = true; bar.style.width = '100%'; setTimeout(() => el.classList.add('out'), 150); setTimeout(() => el.remove(), 700); };
  (function tick() {
    if (gone) return;
    const t = performance.now() - t0, timeP = Math.min(1, t / MIN);
    const p = window.LEON_WAIT ? Math.min(timeP, .1 + .9 * (window.LEON_READY ? 1 : (window.LEON_PROGRESS || 0) * .95)) : timeP;
    bar.style.width = Math.max(6, p * 100) + '%';
    if ((t >= MIN && ready()) || t > 25000) done(); else setTimeout(tick, 100);
  })();
  // El toque que salta la intro no debe llegar a los botones de atrás
  el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (ready()) done(); });
  ['click', 'pointerup', 'touchend'].forEach(ev => el.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); }));
})();
</script>

}
const ICON_ON = '<svg viewBox="0 0 16 16" fill="#2a1f3d"><path d="M1 6h3l4-4h1v12H8l-4-4H1z"/><path d="M11 5h1v1h1v4h-1v1h-1zM13 3h1v1h1v8h-1v1h-1v-2h1V5h-1z"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 16 16" fill="#2a1f3d"><path d="M1 6h3l4-4h1v12H8l-4-4H1z"/><path fill="#ff5d8f" d="M10 5h2v1h1V5h2v2h-1v1h1v2h-2v-1h-1v1h-2V8h1V7h-1z"/></svg>';
function paintMute() { $('#muteBtn').innerHTML = save.muted ? ICON_OFF : ICON_ON; }
$('#muteBtn').addEventListener('click', () => { save.muted = !save.muted; persist(); paintMute(); sfx.tap(); });
paintMute();
if (window.LEON_HUB) { const b = $('#homeBtn'); b.hidden = false; b.addEventListener('click', () => { sfx.tap(); location.href = window.LEON_HUB; }); }
['gesturestart', 'gesturechange'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
document.addEventListener('contextmenu', e => e.preventDefault());

const app = $('#app');
function banner(t) { const b = document.createElement('div'); b.id = 'banner'; b.textContent = t; document.body.appendChild(b); setTimeout(() => b.remove(), 1700); }
function confetti() {
  const c = $('#confetti'); c.hidden = false; const W = c.width = Math.ceil(innerWidth / 3), H = c.height = Math.ceil(innerHeight / 3), x = c.getContext('2d');
  const bits = Array.from({ length: 90 }, () => ({ x: Math.random() * W, y: -Math.random() * H * .6, v: rand(.6, 1.6), d: rand(-.4, .4), r: rand(0, 6), col: pick(['#ffd23a', '#ff5d8f', '#5ac8ff', '#6cc63a', '#fff']) })); const t0 = performance.now();
  (function f(t) { x.clearRect(0, 0, W, H); bits.forEach(b => { b.y += b.v; b.x += b.d; b.r += .1; x.fillStyle = b.col; x.save(); x.translate(b.x, b.y); x.rotate(b.r); x.fillRect(-2, -1, 4, 2); x.restore(); }); if (t - t0 < 3600 && !c.hidden) requestAnimationFrame(f); else c.hidden = true; })(t0);
}
const keys = new Set(); addEventListener('keydown', e => { if (e.key.startsWith('Arrow')) { keys.add(e.key); e.preventDefault(); } }); addEventListener('keyup', e => keys.delete(e.key));

/* ---------- Lienzo 2D (se ve nítido en el iPad) ---------- */
const cv = document.createElement('canvas'); app.appendChild(cv); const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() { DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
addEventListener('resize', resize);
// Imágenes del juego: se cargan al abrir un nivel (con barrita)
const IMG = {};
function loadImgs(list) {
  const need = list.filter(n => !IMG[n]); if (!need.length) return Promise.resolve();
  const ov = $('#lvlLoad'), bar = ov.querySelector('i'); ov.hidden = false; let done = 0;
  return Promise.all(need.map(n => new Promise(res => { const im = new Image(); im.onload = im.onerror = () => { done++; bar.style.width = Math.max(8, done / need.length * 100) + '%'; IMG[n] = im; res(); }; im.src = '../img/' + n + '.webp'; }))).then(() => { ov.hidden = true; });
}
// Dibuja una imagen centrada en (x, y) con alto h (y ancho según su forma), girada a
function sprite(name, x, y, h, a = 0, flip = false, alpha = 1) {
  const im = IMG[name]; if (!im || !im.width) return; const w = h * im.width / im.height;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); if (a) ctx.rotate(a); if (flip) ctx.scale(-1, 1); ctx.drawImage(im, -w / 2, -h / 2, w, h); ctx.restore();
}
// Chispitas y textos que flotan
const P2 = [];
function sparks(x, y, n, cols, sp = 220, size = 7) { for (let i = 0; i < n; i++) { const a = rand(0, 6.3), v = rand(.3, 1) * sp; P2.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - sp * .3, life: rand(.5, 1), c: pick(cols), s: size * rand(.6, 1.3), rot: rand(0, 6) }); } }
function floatText(x, y, t, c = '#ffd23a') { P2.push({ x, y, vx: 0, vy: -80, life: 1, text: t, c }); }
function stepP2(dt, camX = 0) {
  for (let i = P2.length - 1; i >= 0; i--) { const p = P2[i]; p.life -= dt; if (p.life <= 0) { P2.splice(i, 1); continue; } p.x += p.vx * dt; p.y += p.vy * dt; if (!p.text) { p.vy += 500 * dt; p.rot += dt * 6; } }
}
function drawP2(camX = 0) {
  for (const p of P2) {
    ctx.globalAlpha = Math.min(1, p.life * 2);
    if (p.text) { ctx.font = `${Math.round(H * .05)}px 'Lilita One',sans-serif`; ctx.textAlign = 'center'; ctx.lineWidth = 6; ctx.strokeStyle = '#2a1f3d'; ctx.strokeText(p.text, p.x - camX, p.y); ctx.fillStyle = p.c; ctx.fillText(p.text, p.x - camX, p.y); }
    else { ctx.save(); ctx.translate(p.x - camX, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); ctx.restore(); }
  }
  ctx.globalAlpha = 1;
}
// Fondo que se repite de lado y se mueve más lento que el piso (se siente profundo)
function drawBg(name, camX, k = .25) {
  // Cada copia va en espejo de la anterior: así no se nota la unión aunque el dibujo no empate
  const im = IMG[name]; if (!im || !im.width) return; const h = H, w = h * im.width / im.height, off = camX * k; let i = Math.floor(off / w), x = i * w - off;
  for (; x < W; x += w, i++) { if (i % 2) { ctx.save(); ctx.translate(Math.floor(x) + Math.ceil(w), 0); ctx.scale(-1, 1); ctx.drawImage(im, 0, 0, Math.ceil(w) + 1, h); ctx.restore(); } else ctx.drawImage(im, Math.floor(x), 0, Math.ceil(w) + 1, h); }
}

/* ---------- Dino Vuela: el pterodáctilo vuela solo hacia adelante; el dedo lo sube y lo baja ---------- */
const SONG = [0, 2, 4, 7, 9, 7, 4, 2, 4, 7, 12, 9, 7, 4, 2, 0], BASS = [0, 0, 7, 7, 5, 5, 7, 7];
const THEMES = { cielo: { name: 'Cielo' }, atardecer: { name: 'Atardecer' }, selva: { name: 'Selva' }, noche: { name: 'Noche' } };
// len: segundos de vuelo; storms/birds: qué tantos obstáculos (por cada 10 s); speed
const LEVELS = [
  ['cielo', 40, 0, 0, 1], ['cielo', 50, 1, 0, 1.05], ['cielo', 55, 1, 1, 1.1],
  ['atardecer', 55, 1.5, 1, 1.1], ['atardecer', 60, 2, 1.5, 1.15], ['atardecer', 65, 2, 2, 1.2],
  ['selva', 60, 2, 2, 1.2], ['selva', 65, 2.5, 2.5, 1.25], ['selva', 70, 3, 2.5, 1.3],
  ['noche', 65, 2.5, 2.5, 1.3], ['noche', 70, 3, 3, 1.35], ['noche', 80, 3.5, 3.5, 1.4],
].map(([theme, len, storms, birds, speed], i) => ({ theme, len, storms, birds, speed, seed: 11 + i * 97 }));
const vsfx = {
  star: k => { beep(1047 + (k % 5) * 80, .06, 'square', .04); beep(1568, .08, 'square', .03, 0, .05); },
  pop: () => { noise(.25, .08, 3000, 1); beep(1200, .06, 'square', .04, -600); },
  ring: () => [0, 4, 7, 12].forEach((n, i) => beep(784 * Math.pow(2, n / 12), .1, 'triangle', .05, 0, i * .05)),
  zap: () => { noise(.3, .35, 2000, .5); beep(150, .3, 'sawtooth', .05, -80); },
  flap: () => beep(300, .06, 'triangle', .02, 120),
};
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

let game = null;
const IMGS = ['fly/ptero1', 'fly/ptero2', 'fly/star', 'fly/balloon', 'fly/storm', 'fly/bird', 'fly/rainbow', 'fly/ring'];
async function start(n) { const L = LEVELS[n]; await loadImgs([...IMGS, 'fly/bg-' + L.theme]); startNow(n); }
// Todo se mide en "pantallas de alto" (U = alto de la pantalla): así se ve igual en el iPad parado o acostado
const U = () => H;
function startNow(n) {
  const L = LEVELS[n], R = rng(L.seed), sp = .42 * L.speed; // velocidad: pantallas-de-alto por segundo
  game = { n, L, t: 0, phase: 'play', x: 0, y: .5, vy: 0, ty: .5, sp, items: [], got: 0, hurt: 0, total: 0 };
  const end = L.len * sp; game.end = end;
  // Patrones: ondas de estrellas, globos, aros; luego obstáculos con espacio para pasar
  for (let x = 1.2; x < end - .8; ) {
    const kind = R();
    if (kind < .45) { const y0 = .25 + R() * .5, amp = R() * .18; for (let j = 0; j < 6; j++) game.items.push({ k: 'star', x: x + j * .16, y: y0 + Math.sin(j / 5 * Math.PI * 2) * amp }); x += 1.3; }
    else if (kind < .65) { for (let j = 0; j < 3; j++) game.items.push({ k: 'balloon', x: x + j * .35, y: .2 + R() * .6, ph: R() * 6 }); x += 1.3; }
    else if (kind < .8) { game.items.push({ k: 'ring', x, y: .25 + R() * .5 }); x += .9; }
    else x += .5;
    // Obstáculos (nunca encima de un aro o estrellas: van en los huecos)
    if (R() < (L.storms + L.birds) / 10 * 1.4) { const isBird = R() < L.birds / Math.max(.01, L.storms + L.birds); game.items.push(isBird ? { k: 'bird', x: x + .2, y: .2 + R() * .6, ph: R() * 6 } : { k: 'storm', x: x + .2, y: R() < .5 ? .2 + R() * .15 : .65 + R() * .15 }); x += .7; }
  }
  game.total = game.items.filter(i => i.k === 'star').length + game.items.filter(i => i.k === 'balloon').length + game.items.filter(i => i.k === 'ring').length * 3;
  paintHud();
  $('#lvl').textContent = 'NIVEL ' + (n + 1);
  $('#menu').hidden = true; $('#menuBg').hidden = true; $('#title').hidden = true; $('#win').hidden = true;
  app.hidden = false; $('#hud').hidden = false; $('#backBtn').hidden = false; $('#hint').hidden = false;
  resize(); music(true, SONG, BASS, 230); banner('¡A VOLAR!'); sfx.go();
}
function paintHud() { const g = game; $('#goal').innerHTML = `<span class="prog"><i style="width:${Math.min(100, g.x / g.end * 100)}%"></i><b>🌈</b></span><span class="cn"><img alt="" src="../img/fly/star.webp">${g.got}</span>`; }

/* ---------- Dedo: el pterodáctilo sube o baja hacia donde está el dedo ---------- */
let fy = null;
app.addEventListener('pointerdown', e => { fy = e.clientY / innerHeight; $('#hint').hidden = true; try { app.setPointerCapture(e.pointerId); } catch (er) {} });
app.addEventListener('pointermove', e => { if (fy != null) fy = e.clientY / innerHeight; });
['pointerup', 'pointercancel'].forEach(ev => app.addEventListener(ev, () => { fy = null; }));

function update(dt) {
  const g = game; g.t += dt;
  if (g.phase === 'play') {
    g.x += g.sp * dt;
    if (fy != null) g.ty = clamp(fy, .1, .9);
    if (keys.has('ArrowUp')) g.ty = clamp(g.y - .2, .1, .9); if (keys.has('ArrowDown')) g.ty = clamp(g.y + .2, .1, .9);
    if (g.auto != null) g.ty = g.auto;
    const prev = g.y; g.y += (g.ty - g.y) * Math.min(1, dt * 6); g.vy = (g.y - prev) / dt;
  }
  if (g.hurt > 0) g.hurt -= dt;
  // ¿Choca o recoge algo?  (el pterodáctilo está a .3 del ancho de pantalla, en x = g.x)
  const aspect = W / H;
  for (const it of g.items) {
    if (it.done) continue;
    if (it.k === 'bird') it.y += Math.sin(g.t * 3 + it.ph) * .12 * dt;
    if (it.k === 'balloon') it.yy = it.y + Math.sin(g.t * 2 + it.ph) * .03;
    const iy = it.yy != null ? it.yy : it.y, dx = it.x - g.x, dy = iy - g.y;
    if (dx < -.3) { it.done = true; continue; }
    const r = it.k === 'storm' ? .1 : it.k === 'ring' ? .06 : it.k === 'bird' ? .07 : .08;
    if (Math.abs(dx) < r + .06 && Math.abs(dy) < (it.k === 'ring' ? .1 : r + .05)) {
      if (it.k === 'storm' || it.k === 'bird') { if (g.hurt <= 0) hurt(it); continue; }
      it.done = true; const X = W * .3 + dx * U(), Y = iy * H;
      if (it.k === 'star') { g.got++; vsfx.star(g.got); sparks(X, Y, 6, ['#ffd23a', '#fff'], 160, 6); }
      if (it.k === 'balloon') { g.got++; vsfx.pop(); sparks(X, Y, 14, ['#ff5d8f', '#fff', '#ffd23a'], 220, 7); floatText(X, Y, '+1'); }
      if (it.k === 'ring') { g.got += 3; vsfx.ring(); sparks(X, Y, 16, ['#ffd23a', '#fff', '#5ac8ff'], 240, 7); floatText(X, Y, '+3'); }
      paintHud();
    }
  }
  if (Math.floor(g.t * 4) !== Math.floor((g.t - dt) * 4)) paintHud();
  if (g.phase === 'play' && g.x >= g.end) winLevel();
  if (g.phase === 'win') { g.x += g.sp * dt * .6; g.y += (.4 - g.y) * dt * 2; }
  if (Math.floor(g.t * 3.5) !== Math.floor((g.t - dt) * 3.5)) vsfx.flap();
  stepP2(dt);
}
// Un choque no termina el juego: suelta unas estrellas y parpadea un ratito
function hurt(it) { const g = game; g.hurt = 1.6; vsfx.zap(); const lost = Math.min(3, g.got); g.got -= lost; const X = W * .3, Y = g.y * H; for (let i = 0; i < lost; i++) floatText(X + rand(-30, 30), Y, '-1', '#ff5d8f'); sparks(X, Y, 12, ['#5a5a7a', '#ffd23a', '#fff'], 200, 6); banner('¡AY!'); paintHud(); }
function winLevel() {
  const g = game; g.phase = 'win'; const pct = g.got / Math.max(1, g.total), stars = pct >= .7 ? 3 : pct >= .4 ? 2 : 1;
  save.done[g.n] = Math.max(save.done[g.n] || 0, stars); persist(); confetti(); sfx.win();
  $('#winTxt').innerHTML = '¡LLEGASTE!<br>' + '⭐'.repeat(stars);
  setTimeout(() => { if (game === g) $('#win').hidden = false; }, 1500);
}
function draw() {
  const g = game, u = U();
  ctx.clearRect(0, 0, W, H);
  drawBg('fly/bg-' + g.L.theme, g.x * u, .35);
  const toX = x => W * .3 + (x - g.x) * u;
  // Arcoíris de la meta
  sprite('fly/rainbow', toX(g.end + .25), H * .5, H * .7);
  for (const it of g.items) {
    if (it.done) continue; const X = toX(it.x); if (X < -100 || X > W + 100) continue; const Y = (it.yy != null ? it.yy : it.y) * H;
    if (it.k === 'star') sprite('fly/star', X, Y, H * .075, Math.sin(g.t * 3 + it.x * 9) * .2);
    if (it.k === 'balloon') sprite('fly/balloon', X, Y + H * .03, H * .14, Math.sin(g.t * 2 + it.ph) * .1);
    if (it.k === 'ring') sprite('fly/ring', X, Y, H * .2, 0, false);
    if (it.k === 'storm') { sprite('fly/storm', X, Y, H * .2); if (Math.sin(g.t * 9 + it.x) > .7) { ctx.fillStyle = 'rgba(255,240,120,.25)'; ctx.beginPath(); ctx.arc(X, Y, H * .12, 0, 7); ctx.fill(); } }
    if (it.k === 'bird') sprite('fly/bird', X, Y, H * .1, Math.sin(g.t * 6 + it.ph) * .1, true);
  }
  // Pterodáctilo: aletea y se inclina según suba o baje
  if (g.hurt <= 0 || Math.floor(g.t * 12) % 2) sprite(Math.floor(g.t * 7) % 2 ? 'fly/ptero1' : 'fly/ptero2', W * .3, g.y * H, H * .16, clamp(g.vy * .5, -.4, .4));
  drawP2(0);
}

/* ---------- Menú ---------- */
function buildMenu() {
  const box = $('#levels'); box.innerHTML = '';
  let next = LEVELS.findIndex((_, n) => !save.done[n]); if (next < 0) next = 0;
  LEVELS.forEach((L, n) => {
    const b = document.createElement('button'); b.className = 'px lv' + (n === next ? ' next' : ''); b.setAttribute('aria-label', 'Nivel ' + (n + 1) + ' ' + THEMES[L.theme].name);
    const st = save.done[n] ? '<span class="stars">' + '<i></i>'.repeat(save.done[n] === true ? 1 : save.done[n]) + '</span>' : '';
    b.innerHTML = `<img alt="" src="../img/fly/card-${L.theme}.webp"><img class="chr" alt="" src="../img/fly/ptero1.webp"><b>${n + 1}</b><span class="nm">${THEMES[L.theme].name}</span>${st}`;
    b.addEventListener('click', () => { sfx.tap(); start(n); }); box.appendChild(b);
  });
}
function showMenu() {
  music(false); game = null; app.hidden = true; $('#win').hidden = true; $('#confetti').hidden = true; $('#hud').hidden = true; $('#hint').hidden = true;
  $('#menu').hidden = false; $('#menuBg').hidden = false; $('#backBtn').hidden = true; $('#title').hidden = false; $('#winTxt').textContent = '¡LO LOGRASTE!';
  buildMenu();
}
$('#backBtn').addEventListener('click', () => { sfx.tap(); showMenu(); });
$('#menuBtn').addEventListener('click', () => { sfx.tap(); showMenu(); });
$('#againBtn').addEventListener('click', () => { sfx.tap(); start(game.n); });
$('#nextBtn').addEventListener('click', () => { sfx.tap(); start((game.n + 1) % LEVELS.length); });
let last = performance.now();
(function loop(t) { const dt = Math.min(.05, (t - last) / 1000); last = t; if (game && !app.hidden) { update(dt); draw(); } requestAnimationFrame(loop); })(last);
resize(); showMenu();
window.__vuela = { start, update, draw, LEVELS, get game() { return game; } };
window.LEON_READY = true;

})();
</script>
