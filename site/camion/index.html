<script>
// Pantalla de carga de LEÓN GAMES: dura al menos ~2.6 s; en los juegos 3D espera a que terminen de cargar los modelos
// (la barra muestra el avance real). Tocar la pantalla la salta solo cuando ya no hay nada cargando.
(() => {
  const el = document.getElementById('leonIntro'), bar = el.querySelector('.li-bar i'), t0 = performance.now();
  const MIN = matchMedia('(prefers-reduced-motion: reduce)').matches ? 800 : 2600;
  let gone = false;
  const ready = () => !window.LEON_WAIT || window.LEON_READY;
  const done = () => { if (gone) return; gone = true; bar.style.width = '100%'; setTimeout(() => el.classList.add('out'), 150); setTimeout(() => el.remove(), 700); };
  (function tick() {
    if (gone) return;
    const t = performance.now() - t0, timeP = Math.min(1, t / MIN);
    const p = window.LEON_WAIT ? Math.min(timeP, .1 + .9 * (window.LEON_READY ? 1 : (window.LEON_PROGRESS || 0) * .95)) : timeP;
    bar.style.width = Math.max(6, p * 100) + '%';
    if ((t >= MIN && ready()) || t > 25000) done(); else setTimeout(tick, 100);
  })();
  // El toque que salta la intro no debe llegar a los botones de atrás
  el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (ready()) done(); });
  ['click', 'pointerup', 'touchend'].forEach(ev => el.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); }));
})();
</script>

<script>/* Modelos 3D (glTF) compartidos: se cargan una vez y se clonan; funcionan sin internet porque se guardan con la app */
const MODELS = {};
function loadModels(names, base) {
  const loader = new THREE.GLTFLoader();
  let done = 0; const tick = () => { done++; window.LEON_PROGRESS = done / names.length; };
  return Promise.all(names.map(n => MODELS[n] ? (tick(), Promise.resolve()) : new Promise(res => {
    loader.load(base + n + '.glb', g => { tick();
      // Los juegos usan colores "tal cual" (sin conversión de color), así que las texturas también se leen tal cual,
      // y los materiales pasan a Lambert: luz suave, barata para el iPad y pareja con el resto del mundo
      g.scene.traverse(o => {
        if (!o.isMesh) return;
        o.castShadow = true; o.receiveShadow = true;
        // Pesos del esqueleto en decimales (vienen como enteros 0-255/65535 y Three r128 no los convierte al calcular poses a mano)
        const sw = o.geometry && o.geometry.attributes.skinWeight;
        if (sw && sw.normalized && !(sw.array instanceof Float32Array)) {
          const max = sw.array instanceof Uint8Array ? 255 : 65535, f = new Float32Array(sw.array.length);
          for (let i = 0; i < f.length; i++) f[i] = sw.array[i] / max;
          o.geometry.setAttribute('skinWeight', new THREE.BufferAttribute(f, sw.itemSize));
        }
        // glTF guarda los colores en espacio lineal; los juegos pintan los colores tal cual, así que se regresan a sRGB (si no, salen casi negros)
        // Una textura que no cargó (imagen vacía) haría el objeto negro: mejor sin textura
        const okMap = mt => mt.map && mt.map.image && (mt.map.image.width || mt.map.image.naturalWidth) ? mt.map : null;
        const conv = mt => { const l = new THREE.MeshLambertMaterial({ name: mt.name, color: mt.color.clone().convertLinearToSRGB(), map: okMap(mt), skinning: !!o.isSkinnedMesh, vertexColors: mt.vertexColors }); if (l.map) l.map.encoding = THREE.LinearEncoding; return l; };
        o.material = Array.isArray(o.material) ? o.material.map(conv) : conv(o.material);
      });
      MODELS[n] = g; res();
    }, undefined, () => { tick(); console.warn('modelo no encontrado', n); res(); });
  })));
}
// Clona un modelo (con esqueleto si es animado) y lo escala para que su lado más largo mida `size`
function modelClone(name, size) {
  const src = MODELS[name]; if (!src) return new THREE.Group();
  const o = src.animations.length ? THREE.SkeletonUtils.clone(src.scene) : src.scene.clone(true);
  if (size) { const s = modelBox(o).getSize(new THREE.Vector3()); o.scale.multiplyScalar(size / Math.max(s.x, s.y, s.z)); }
  return o;
}
// Caja real del modelo: con esqueleto, la caja de la geometría no sirve (los huesos la reescalan), así que se mide con los huesos y los vértices deformados
function modelBox(o) {
  o.updateMatrixWorld(true);
  const box = new THREE.Box3(), v = new THREE.Vector3();
  let skinned = false;
  o.traverse(m => {
    if (!m.isSkinnedMesh) return; skinned = true;
    const p = m.geometry.attributes.position, step = Math.max(1, Math.floor(p.count / 300));
    for (let i = 0; i < p.count; i += step) { v.fromBufferAttribute(p, i); m.boneTransform(i, v); box.expandByPoint(v.applyMatrix4(m.matrixWorld)); }
  });
  return skinned ? box : box.setFromObject(o);
}
// Pinta los materiales de un clon: fn(nombreMaterial) devuelve un color (o null para dejarlo igual).
// Los materiales pintados se comparten entre clones para no crear cientos de copias.
const RECOLOR_CACHE = new Map();
function recolor(o, fn) {
  o.traverse(m => {
    if (!m.isMesh) return;
    const one = mt => {
      const col = fn(mt.name, mt); if (col == null) return mt;
      const key = mt.uuid + ':' + col;
      if (!RECOLOR_CACHE.has(key)) { const c = mt.clone(); c.color.setHex(col); RECOLOR_CACHE.set(key, c); }
      return RECOLOR_CACHE.get(key);
    };
    m.material = Array.isArray(m.material) ? m.material.map(one) : one(m.material);
  });
  return o;
}
</script>

    if (it.kind === 'ring') { it.obj.rotation.z = Math.sin(g.t * 2 + it.ph) * .03; const on = it.idx === g.nextRing && !it.done; it.obj.visible = !it.done; it.obj.scale.setScalar(on ? 1 + Math.sin(g.t * 6) * .04 : .9); it.obj.children[0].material.emissiveIntensity = on ? .7 : .15; continue; }
    if (it.kind === 'star' && !it.done) { it.obj.rotation.y += dt * 2.5; it.obj.position.y = it.y + Math.sin(g.t * 3 + it.ph) * .15; }
    if (it.kind === 'balloon' && !it.done) { it.obj.position.y = it.y + Math.sin(g.t * 1.6 + it.ph) * .25; it.obj.rotation.z = Math.sin(g.t * 1.2 + it.ph) * .12; }
    if (it.kind === 'car' && it.squashT != null && it.squashT < 1) { it.squashT = Math.min(1, it.squashT + dt * 6); const k = it.squashT; it.obj.scale.set(1 + .15 * k, 1 - .7 * k, 1 + .1 * k); }
    if (it.fly) {
      const f = it.fly, o = it.obj; f.t += dt;
      if (f.t < 3) { f.v.y -= GRAV * dt; it.x += f.v.x * dt; it.z += f.v.z * dt; o.position.set(it.x, Math.max(0, o.position.y + f.v.y * dt), it.z);
        if (o.position.y <= 0 && f.v.y < 0) { f.v.y *= -.3; f.v.x *= .6; f.v.z *= .6; f.spin.multiplyScalar(.5); }
        o.rotation.x += f.spin.x * dt; o.rotation.z += f.spin.z * dt;
        if (f.t > 1.2) { o.rotation.x += (Math.PI / 2 - o.rotation.x % (Math.PI * 2)) * .0; }
        for (const p of g.items) if (p.kind === 'pin' && !p.done && Math.hypot(p.x - it.x, p.z - it.z) < .75 && o.position.y < 1.4) knockPin(p, new THREE.Vector3(f.v.x * .7 + rand(-1.5, 1.5), rand(2, 4), f.v.z * .7 + rand(-1.5, 1.5)));
      } else if (!f.rest) { f.rest = true; o.position.y = .3; o.rotation.set(Math.PI / 2, rand(0, 6.3), 0); }
      if (Math.abs(it.x) > A + 2 || Math.abs(it.z) > A + 2) o.visible = false;
    }
  }
  g.comboT -= dt;
  // Restos que vuelan
  for (let i = g.debris.length - 1; i >= 0; i--) { const d = g.debris[i]; d.life -= dt; d.v.y -= GRAV * dt; d.o.position.addScaledVector(d.v, dt); if (d.o.position.y < .1) { d.o.position.y = .1; d.v.y *= -.35; d.v.x *= .7; d.v.z *= .7; d.spin.multiplyScalar(.6); } d.o.rotation.x += d.spin.x * dt; d.o.rotation.y += d.spin.y * dt; d.o.rotation.z += d.spin.z * dt; if (d.life < .5) d.o.scale.multiplyScalar(Math.pow(.02, dt)); if (d.life <= 0) { world.remove(d.o); g.debris.splice(i, 1); } }
  // Al ganar el camión brinca de gusto
  if (g.phase === 'win' && !t.air && g.t % 1 < .05) { t.air = true; t.vy = 7; t.airT = 0; }
  // Dibujar el camión
  const o = t.obj, ud = o.userData;
  o.position.set(t.x, t.y, t.z); o.rotation.y = t.h;
  const fH = groundH(t.x + Math.sin(t.h) * 1.4, t.z + Math.cos(t.h) * 1.4), bH = groundH(t.x - Math.sin(t.h) * 1.4, t.z - Math.cos(t.h) * 1.4);
  const wantPitch = t.air ? clamp(-t.vy * .045, -.45, .45) : -Math.atan2(fH - bH, 2.8);
  t.pitch += (wantPitch - t.pitch) * (1 - Math.pow(.001, dt));
  t.roll += (-t.steer * Math.min(1, sp / VMAX) * .22 - t.roll) * (1 - Math.pow(.01, dt));
  o.rotation.x = t.pitch - t.flip; o.rotation.z = t.roll; o.rotation.order = 'YXZ';
  t.squash = Math.max(0, t.squash - dt * 3);
  ud.body.position.y = -t.squash * .35 + Math.sin(g.t * 18) * .015 * Math.min(1, sp / 3); ud.body.scale.set(1 + t.squash * .08, 1 - t.squash * .1, 1);
  const fwd = t.vx * Math.sin(t.h) + t.vz * Math.cos(t.h); t.spin += fwd * dt / .78;
  ud.wheels.forEach(w => { w.w.rotation.x = t.spin; w.piv.rotation.y = w.front ? t.steer * .8 : 0; w.piv.position.y = .78 + (t.air ? -.15 : 0); });
  // Polvo de las llantas
  if (!t.air && sp > 6 && Math.random() < dt * 14) burst(t.x - Math.sin(t.h) * 1.6, .15, t.z - Math.cos(t.h) * 1.6, 1, [THEMES[L.theme].dirt, 0xffffff], 1, .4, 1.5);
  if (t.boostT > 0 && Math.random() < dt * 30) burst(t.x - Math.sin(t.h) * 1.9, 1.6, t.z - Math.cos(t.h) * 1.9, 1, [0xff7a1a, 0xffd23a], 1, .35, 1);
  // Flecha hacia lo que falta (si está lejos)
  let best = null, bd = 1e9;
  for (const it of g.items) { if (it.done || (it.kind === 'ring' && it.idx !== g.nextRing)) continue; const d = Math.hypot(it.x - t.x, it.z - t.z); if (d < bd) { bd = d; best = it; } }
  const show = best && bd > 9 && g.phase === 'play';
  g.arrow.visible = g.arrowOut.visible = !!show;
  if (show) { const a = Math.atan2(best.x - t.x, best.z - t.z), r = 3.4 + Math.sin(g.t * 6) * .25; for (const m of [g.arrowOut, g.arrow]) { m.position.set(t.x + Math.sin(a) * r, t.y + .12 + (m === g.arrow ? .02 : 0), t.z + Math.cos(a) * r); m.rotation.y = a + Math.PI; } }
  // Nubes
  g.clouds.forEach(c => { c.position.x += c.userData.v * dt; if (c.position.x > 60) c.position.x = -60; });
  for (const p of g.items) if (p.obj && p.kind === 'ring') {}
  ud.rex.userData.mixer.update(dt);
  updateParts(dt); updateCamera(dt); engineTune(sp, t.air);
}

/* ---------- Menú ---------- */
function buildMenu() {
  const cols = $('#colors'); cols.innerHTML = '';
  COLORS.forEach((c, i) => { const b = document.createElement('button'); b.className = 'px col' + (i === save.color ? ' on' : ''); b.style.background = hex(c); b.setAttribute('aria-label', 'Color del camión ' + (i + 1)); b.addEventListener('click', () => { save.color = i; persist(); sfx.tap(); buildMenu(); }); cols.appendChild(b); });
  const box = $('#levels'); box.innerHTML = '';
  LEVELS.forEach((L, n) => {
    const T = THEMES[L.theme], b = document.createElement('button'); b.className = 'px lv';
    b.setAttribute('aria-label', 'Nivel ' + (n + 1) + ' ' + T.name);
    b.innerHTML = `<img alt="" src="../img/cards/truck-${L.night ? 'noche' : L.theme}.webp"><b>${n + 1}</b><span class="goals">${Object.keys(L.goals).map(k => GOAL_ICON[k]).join('')}</span>` + (save.done[n] ? '<span class="stars"><i></i></span>' : '');
    b.addEventListener('click', () => { sfx.tap(); start(n); });
    box.appendChild(b);
  });
}
function showMenu() {
  music(false); engineOn(false);
  if (world) { scene.remove(world); world = null; }
  game = null; app.hidden = true; $('#win').hidden = true; $('#confetti').hidden = true; $('#hud').hidden = true; $('#hint').hidden = true;
  $('#menu').hidden = false; $('#menuBg').hidden = false; $('#backBtn').hidden = true; $('#title').hidden = false;
  buildMenu();
}
$('#backBtn').addEventListener('click', () => { sfx.tap(); showMenu(); });
$('#menuBtn').addEventListener('click', () => { sfx.tap(); showMenu(); });
$('#againBtn').addEventListener('click', () => { sfx.tap(); start(game.n); });
$('#nextBtn').addEventListener('click', () => { sfx.tap(); start((game.n + 1) % LEVELS.length); });
document.addEventListener('visibilitychange', () => { if (document.hidden) engineTune(0, false); });

let last = performance.now();
(function loop(t) {
  const dt = Math.min(.05, (t - last) / 1000); last = t;
  if (game && !app.hidden) { update(dt); renderer.render(scene, camera); }
  requestAnimationFrame(loop);
})(last);
resize();
showMenu();
// Para pruebas: #nivel3 abre directo ese nivel; #nivel3diag lo maneja solo y manda fotos a un servidor local
{ const m = /^#nivel(\d+)(diag)?$/.exec(location.hash); if (m) (async () => {
  await start(Math.min(LEVELS.length, +m[1]) - 1);
  if (!m[2]) return;
  const errs = []; addEventListener('error', e => errs.push(String(e.message)));
  const post = (tag, info) => { renderer.render(scene, camera); return fetch('http://127.0.0.1:8799/', { method: 'POST', body: JSON.stringify({ tag, img: renderer.domElement.toDataURL('image/png'), info }) }); };
  const run = sec => { for (let i = 0; i < sec * 30; i++) update(1 / 30); };
  run(1); const TG = 'truck' + (game.n + 1); await post(TG + '-start', { n: game.n });
  // Piloto automático: va al objetivo más cercano (o al siguiente aro)
  let maxAir = 0, flips = 0, secs = 0, shots = 0;
  for (; secs < 240 && game.phase === 'play'; secs += .5) {
    const t = game.truck; let best = null, bd = 1e9;
    for (const it of game.items) { if (it.done || (it.kind === 'ring' && it.idx !== game.nextRing)) continue; let x = it.x, z = it.z;
      if (it.kind === 'ring') { if (!it.appr && Math.hypot(it.x - Math.sin(it.rot) * 4 - t.x, it.z - Math.cos(it.rot) * 4 - t.z) < 2.2) it.appr = 1; const k = it.appr ? 5 : -4; x += Math.sin(it.rot) * k; z += Math.cos(it.rot) * k; }
      if (it.air) { const r = game.ramps.reduce((a, q) => Math.hypot(q.x - it.x, q.z - it.z) < Math.hypot(a.x - it.x, a.z - it.z) ? q : a); x = r.x - r.sa * (r.L / 2 + 7); z = r.z - r.ca * (r.L / 2 + 7); it.ramp = r; }
      const d = Math.hypot(x - t.x, z - t.z); if (d < bd) { bd = d; best = { x, z, it }; } }
    // Si ya llegó a la entrada de la rampa, acelera derecho por ella
    if (best && best.it && best.it.air && Math.hypot(best.x - t.x, best.z - t.z) < 1.6) { const r = best.it.ramp; t.h = r.a; t.vx = t.vz = 0; game.auto = { x: r.x + r.sa * 30, z: r.z + r.ca * 30 }; for (let i = 0; i < 75; i++) update(1 / 30); continue; }
    game.auto = best; for (let i = 0; i < 15; i++) { update(1 / 30); if (game.truck.air) maxAir = Math.max(maxAir, game.truck.y); if (game.truck.flipSp) flips++; }
    if (shots < 2 && (secs === 6 || secs === 14)) { shots++; await post(TG + '-play' + shots, { secs }); }
  }
  game.auto = null; run(1); await post(TG + '-end', { errs, phase: game.phase, secs, got: game.got, need: game.need, maxAir, flips: flips > 0 });
  if (/chain/.test(location.search) && game.n + 1 < LEVELS.length) { location.hash = '#nivel' + (game.n + 2) + 'diag'; location.reload(); }
})(); }
window.__truck = { start, update, render: () => renderer.render(scene, camera), get game() { return game; }, camera, scene };
window.LEON_READY = true;

})();
</script>
