<script>
// Pantalla de carga de LEÓN GAMES: dura al menos ~2.6 s; en los juegos 3D espera a que terminen de cargar los modelos
// (la barra muestra el avance real). Tocar la pantalla la salta solo cuando ya no hay nada cargando.
(() => {
  const el = document.getElementById('leonIntro'), bar = el.querySelector('.li-bar i'), t0 = performance.now();
  const MIN = matchMedia('(prefers-reduced-motion: reduce)').matches ? 800 : 2600;
  let gone = false;
  const ready = () => !window.LEON_WAIT || window.LEON_READY;
  const done = () => { if (gone) return; gone = true; bar.style.width = '100%'; setTimeout(() => el.classList.add('out'), 150); setTimeout(() => el.remove(), 700); };
  (function tick() {
    if (gone) return;
    const t = performance.now() - t0, timeP = Math.min(1, t / MIN);
    const p = window.LEON_WAIT ? Math.min(timeP, .1 + .9 * (window.LEON_READY ? 1 : (window.LEON_PROGRESS || 0) * .95)) : timeP;
    bar.style.width = Math.max(6, p * 100) + '%';
    if ((t >= MIN && ready()) || t > 25000) done(); else setTimeout(tick, 100);
  })();
  // El toque que salta la intro no debe llegar a los botones de atrás
  el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (ready()) done(); });
  ['click', 'pointerup', 'touchend'].forEach(ev => el.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); }));
})();
</script>

<script>/* Modelos 3D (glTF) compartidos: se cargan una vez y se clonan; funcionan sin internet porque se guardan con la app */
const MODELS = {};
function loadModels(names, base) {
  const loader = new THREE.GLTFLoader();
  let done = 0; const tick = () => { done++; window.LEON_PROGRESS = done / names.length; };
  return Promise.all(names.map(n => MODELS[n] ? (tick(), Promise.resolve()) : new Promise(res => {
    loader.load(base + n + '.glb', g => { tick();
      // Los juegos usan colores "tal cual" (sin conversión de color), así que las texturas también se leen tal cual,
      // y los materiales pasan a Lambert: luz suave, barata para el iPad y pareja con el resto del mundo
      g.scene.traverse(o => {
        if (!o.isMesh) return;
        o.castShadow = true; o.receiveShadow = true;
        // Pesos del esqueleto en decimales (vienen como enteros 0-255/65535 y Three r128 no los convierte al calcular poses a mano)
        const sw = o.geometry && o.geometry.attributes.skinWeight;
        if (sw && sw.normalized && !(sw.array instanceof Float32Array)) {
          const max = sw.array instanceof Uint8Array ? 255 : 65535, f = new Float32Array(sw.array.length);
          for (let i = 0; i < f.length; i++) f[i] = sw.array[i] / max;
          o.geometry.setAttribute('skinWeight', new THREE.BufferAttribute(f, sw.itemSize));
        }
        // glTF guarda los colores en espacio lineal; los juegos pintan los colores tal cual, así que se regresan a sRGB (si no, salen casi negros)
        // Una textura que no cargó (imagen vacía) haría el objeto negro: mejor sin textura
        const okMap = mt => mt.map && mt.map.image && (mt.map.image.width || mt.map.image.naturalWidth) ? mt.map : null;
        const conv = mt => { const l = new THREE.MeshLambertMaterial({ name: mt.name, color: mt.color.clone().convertLinearToSRGB(), map: okMap(mt), skinning: !!o.isSkinnedMesh, vertexColors: mt.vertexColors }); if (l.map) l.map.encoding = THREE.LinearEncoding; return l; };
        o.material = Array.isArray(o.material) ? o.material.map(conv) : conv(o.material);
      });
      MODELS[n] = g; res();
    }, undefined, () => { tick(); console.warn('modelo no encontrado', n); res(); });
  })));
}
// Clona un modelo (con esqueleto si es animado) y lo escala para que su lado más largo mida `size`
function modelClone(name, size) {
  const src = MODELS[name]; if (!src) return new THREE.Group();
  const o = src.animations.length ? THREE.SkeletonUtils.clone(src.scene) : src.scene.clone(true);
  if (size) { const s = modelBox(o).getSize(new THREE.Vector3()); o.scale.multiplyScalar(size / Math.max(s.x, s.y, s.z)); }
  return o;
}
// Caja real del modelo: con esqueleto, la caja de la geometría no sirve (los huesos la reescalan), así que se mide con los huesos y los vértices deformados
function modelBox(o) {
  o.updateMatrixWorld(true);
  const box = new THREE.Box3(), v = new THREE.Vector3();
  let skinned = false;
  o.traverse(m => {
    if (!m.isSkinnedMesh) return; skinned = true;
    const p = m.geometry.attributes.position, step = Math.max(1, Math.floor(p.count / 300));
    for (let i = 0; i < p.count; i += step) { v.fromBufferAttribute(p, i); m.boneTransform(i, v); box.expandByPoint(v.applyMatrix4(m.matrixWorld)); }
  });
  return skinned ? box : box.setFromObject(o);
}
// Pinta los materiales de un clon: fn(nombreMaterial) devuelve un color (o null para dejarlo igual).
// Los materiales pintados se comparten entre clones para no crear cientos de copias.
const RECOLOR_CACHE = new Map();
function recolor(o, fn) {
  o.traverse(m => {
    if (!m.isMesh) return;

    const px = x - (b.W - 1) / 2, pz = y - (b.H - 1) / 2;
    if (b.g[y][x]) { const m = new THREE.Mesh(RB, M((x + y) % 2 ? P.wall : P.wall2)); m.position.set(px, -.05, pz); m.castShadow = true; m.receiveShadow = true; world.add(m); }
    else { const t = new THREE.Mesh(TILE, M(P.floor)); t.position.set(px, -.04, pz); t.receiveShadow = true; world.add(t); game.tiles[x + ',' + y] = t; }
  }
  // Florecitas y nubes de fondo
  for (let i = 0; i < 8; i++) { const c = bush([0x4fb83a, 0x3f9e30, 0x62c84a]); const a = i / 8 * Math.PI * 2; c.position.set(Math.cos(a) * (b.W * .5 + 3), -1.1, Math.sin(a) * (b.H * .5 + 3)); world.add(c); }
}
const pos3 = (x, y) => new THREE.Vector3(x - (game.b.W - 1) / 2, 0, y - (game.b.H - 1) / 2);

/* ---------- Empezar ---------- */
let loadingLvl = false;
async function start(n) {
  if (loadingLvl) return;
  if (!MODELS.trex) { loadingLvl = true; const ov = $('#lvlLoad'); ov.hidden = false; await loadModels(levelModels(), '../models/'); ov.hidden = true; loadingLvl = false; }
  startNow(n);
}
function startNow(n) {
  const L = LEVELS[n], b = makeBoard(L);
  game = { n, L, b, t: 0, phase: 'play', x: b.sx, y: b.sy, painted: new Set(), anim: null, queue: [], combo: 0, idle: 0 };
  buildWorld(L, n);
  const d = makeAnimal('trex', PALS[LEVELS[n].world % PALS.length].dino); fit(d.userData.model, 1.35, 1.25); d.userData.model.scale.x *= 1.6; d.userData.model.scale.y *= 1.35; world.add(d); play(d, 'idle'); game.dino = d;
  d.position.copy(pos3(b.sx, b.sy)); d.rotation.y = Math.PI;
  paintTile(b.sx, b.sy, true);
  paintHud();
  $('#lvl').textContent = 'NIVEL ' + (n + 1);
  $('#menu').hidden = true; $('#menuBg').hidden = true; $('#title').hidden = true; $('#win').hidden = true;
  app.hidden = false; $('#hud').hidden = false; $('#backBtn').hidden = false; $('#hint').hidden = false; $('#resetBtn').hidden = false;
  resize(); music(true, SONG, BASS, 250); framing();
}
function paintHud() { const g = game, p = Math.round(g.painted.size / g.b.floor * 100); $('#goal').innerHTML = `<span class="prog"><i style="width:${p}%;background:${'#' + new THREE.Color(PALS[LEVELS[g.n].world % PALS.length].paint).getHexString()}"></i></span><span class="pc">${p}%</span>`; }
function paintTile(x, y, quiet) {
  const g = game, k = x + ',' + y; if (g.painted.has(k)) return false;
  g.painted.add(k); const t = g.tiles[k]; t.material = M(PALS[LEVELS[g.n].world % PALS.length].paint); t.userData.pop = 0;
  return true;
}
function framing() {
  const g = game, b = g.b, aspect = innerWidth / innerHeight, vFov = camera.fov * Math.PI / 180, hFov = 2 * Math.atan(Math.tan(vFov / 2) * aspect);
  const dist = Math.max((b.W / 2 + 1.2) / Math.tan(hFov / 2), (b.H / 2 + 2.2) / Math.tan(vFov / 2) * .95);
  camera.position.set(0, dist * .8, dist * .62 + .5); camera.lookAt(0, 0, .5);
}
addEventListener('resize', () => { if (game) framing(); });

/* ---------- Deslizar ---------- */
let sw = null;
app.addEventListener('pointerdown', e => { sw = { x: e.clientX, y: e.clientY, used: false }; });
app.addEventListener('pointermove', e => { if (!sw || sw.used) return; const dx = e.clientX - sw.x, dy = e.clientY - sw.y; if (Math.hypot(dx, dy) > 28) { sw.used = true; push(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 0 : 1) : (dy > 0 ? 2 : 3)); } });
['pointerup', 'pointercancel'].forEach(ev => app.addEventListener(ev, () => { sw = null; }));
addEventListener('keydown', e => { const m = { ArrowRight: 0, ArrowLeft: 1, ArrowDown: 2, ArrowUp: 3 }[e.key]; if (m != null && game) push(m); });
function push(di) { const g = game; if (!g || g.phase !== 'play') return; if (g.anim) { if (g.queue.length < 1) g.queue.push(di); return; } go(di); }
function go(di) {
  const g = game, r = slide(g.b.g, g.x, g.y, DIRS[di]); g.idle = 0;
  g.dino.rotation.y = Math.atan2(DIRS[di][0], DIRS[di][1]);
  if (!r.path.length) { psfx.bump(); g.anim = { bump: 0, di }; return; }
  psfx.slide(r.path.length); play(g.dino, 'run', .05);
  g.anim = { from: pos3(g.x, g.y), path: r.path, i: 0, t: 0, di, k: 0 }; g.x = r.x; g.y = r.y;
}
function update(dt) {
  const g = game; g.t += dt; g.idle += dt;
  const a = g.anim, d = g.dino;
  if (a && a.bump != null) { a.bump += dt; const s = Math.sin(Math.min(1, a.bump / .25) * Math.PI) * .15; d.position.copy(pos3(g.x, g.y)).add(new THREE.Vector3(DIRS[a.di][0] * s, 0, DIRS[a.di][1] * s)); if (a.bump >= .25) g.anim = null; }
  else if (a) {
    a.t += dt * 15; // casillas por segundo
    while (a.t >= 1 && a.i < a.path.length) { a.t -= 1; const [x, y] = a.path[a.i]; if (paintTile(x, y)) { psfx.paint(a.k++); const p = pos3(x, y); burst(p.x, .2, p.z, 3, [PALS[LEVELS[g.n].world % PALS.length].paint, 0xffffff], 2, .18, 2.5); } a.from = pos3(x, y); a.i++; }
    if (a.i >= a.path.length) { d.position.copy(pos3(g.x, g.y)); g.anim = null; play(d, 'idle', .1); d.userData.squash = 1; paintHud(); checkWin(); }
    else { const [x, y] = a.path[a.i]; d.position.copy(a.from).lerp(pos3(x, y), a.t); }
  }
  if (!g.anim && g.queue.length && g.phase === 'play') go(g.queue.shift());
  // Rebotito al chocar
  const sq = d.userData.squash || 0; d.userData.squash = Math.max(0, sq - dt * 4); d.scale.set(1 + sq * .15, 1 - sq * .18, 1 + sq * .15);
  if (g.phase === 'win') d.position.y = Math.abs(Math.sin(g.t * 6)) * .5;
  for (const k in g.tiles) { const t = g.tiles[k]; if (t.userData.pop != null && t.userData.pop < 1) { t.userData.pop = Math.min(1, t.userData.pop + dt * 5); const s = 1 + Math.sin(t.userData.pop * Math.PI) * .25; t.scale.set(s, 1 + Math.sin(t.userData.pop * Math.PI) * 2, s); } }
  d.userData.mixer.update(dt); updateParts(dt);
}
function checkWin() {
  const g = game; if (g.painted.size < g.b.floor) return;
  g.phase = 'win'; save.done[g.n] = true; persist(); sfx.win(); confetti(); banner('¡TODO PINTADO!'); play(g.dino, 'jump');
  for (const k in g.tiles) { const [x, y] = k.split(',').map(Number), p = pos3(x, y); setTimeout(() => burst(p.x, .3, p.z, 2, [0xffd23a, 0xff5d8f, 0x5ac8ff, 0x8fe04a], 3, .2, 4), rand(0, 600)); }
  setTimeout(() => { if (game === g) $('#win').hidden = false; }, 1500);
}

/* ---------- Menú ---------- */
const WORLD_NAMES = ['Mundo Verde', 'Mundo Azul', 'Mundo Morado', 'Mundo Rosa', 'Mundo Naranja'];
function buildMenu() {
  const box = $('#levels'); box.innerHTML = '';
  // Abre donde va: el primer nivel sin terminar (palpita)
  let next = LEVELS.findIndex((_, n) => !save.done[n]); if (next < 0) next = 0;
  LEVELS.forEach((L, n) => {
    if (n % PER === 0) { const h = document.createElement('div'); h.className = 'world'; const got = LEVELS.slice(n, n + PER).filter((_, j) => save.done[n + j]).length; h.innerHTML = `<span>${WORLD_NAMES[L.world]}</span><i>${got}/${PER} ⭐</i>`; box.appendChild(h); }
    const b = document.createElement('button'); b.className = 'px lv' + (n === next ? ' next' : ''); b.setAttribute('aria-label', 'Nivel ' + (n + 1));
    b.innerHTML = `<img alt="" src="../img/cards/pinta-${L.world % 4 + 1}.webp"><b>${n + 1}</b>` + (save.done[n] ? '<span class="stars"><i></i></span>' : '');
    b.addEventListener('click', () => { sfx.tap(); start(n); }); box.appendChild(b);
    if (n === next) setTimeout(() => b.scrollIntoView({ block: 'center' }), 0);
  });
}
function showMenu() {
  music(false); if (world) { scene.remove(world); world = null; }
  game = null; app.hidden = true; $('#win').hidden = true; $('#confetti').hidden = true; $('#hud').hidden = true; $('#hint').hidden = true; $('#resetBtn').hidden = true;
  $('#menu').hidden = false; $('#menuBg').hidden = false; $('#backBtn').hidden = true; $('#title').hidden = false;
  buildMenu();
}
$('#backBtn').addEventListener('click', () => { sfx.tap(); showMenu(); });
$('#menuBtn').addEventListener('click', () => { sfx.tap(); showMenu(); });
$('#againBtn').addEventListener('click', () => { sfx.tap(); start(game.n); });
$('#nextBtn').addEventListener('click', () => { sfx.tap(); start((game.n + 1) % LEVELS.length); });
$('#resetBtn').addEventListener('click', () => { sfx.tap(); if (game) startNow(game.n); });
let last = performance.now();
(function loop(t) { const dt = Math.min(.05, (t - last) / 1000); last = t; if (game && !app.hidden) { update(dt); renderer.render(scene, camera); } requestAnimationFrame(loop); })(last);
resize(); showMenu();
window.__pinta = { start, update, push, makeBoard, LEVELS, render: () => renderer.render(scene, camera), get game() { return game; } };
window.LEON_READY = true;

})();
</script>
