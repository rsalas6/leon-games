<script>
// Pantalla de carga de LEÓN GAMES: dura al menos ~2.6 s; en los juegos 3D espera a que terminen de cargar los modelos
// (la barra muestra el avance real). Tocar la pantalla la salta solo cuando ya no hay nada cargando.
(() => {
  const el = document.getElementById('leonIntro'), bar = el.querySelector('.li-bar i'), t0 = performance.now();
  const MIN = matchMedia('(prefers-reduced-motion: reduce)').matches ? 800 : 2600;
  let gone = false;
  const ready = () => !window.LEON_WAIT || window.LEON_READY;
  const done = () => { if (gone) return; gone = true; bar.style.width = '100%'; setTimeout(() => el.classList.add('out'), 150); setTimeout(() => el.remove(), 700); };
  (function tick() {
    if (gone) return;
    const t = performance.now() - t0, timeP = Math.min(1, t / MIN);
    const p = window.LEON_WAIT ? Math.min(timeP, .1 + .9 * (window.LEON_READY ? 1 : (window.LEON_PROGRESS || 0) * .95)) : timeP;
    bar.style.width = Math.max(6, p * 100) + '%';
    if ((t >= MIN && ready()) || t > 25000) done(); else setTimeout(tick, 100);
  })();
  // El toque que salta la intro no debe llegar a los botones de atrás
  el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (ready()) done(); });
  ['click', 'pointerup', 'touchend'].forEach(ev => el.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); }));
})();
</script>

<script>/* Modelos 3D (glTF) compartidos: se cargan una vez y se clonan; funcionan sin internet porque se guardan con la app */
const MODELS = {};
function loadModels(names, base) {
  const loader = new THREE.GLTFLoader();
  let done = 0; const tick = () => { done++; window.LEON_PROGRESS = done / names.length; };
  return Promise.all(names.map(n => MODELS[n] ? (tick(), Promise.resolve()) : new Promise(res => {
    loader.load(base + n + '.glb', g => { tick();
      // Los juegos usan colores "tal cual" (sin conversión de color), así que las texturas también se leen tal cual,
      // y los materiales pasan a Lambert: luz suave, barata para el iPad y pareja con el resto del mundo
      g.scene.traverse(o => {
        if (!o.isMesh) return;
        o.castShadow = true; o.receiveShadow = true;
        // Pesos del esqueleto en decimales (vienen como enteros 0-255/65535 y Three r128 no los convierte al calcular poses a mano)
        const sw = o.geometry && o.geometry.attributes.skinWeight;
        if (sw && sw.normalized && !(sw.array instanceof Float32Array)) {
          const max = sw.array instanceof Uint8Array ? 255 : 65535, f = new Float32Array(sw.array.length);
          for (let i = 0; i < f.length; i++) f[i] = sw.array[i] / max;
          o.geometry.setAttribute('skinWeight', new THREE.BufferAttribute(f, sw.itemSize));
        }
        const conv = mt => { const l = new THREE.MeshLambertMaterial({ name: mt.name, color: mt.color.clone(), map: mt.map || null, skinning: !!o.isSkinnedMesh, vertexColors: mt.vertexColors }); if (l.map) l.map.encoding = THREE.LinearEncoding; return l; };
        o.material = Array.isArray(o.material) ? o.material.map(conv) : conv(o.material);
      });
      MODELS[n] = g; res();
    }, undefined, () => { tick(); console.warn('modelo no encontrado', n); res(); });
  })));
}
// Clona un modelo (con esqueleto si es animado) y lo escala para que su lado más largo mida `size`
function modelClone(name, size) {
  const src = MODELS[name]; if (!src) return new THREE.Group();
  const o = src.animations.length ? THREE.SkeletonUtils.clone(src.scene) : src.scene.clone(true);
  if (size) { const s = modelBox(o).getSize(new THREE.Vector3()); o.scale.multiplyScalar(size / Math.max(s.x, s.y, s.z)); }
  return o;
}
// Caja real del modelo: con esqueleto, la caja de la geometría no sirve (los huesos la reescalan), así que se mide con los huesos y los vértices deformados
function modelBox(o) {
  o.updateMatrixWorld(true);
  const box = new THREE.Box3(), v = new THREE.Vector3();
  let skinned = false;
  o.traverse(m => {
    if (!m.isSkinnedMesh) return; skinned = true;
    const p = m.geometry.attributes.position, step = Math.max(1, Math.floor(p.count / 300));
    for (let i = 0; i < p.count; i += step) { v.fromBufferAttribute(p, i); m.boneTransform(i, v); box.expandByPoint(v.applyMatrix4(m.matrixWorld)); }
  });
  return skinned ? box : box.setFromObject(o);
}
// Pinta los materiales de un clon: fn(nombreMaterial) devuelve un color (o null para dejarlo igual).
// Los materiales pintados se comparten entre clones para no crear cientos de copias.
const RECOLOR_CACHE = new Map();
function recolor(o, fn) {
  o.traverse(m => {
    if (!m.isMesh) return;
    const one = mt => {
      const col = fn(mt.name, mt); if (col == null) return mt;
      const key = mt.uuid + ':' + col;
      if (!RECOLOR_CACHE.has(key)) { const c = mt.clone(); c.color.setHex(col); RECOLOR_CACHE.set(key, c); }
      return RECOLOR_CACHE.get(key);
    };
    m.material = Array.isArray(m.material) ? m.material.map(one) : one(m.material);
  });
  return o;
}
</script>
<script>
/* Kit compartido de dinosaurios: materiales caricatura, contornos y los 8 modelos (mirando hacia -Z) */
/* ---------- Ayudas de geometría ---------- */
// Sombreado tipo caricatura: 3 tonos de luz
const GRAD = (() => {
  const t = new THREE.DataTexture(new Uint8Array([120, 120, 120, 255, 190, 190, 190, 255, 255, 255, 255, 255]), 3, 1, THREE.RGBAFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter; t.generateMipmaps = false; t.needsUpdate = true; return t;
})();
const matCache = {};
const M = (c, opts) => {
  const k = c + (opts ? JSON.stringify(opts) : '');
  return matCache[k] || (matCache[k] = new THREE.MeshLambertMaterial(Object.assign({ color: c }, opts || {})));
};
const SPH = new THREE.SphereGeometry(1, 16, 12);
function ell(rx, ry, rz, m) { const o = new THREE.Mesh(SPH, m); o.scale.set(rx, ry, rz); o.castShadow = true; return o; }
function cyl(rt, rb, h, m, seg = 10) { const o = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m); o.castShadow = true; return o; }
function cone(r, h, m, seg = 10) { const o = new THREE.Mesh(new THREE.ConeGeometry(r, h, seg), m); o.castShadow = true; return o; }
function box(w, h, d, m) { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.castShadow = true; o.receiveShadow = true; return o; }
function shade(hex, l) { const c = new THREE.Color(hex); c.offsetHSL(0, 0, l); return c.getHex(); }
const SHINE = new THREE.MeshBasicMaterial({ color: 0xffffff });
function eyes(g, x, y, z, r) {
  for (const s of [-1, 1]) {
    const w = ell(r, r, r, M(0xffffff)); w.position.set(s * x, y, z); g.add(w);
    const p = ell(r * .55, r * .6, r * .55, M(0x1a1420)); p.position.set(s * (x + r * .5), y + r * .05, z - r * .35); p.userData.noOutline = true; g.add(p);

    const a = rand(0, 6.3), d = rand(L.R * .5, L.R * .85), x = c + Math.cos(a) * d, z = c + Math.sin(a) * d;
    if (!ok(x, z, SIZE(L.boss) * .5 + 1)) continue;
    out.push({ i: L.boss, x, z, ry: rand(0, 6.3) }); centers.push({ x, z, r: SIZE(L.boss) * .6 + 3 }); break;
  }
  const recipes = TOWNS[L.theme].filter(r => r[2]().every(p => p.i < L.boss)).map(r => ({ r: r[0], max: Math.ceil(r[1] * (L.R / 40) ** 2), make: r[2], used: 0 }));
  for (let tries = 0; tries < 600 && out.length < L.total; tries++) {
    const opts = recipes.filter(r => r.used < r.max); if (!opts.length) break;
    const rc = opts[Math.random() * opts.length | 0];
    const x = rand(0, W), z = rand(0, W);
    if (!inside(L, x, z, rc.r * .7) || centers.some(q => Math.hypot(q.x - x, q.z - z) < (q.r + rc.r) * .85)) continue;
    rc.used++; centers.push({ x, z, r: rc.r });
    const rot = rand(0, 6.3), cs = Math.cos(rot), sn = Math.sin(rot);
    rc.make().forEach(p => out.push({ i: p.i, x: x + p.x * cs - p.z * sn, z: z + p.x * sn + p.z * cs, ry: p.ry - rot }));
  }
  // Que haya de todos los tamaños para poder ir creciendo
  for (let i = 0; i < L.boss; i++) {
    let have = out.filter(p => p.i === i).length;
    for (let t = 0; have < 4 && t < 80; t++) { const x = rand(0, W), z = rand(0, W); if (ok(x, z, SIZE(i) * .5)) { out.push({ i, x, z, ry: rand(0, 6.3) }); have++; } }
  }
  return out.filter(p => ok(p.x, p.z, SIZE(p.i) * .5));
}
function placeItems(L, layout) {
  const items = [], cell = 6, grid = new Map();
  const near = (x, z) => { const o = []; const gx = Math.floor(x / cell), gz = Math.floor(z / cell); for (let a = -3; a <= 3; a++) for (let b = -3; b <= 3; b++) { const l = grid.get((gx + a) + ',' + (gz + b)); if (l) o.push(...l); } return o; };
  for (const p of layout) {
    const r = SIZE(p.i) * .5;
    if (near(p.x, p.z).some(o => Math.hypot(o.x - p.x, o.z - p.z) < (o.r + r) * .8)) continue;
    const it = newItem(L.theme, p.i, p.x, p.z, p.ry); if (!it) continue;
    const k = Math.floor(it.x / cell) + ',' + Math.floor(it.z / cell); (grid.get(k) || grid.set(k, []).get(k)).push(it); items.push(it);
  }
  return items;
}
let soloDinos = 0;
function newItem(theme, i, x, z, ry = rand(0, Math.PI * 2)) {
  const pr = proto(theme, i);
  // Hasta 12 dinos por nivel caminan con patitas animadas; el jefe y los objetos con humo también van aparte
  const solo = pr.tick || game.L.boss === i || (pr.dino && soloDinos < 12);
  let obj, anim = null, slot = -1;
  if (solo) { obj = makeItem(theme, i); anim = obj.children[0].userData.anim; scene.add(obj); if (pr.dino) soloDinos++; }
  else { obj = new THREE.Object3D(); slot = poolAdd(i, obj); if (slot < 0) return null; }
  obj.rotation.y = ry;
  obj.position.set(x, 0, z);
  const it = { i, x, z, r: SIZE(i) * .5, obj, anim, solo, slot, fall: 0, vy: 0, shake: 0, seed: Math.random() * 6, head: obj.rotation.y, walk: pr.dino ? rand(.25, .55) : 0 };
  if (!solo) poolSync(it);
  return it;
}

function start(n) {
  clearWorld();
  const L = LEVELS[n], T = THEMES[L.theme];
  worldU.value = L.world; altU.value.setHex(T.ground[1]); groundMat.color.setHex(T.ground[0]);
  ground.scale.set(L.world + 400, L.world + 400, 1); ground.position.set(L.world / 2, 0, L.world / 2);
  scene.background = new THREE.Color(T.sky); scene.fog = new THREE.Fog(T.sky, 110, 380);
  hemi.groundColor.setHex(T.ground[1]); outU.value.setHex(T.out); waveU.value = T.wave;
  game = { n, L, items: [], hx: L.world / 2, hz: L.world / 2, r: R0, show: R0, falling: [], over: false, t: 0, eaten: 0, look: new THREE.Vector2(), blink: 2, ponds: [] };
  shapeA.value.set(L.R, L.h[0], L.h[1], L.h[2]); shapeB.value.set(L.h[3], L.h[4], L.h[5]); pondColU.value.setHex(T.pond);
  // 2 o 3 charcos (agua, hielo o lava según el mundo) que no estén en el centro
  for (let k = 0, tries = 0; k < 3 && tries < 200; tries++) {
    const a = rand(0, 6.3), d = rand(L.R * .3, L.R * .75), x = L.world / 2 + Math.cos(a) * d, z = L.world / 2 + Math.sin(a) * d, r = rand(3, L.R * .12);
    if (!inside(L, x, z, r + 3) || game.ponds.some(p => Math.hypot(p.x - x, p.z - z) < p.r + r + 6)) continue;
    game.ponds.push({ x, z, r }); k++;
  }
  pondsU.value.forEach((v, k) => { const p = game.ponds[k]; v.set(p ? p.x : -999, p ? p.z : -999, p ? p.r : 0); });
  buildScenery(L);
  soloDinos = 0;
  const layout = generateLayout(L), counts = [];
  layout.forEach(p => (counts[p.i] = (counts[p.i] || 0) + 1));
  makePools(L, counts);
  game.items = placeItems(L, layout);
  game.boss = game.items.find(it => it.i === L.boss);
  $('#bossIcon').src = thumb(L.theme, L.boss);
  $('#lvl').textContent = 'NIVEL ' + (n + 1); $('#score').textContent = '0';
  $('#menu').hidden = true; $('#menuBg').hidden = true; $('#title').hidden = true; $('#win').hidden = true;
  app.hidden = false; $('#hud').hidden = false; $('#backBtn').hidden = false;
  resize(); camPos = null; updateMeter();
}

/* Control tipo joystick: donde se pone el dedo queda el centro; arrastrar desde ahí mueve la rana en esa dirección */
let joy = null;
const keys = {}, joyEl = $('#joy'), knob = joyEl.querySelector('i'), JOY_R = 60;
app.addEventListener('pointerdown', e => {
  if (joy) return;
  joy = { id: e.pointerId, ox: e.clientX, oy: e.clientY, dx: 0, dy: 0 };
  joyEl.hidden = false; joyEl.style.transform = `translate(${e.clientX}px,${e.clientY}px)`; knob.style.transform = '';
  try { app.setPointerCapture(e.pointerId); } catch (err) {}
});
app.addEventListener('pointermove', e => {
  if (!joy || joy.id !== e.pointerId) return;
  let dx = e.clientX - joy.ox, dy = e.clientY - joy.oy; const l = Math.hypot(dx, dy);
  if (l > JOY_R) { dx *= JOY_R / l; dy *= JOY_R / l; }
  joy.dx = dx; joy.dy = dy; knob.style.transform = `translate(${dx}px,${dy}px)`;
});
['pointerup', 'pointercancel'].forEach(ev => app.addEventListener(ev, e => { if (joy && joy.id === e.pointerId) { joy = null; joyEl.hidden = true; } }));
addEventListener('keydown', e => (keys[e.key] = true));
addEventListener('keyup', e => (keys[e.key] = false));

// Puntos: más grande = más puntos; si come varias cosas seguidas hace combo
const PTS = i => Math.round(5 * Math.pow(1.5, i));
const PCOL = ['#ffd23a', '#ff5d8f', '#5ac8ff', '#8fe04a', '#ffffff', '#ff9a2e'];
function addPoints(it) {
  const g = game;
  g.combo = g.t - (g.lastEatT || -9) < .7 ? (g.combo || 1) + 1 : 1; g.lastEatT = g.t;
  const pts = PTS(it.i) * Math.min(g.combo, 5);
  g.score = (g.score || 0) + pts;
  const sc = $('#score'); sc.textContent = g.score; sc.classList.remove('bump'); void sc.offsetWidth; sc.classList.add('bump');
  if (document.querySelectorAll('.pts').length > 10) return;
  proj.set(g.hx + rand(-g.r * .5, g.r * .5), g.r * .6, g.hz - g.r * .3).project(camera);
  const el = document.createElement('div'); el.className = 'pts' + (g.combo > 2 ? ' combo' : '');
  el.textContent = '+' + pts + (g.combo > 1 ? ' x' + Math.min(g.combo, 5) : '');
  el.style.color = PCOL[(g.eaten + it.i) % PCOL.length];
  el.style.transform = `translate(${(proj.x + 1) / 2 * innerWidth}px,${(1 - proj.y) / 2 * innerHeight}px) translate(-50%,-50%)`;
  document.body.appendChild(el); setTimeout(() => el.remove(), 1000);
}
// Chispitas 3D que saltan de la boca al comer
const SPARK_GEO = new THREE.OctahedronGeometry(.18, 0), sparks = [];
for (let k = 0; k < 40; k++) { const m = new THREE.Mesh(SPARK_GEO, M([0xffd23a, 0xff5d8f, 0x5ac8ff, 0x8fe04a][k % 4])); m.visible = false; scene.add(m); sparks.push({ m, life: 0, v: new THREE.Vector3() }); }
let sparkI = 0;
function burst(n, size) {
  const g = game;
  for (let k = 0; k < n; k++) {
    const p = sparks[sparkI++ % sparks.length], a = rand(0, 6.3), sp = rand(3, 7) * (.6 + size * .1);
    p.m.position.set(g.hx + Math.cos(a) * g.r * .8, .3, g.hz + Math.sin(a) * g.r * .8);
    p.v.set(Math.cos(a) * sp * .4, rand(5, 9) * (.7 + size * .06), Math.sin(a) * sp * .4);
    p.m.scale.setScalar(.8 + size * .12); p.life = 1; p.m.visible = true;
  }
}
function updateSparks(dt) {
  for (const p of sparks) {
    if (p.life <= 0) continue;
    p.life -= dt * 1.4; p.v.y -= 20 * dt; p.m.position.addScaledVector(p.v, dt);
    p.m.rotation.x += dt * 8; p.m.rotation.y += dt * 6;
    if (p.life <= 0 || p.m.position.y < -1) { p.life = 0; p.m.visible = false; }
  }
}

function grow(it) {
  const g = game, before = sizesFit(g.r);
  g.r = Math.min(Math.sqrt(g.r * g.r + GROW * (g.L.boss >= 15 ? 1.7 : 1) * it.r * it.r) + .004, 30);
  if (sizesFit(g.r) > before) sfx.grow();
}
function sizesFit(r) { let n = 0; while (n < 17 && fits(SIZE(n) * .5, r)) n++; return n; }

function step(dt) {
  const g = game; if (!g) return;
  g.t += dt;
  // Movimiento (pantalla: derecha = +x, arriba = -z porque la cámara mira hacia -z)
  let mx = 0, mz = 0;
  if (joy) { const l = Math.hypot(joy.dx, joy.dy); if (l > 6) { const f = Math.min(1, l / JOY_R); mx = joy.dx / l * f; mz = joy.dy / l * f; } }
  if (keys.ArrowLeft) mx = -1; if (keys.ArrowRight) mx = 1; if (keys.ArrowUp) mz = -1; if (keys.ArrowDown) mz = 1;
  const mag = Math.min(1, Math.hypot(mx, mz)), speed = 7 + g.r * 1.6;
  if (mag > .05 && !g.over) { g.hx += mx * speed * dt; g.hz += mz * speed * dt; g.look.set(mx / mag, mz / mag); }
  else g.look.multiplyScalar(.9);
  // La rana no sale de la isla
  const W = g.L.world, c0 = W / 2, ha = Math.atan2(g.hz - c0, g.hx - c0), hmax = shapeR(g.L, ha) - g.r * .5, hd = Math.hypot(g.hx - c0, g.hz - c0);
  if (hd > hmax) { g.hx = c0 + Math.cos(ha) * hmax; g.hz = c0 + Math.sin(ha) * hmax; }
  g.show += (g.r - g.show) * Math.min(1, dt * 5);

  for (const it of g.items) {
    if (it.fall) continue;
    // Los dinos caminan despacito por el mundo
    if (it.walk) {
      it.head += rand(-.6, .6) * dt;
      const sp = it.walk * dt * Math.min(2.2, 1 + it.i * .08);
      it.x -= Math.sin(it.head) * sp; it.z -= Math.cos(it.head) * sp;
      if (!inside(g.L, it.x, it.z, it.r) || inPond(g, it.x, it.z, it.r)) { it.x += Math.sin(it.head) * sp * 2; it.z += Math.cos(it.head) * sp * 2; it.head += Math.PI * rand(.7, 1.3); }
      it.obj.rotation.y = it.head;
      if (it.anim) it.anim(g.t * 6 + it.seed, 3); else it.obj.position.y = Math.abs(Math.sin(g.t * 6 + it.seed)) * it.r * .15;
    }
    const dist = Math.hypot(it.x - g.hx, it.z - g.hz);
    if (fits(it.r, g.r)) {
      if (dist < g.r - it.r * .35) { g.chomp = 1; it.fall = 1e-6; it.vy = 0; it.tilt = new THREE.Vector2(it.x - g.hx, it.z - g.hz).normalize(); g.falling.push(it); sfx.gulp(it.i); }
      else if (dist < g.r + it.r * 1.3) { const k = Math.min(1, dt * 1.6); it.x += (g.hx - it.x) * k * .5; it.z += (g.hz - it.z) * k * .5; }
    } else if (dist < g.r + it.r * .25) {
      if (it.shake <= 0) { it.shake = .35; if (g.t - (it.lastBump || -9) > .8) { it.lastBump = g.t; sfx.bump(); } }
    }
    if (it.shake > 0) { it.shake -= dt; it.obj.rotation.z = Math.sin(g.t * 50) * .06; } else it.obj.rotation.z = 0;
    it.obj.position.x = it.x; it.obj.position.z = it.z; if (!it.walk || it.anim) it.obj.position.y = 0;
    if (it.solo) { const tick = it.obj.children[0].userData.tick; if (tick) tick(g.t); } else if (it.walk || it.shake > -1) poolSync(it);
  }
  // Caída: se desliza al centro, se inclina y se hunde en la oscuridad
  for (const it of g.falling) {
    it.fall += dt; it.vy += 18 * dt;
    const k = Math.min(1, dt * 3);
    it.x += (g.hx - it.x) * k * .6; it.z += (g.hz - it.z) * k * .6;
    const y = it.obj.position.y - it.vy * dt;
    it.obj.position.set(it.x, y, it.z);
    it.obj.rotation.x += it.tilt.y * dt * 2.2; it.obj.rotation.z -= it.tilt.x * dt * 2.2;
    if (!it.solo) poolSync(it);
    if (y < -(SIZE(it.i) * 1.2 + 2) && !it.gone) {
      it.gone = true; if (it.solo) scene.remove(it.obj); else poolSync(it); g.eaten++; grow(it); addPoints(it); burst(Math.min(10, 3 + (it.i >> 1)), it.i); updateMeter();
      if (it === g.boss) winLevel();
    }
  }
  g.falling = g.falling.filter(it => !it.gone);
  g.items = g.items.filter(it => !it.gone);
  if (!g.over && !fits(g.boss.r, g.r) && g.items.filter(it => !it.fall && fits(it.r, g.r)).length < 4) refill();

  updateScenery(g.t); updateSparks(dt);
  // Hoyo y ojitos
  hole.position.set(g.hx, 0, g.hz);
  const R = g.show, depth = 3 + R * 3;
  wall.scale.set(R, depth, R); wall.position.y = -depth / 2; floor.scale.setScalar(R); floor.position.y = -depth + .01;
  rim.scale.set(R, Math.max(1, R * .9), R);
  holeU.value.set(g.hx, g.hz, R);
  pupils.forEach(p => { p.position.x = g.look.x * .07; p.position.y = -g.look.y * .05; });
  g.blink -= dt; if (g.blink < 0) g.blink = rand(2, 5);
  g.chomp = Math.max(0, (g.chomp || 0) - dt * 3);
  const bl = g.blink < .12 || g.chomp > .4 ? .25 : 1;   // parpadea, y entrecierra los ojos de gusto al comer
  balls.forEach(b => (b.scale.y = bl));
  rim.scale.x = rim.scale.z = R * (1 + Math.sin(g.chomp * Math.PI) * .1);
  // De vez en cuando saca la lengua
  g.lick = (g.lick || 4) - dt; if (g.lick < -.6) g.lick = rand(3, 6);
  const lk = g.lick < 0 ? Math.sin(-g.lick / .6 * Math.PI) : 0;
  tongue.position.z = .3 + lk * 1.1; tongue.scale.z = .55 * (1 + lk);
  eyeRig.position.y = Math.abs(Math.sin(g.t * 8)) * .05 * (g.look.length() > .3 ? 1 : 0);
  updateCamera(dt);
}
function refill() {
  const g = game; let top = 0; while (top < g.L.boss && fits(SIZE(top + 1) * .5, g.r)) top++;
  for (let k = 0; k < 30 && g.items.length < 2000; k++) {
    const i = Math.max(0, top - (k % 3)), a = Math.random() * Math.PI * 2, dist = rand(g.r * 3, g.r * 7);
    const x = g.hx + Math.cos(a) * dist, z = g.hz + Math.sin(a) * dist;
    if (!inside(g.L, x, z, SIZE(i) * .5 + 1) || inPond(g, x, z, 1)) continue;
    const it = newItem(g.L.theme, i, x, z); if (it) g.items.push(it);
  }
}
function updateMeter() {
  const g = game, need = g.boss.r / .92, p = Math.min(1, (g.r - R0) / (need - R0));
  $('#meterBar i').style.width = Math.max(0, p * 100) + '%';
}

// Cámara inclinada (como hole.io) que se aleja conforme crece el hoyo
let camPos = null;
const camLook = new THREE.Vector3(), camWant = new THREE.Vector3(), proj = new THREE.Vector3();
function updateCamera(dt) {
  const g = game, port = innerHeight > innerWidth;
  const dist = (port ? 19 : 15) + g.show * 6.5;
  camWant.set(g.hx, dist * .78, g.hz + dist * .62);
  if (!camPos) camPos = camWant.clone();
  camPos.lerp(camWant, Math.min(1, dt * 4));
  camera.position.copy(camPos);
  camLook.set(camPos.x, 0, camPos.z - dist * .62 - 1.5);
  camera.lookAt(camLook);
  const s = dist * .9;
  Object.assign(sun.shadow.camera, { left: -s, right: s, top: s, bottom: -s, near: 1, far: dist * 3 }); sun.shadow.camera.updateProjectionMatrix();
  sun.position.set(g.hx - 10, 30 + dist, g.hz + 12); sun.target.position.set(g.hx, 0, g.hz - 4);
  // Flecha hacia el jefe cuando ya cabe y no se ve
  const b = g.boss;
  if (b && !b.fall && fits(b.r, g.r) && !g.over) {
    proj.set(b.x, 0, b.z).project(camera);
    const sx = (proj.x + 1) / 2 * innerWidth, sy = (1 - proj.y) / 2 * innerHeight, m = 70;
    if (proj.z > 1 || sx < 0 || sx > innerWidth || sy < 0 || sy > innerHeight) {
      const a = Math.atan2(b.z - g.hz, b.x - g.hx);
      const ex = Math.max(m, Math.min(innerWidth - m, innerWidth / 2 + Math.cos(a) * innerWidth)), ey = Math.max(m + 80, Math.min(innerHeight - m, innerHeight / 2 + Math.sin(a) * innerHeight));
      arrowEl.hidden = false; arrowEl.style.transform = `translate(${ex}px,${ey}px) rotate(${a + Math.PI / 2}rad)`;
    } else arrowEl.hidden = true;
  } else arrowEl.hidden = true;
}

function winLevel() {
  const g = game; g.over = true; save.done[g.n] = true; persist();
  $('#finalScore').textContent = '★ ' + (g.score || 0);
  sfx.win(); confetti(); arrowEl.hidden = true;
  setTimeout(() => { if (game === g) $('#win').hidden = false; }, 900);
}
function confetti() {
  const c = $('#confetti'); c.hidden = false;
  const W = c.width = Math.ceil(innerWidth / 4), H = c.height = Math.ceil(innerHeight / 4), x = c.getContext('2d');
  const bits = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: -Math.random() * H * .6, v: rand(.6, 1.6), d: rand(-.4, .4), col: ['#ffd23a', '#ff5d8f', '#5ac8ff', '#6cc63a', '#fff'][Math.random() * 5 | 0] }));
  const t0 = performance.now();
  (function f(t) {
    x.clearRect(0, 0, W, H);
    bits.forEach(b => { b.y += b.v; b.x += b.d; x.fillStyle = b.col; x.fillRect(b.x | 0, b.y | 0, 2, 2); });
    if (t - t0 < 3200 && !c.hidden) requestAnimationFrame(f); else c.hidden = true;
  })(t0);
}

$('#backBtn').addEventListener('click', () => { sfx.tap(); showMenu(); });
$('#menuBtn').addEventListener('click', () => { sfx.tap(); showMenu(); });
$('#nextBtn').addEventListener('click', () => { sfx.tap(); const n = game ? (game.n + 1) % LEVELS.length : 0; $('#win').hidden = true; $('#confetti').hidden = true; start(n); });

// Si el aparato va lento, baja la resolución para que siga fluido
let slow = 0;
function checkPerf(dt) {
  if (dt > 1 / 40) slow++; else slow = Math.max(0, slow - 1);
  if (slow > 90 && pixelRatio > 1) { pixelRatio = Math.max(1, pixelRatio - .5); renderer.setPixelRatio(pixelRatio); resize(); slow = 0; }
}
let last = performance.now();
function loop(now) {
  const raw = (now - last) / 1000, dt = Math.min(.05, raw); last = now;
  if (game) { checkPerf(raw); step(dt); renderer.render(scene, camera); }
  requestAnimationFrame(loop);
}
resize();
requestAnimationFrame(loop);
showMenu();
window.LEON_READY = true;   // la pantalla de carga ya se puede quitar
window.__dbg = { proto, bakeSkinned, THEMES, qdino };
window.__hole = { renderer, scene, camera, inside, start, step, render: () => renderer.render(scene, camera), get game() { return game; } };
})();
</script>
