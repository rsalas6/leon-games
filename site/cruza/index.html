<script>
// Pantalla de carga de LEÓN GAMES: dura al menos ~2.6 s; en los juegos 3D espera a que terminen de cargar los modelos
// (la barra muestra el avance real). Tocar la pantalla la salta solo cuando ya no hay nada cargando.
(() => {
  const el = document.getElementById('leonIntro'), bar = el.querySelector('.li-bar i'), t0 = performance.now();
  const MIN = matchMedia('(prefers-reduced-motion: reduce)').matches ? 800 : 2600;
  let gone = false;
  const ready = () => !window.LEON_WAIT || window.LEON_READY;
  const done = () => { if (gone) return; gone = true; bar.style.width = '100%'; setTimeout(() => el.classList.add('out'), 150); setTimeout(() => el.remove(), 700); };
  (function tick() {
    if (gone) return;
    const t = performance.now() - t0, timeP = Math.min(1, t / MIN);
    const p = window.LEON_WAIT ? Math.min(timeP, .1 + .9 * (window.LEON_READY ? 1 : (window.LEON_PROGRESS || 0) * .95)) : timeP;
    bar.style.width = Math.max(6, p * 100) + '%';
    if ((t >= MIN && ready()) || t > 25000) done(); else setTimeout(tick, 100);
  })();
  // El toque que salta la intro no debe llegar a los botones de atrás
  el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (ready()) done(); });
  ['click', 'pointerup', 'touchend'].forEach(ev => el.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); }));
})();
</script>

<script>/* Modelos 3D (glTF) compartidos: se cargan una vez y se clonan; funcionan sin internet porque se guardan con la app */
const MODELS = {};
function loadModels(names, base) {
  const loader = new THREE.GLTFLoader();
  let done = 0; const tick = () => { done++; window.LEON_PROGRESS = done / names.length; };
  return Promise.all(names.map(n => MODELS[n] ? (tick(), Promise.resolve()) : new Promise(res => {
    loader.load(base + n + '.glb', g => { tick();
      // Los juegos usan colores "tal cual" (sin conversión de color), así que las texturas también se leen tal cual,
      // y los materiales pasan a Lambert: luz suave, barata para el iPad y pareja con el resto del mundo
      g.scene.traverse(o => {
        if (!o.isMesh) return;
        o.castShadow = true; o.receiveShadow = true;
        // Pesos del esqueleto en decimales (vienen como enteros 0-255/65535 y Three r128 no los convierte al calcular poses a mano)
        const sw = o.geometry && o.geometry.attributes.skinWeight;
        if (sw && sw.normalized && !(sw.array instanceof Float32Array)) {
          const max = sw.array instanceof Uint8Array ? 255 : 65535, f = new Float32Array(sw.array.length);
          for (let i = 0; i < f.length; i++) f[i] = sw.array[i] / max;
          o.geometry.setAttribute('skinWeight', new THREE.BufferAttribute(f, sw.itemSize));
        }
        // glTF guarda los colores en espacio lineal; los juegos pintan los colores tal cual, así que se regresan a sRGB (si no, salen casi negros)
        // Una textura que no cargó (imagen vacía) haría el objeto negro: mejor sin textura
        const okMap = mt => mt.map && mt.map.image && (mt.map.image.width || mt.map.image.naturalWidth) ? mt.map : null;
        const conv = mt => { const l = new THREE.MeshLambertMaterial({ name: mt.name, color: mt.color.clone().convertLinearToSRGB(), map: okMap(mt), skinning: !!o.isSkinnedMesh, vertexColors: mt.vertexColors }); if (l.map) l.map.encoding = THREE.LinearEncoding; return l; };
        o.material = Array.isArray(o.material) ? o.material.map(conv) : conv(o.material);
      });
      MODELS[n] = g; res();
    }, undefined, () => { tick(); console.warn('modelo no encontrado', n); res(); });
  })));
}
// Clona un modelo (con esqueleto si es animado) y lo escala para que su lado más largo mida `size`
function modelClone(name, size) {
  const src = MODELS[name]; if (!src) return new THREE.Group();
  const o = src.animations.length ? THREE.SkeletonUtils.clone(src.scene) : src.scene.clone(true);
  if (size) { const s = modelBox(o).getSize(new THREE.Vector3()); o.scale.multiplyScalar(size / Math.max(s.x, s.y, s.z)); }
  return o;
}
// Caja real del modelo: con esqueleto, la caja de la geometría no sirve (los huesos la reescalan), así que se mide con los huesos y los vértices deformados
function modelBox(o) {
  o.updateMatrixWorld(true);
  const box = new THREE.Box3(), v = new THREE.Vector3();
  let skinned = false;
  o.traverse(m => {
    if (!m.isSkinnedMesh) return; skinned = true;
    const p = m.geometry.attributes.position, step = Math.max(1, Math.floor(p.count / 300));

  hemi.intensity = night ? .5 : .85; hemi.color.setHex(night ? 0x8a9cff : 0xffffff); hemi.groundColor.setHex(T.g2); sun.intensity = night ? .35 : .75;
  Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14 }); sun.shadow.camera.updateProjectionMatrix();
  const W = COLS * 2 + 1 + 16; game.lanes = [];
  game.rows.forEach((r, i) => {
    const z = ROW_Z(i), lane = { r, i, z, things: [] }; game.lanes.push(lane);
    let col = r.type === 'road' ? 0x5a5e6e : r.type === 'river' || r.type === 'lily' ? 0x3ab0e8 : r.type === 'rail' ? 0x8a7a6a : (i % 2 ? T.g1 : T.g2);
    if (night && r.type === 'road') col = 0x3a3e4e;
    const g = new THREE.Mesh(new THREE.BoxGeometry(W, r.type === 'river' || r.type === 'lily' ? .3 : .5, 1.002), M(col, r.type === 'river' || r.type === 'lily' ? { emissive: 0x1a70b0, emissiveIntensity: .25 } : {}));
    g.position.set(0, r.type === 'river' || r.type === 'lily' ? -.35 : -.25, z); g.receiveShadow = true; world.add(g);
    // Orillas sombreadas para que se vean los bloques (estilo Crossy Road)
    const edge = new THREE.Mesh(new THREE.BoxGeometry(W, .02, .06), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: .08 })); edge.position.set(0, .01, z + .5); world.add(edge);
    if (r.type === 'road') for (let x = -W / 2; x < W / 2; x += 2) { const d = new THREE.Mesh(new THREE.BoxGeometry(.8, .02, .08), M(0xffffff)); d.position.set(x, .01, z - .5); if (game.rows[i + 1] && game.rows[i + 1].type === 'road') world.add(d); }
    if (r.type === 'rail') {
      for (let x = -W / 2; x < W / 2; x += .7) { const t = new THREE.Mesh(new THREE.BoxGeometry(.2, .06, .9), M(0x7a4a2a)); t.position.set(x, .02, z); world.add(t); }
      for (const dz of [-.25, .25]) { const rl = new THREE.Mesh(new THREE.BoxGeometry(W, .08, .06), M(0xb8bcc8)); rl.position.set(0, .08, z + dz); world.add(rl); }
      // Semáforo del tren
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(.06, .06, 1.6, 8), M(0x4a4e5a)); pole.position.set(COLS + .7, .8, z + .55); world.add(pole);
      lane.lights = []; for (const dx of [-.18, .18]) { const l = new THREE.Mesh(new THREE.SphereGeometry(.12, 10, 8), new THREE.MeshBasicMaterial({ color: 0x551111 })); l.position.set(COLS + .7 + dx, 1.5, z + .55); world.add(l); lane.lights.push(l); }
    }
    if (r.type === 'grass') {
      r.blocks.forEach(x => { const t = kenney(pick(T.trees)); fit(t, .95, rand(1.3, 2)); t.position.set(x, 0, z); t.rotation.y = rand(0, 6.3); world.add(t); });
      for (const x of [-COLS - 1.5, -COLS - 3.5, -COLS - 6, COLS + 1.5, COLS + 3.5, COLS + 6]) if (Math.random() < .7) { const t = kenney(pick(T.trees)); fit(t, 1.2, rand(1.6, 2.4)); t.position.set(x + rand(-.3, .3), 0, z); world.add(t); }
      for (let k = 0; k < 3; k++) { const f = kenney(pick(['flower_redA', 'flower_yellowA'])); fit(f, .35, .35); f.position.set(rand(-COLS, COLS), 0, z + rand(-.4, .4)); world.add(f); }
    }
    if (r.type === 'lily') r.pads.forEach(x => { const p = kenney('lily_large'); fit(p, .95, .2); p.position.set(x, -.18, z); world.add(p); lane.things.push({ x, len: 1, static: true }); });
    if (r.type === 'river') { for (let x = -W / 2 + rand(0, 3); x < W / 2; x += r.len + 1.6 + rand(0, 2.5)) { const lg = kenney(r.len > 2 ? 'log_large' : 'log'); fit(lg, r.len, .5); lg.rotation.y = 0; const b = modelBox(lg).getSize(new THREE.Vector3()); if (b.z > b.x) lg.rotation.y = Math.PI / 2; lg.position.set(x, -.25, z); world.add(lg); lane.things.push({ x, len: r.len, obj: lg }); } }
    if (r.type === 'road') { for (let x = -W / 2 + rand(0, 4); x < W / 2; x += r.gap + rand(0, 3)) { const c = mdl(pick(T.cars)); fit(c, 1.9, 1.4); const b = modelBox(c).getSize(new THREE.Vector3()); const wrap = new THREE.Group(); wrap.add(c); if (b.x < b.z) c.rotation.y = Math.PI / 2 * r.dir; else if (r.dir < 0) c.rotation.y = Math.PI; wrap.position.set(x, 0, z); world.add(wrap); if (night) { const hl = new THREE.Mesh(new THREE.CircleGeometry(.9, 16).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xfff2b0, transparent: true, opacity: .35, depthWrite: false })); hl.position.set(r.dir * 1.6, .03, 0); wrap.add(hl); } lane.things.push({ x, len: 1.7, obj: wrap }); } }
    if (r.type === 'goal') {
      // Granero rojo y arco de meta
      const barn = new THREE.Group(), red = M(0xd84a3a), wht = M(0xffffff);
      const body = new THREE.Mesh(new THREE.BoxGeometry(3.4, 2, 2.4), red); body.position.y = 1; body.castShadow = true; barn.add(body);
      const roof = new THREE.Mesh(new THREE.CylinderGeometry(1.75, 1.75, 2.5, 3, 1), M(0x7a3a2a)); roof.rotation.z = Math.PI / 2; roof.rotation.x = Math.PI / 2 * 0; roof.position.y = 2.5; roof.scale.set(1, 1, .9); roof.castShadow = true; barn.add(roof);
      const door = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.4, .05), wht); door.position.set(0, .7, 1.22); barn.add(door);
      barn.position.set(0, 0, z - 2.2); world.add(barn); game.barn = barn;
      for (const x of [-COLS, COLS]) { const p = new THREE.Mesh(new THREE.CylinderGeometry(.1, .1, 2.6, 8), M(0xffffff)); p.position.set(x, 1.3, z); world.add(p); }
      const banner = new THREE.Mesh(new THREE.BoxGeometry(COLS * 2, .5, .1), M(0xffd23a, { emissive: 0xffa800, emissiveIntensity: .3 })); banner.position.set(0, 2.5, z); world.add(banner);
    }
    // Monedas
    if ((r.type === 'grass' || r.type === 'road') && i > 2 && Math.random() < .4) { const x = Math.round(rand(-COLS + 1, COLS - 1)); if (!(r.blocks || []).includes(x)) { const c = new THREE.Mesh(new THREE.CylinderGeometry(.28, .28, .08, 18), M(0xffd23a, { emissive: 0xffa800, emissiveIntensity: .4 })); c.rotation.x = Math.PI / 2; c.position.set(x, .55, z); world.add(c); lane.coin = { x, obj: c }; } }
  });
  // Pasto detrás del inicio (para que no se vea el vacío)
  for (let i = 1; i <= 10; i++) { const g = new THREE.Mesh(new THREE.BoxGeometry(COLS * 2 + 17, .5, 1.002), M(i % 2 ? T.g1 : T.g2)); g.position.set(0, -.25, i); g.receiveShadow = true; world.add(g); for (let k = 0; k < 4; k++) { const t = kenney(pick(T.trees)); fit(t, 1.1, rand(1.4, 2.2)); t.position.set(rand(-COLS - 6, COLS + 6), 0, i); world.add(t); } }
  // Bordes oscuros a los lados: hasta ahí se puede ir
  for (const s of [-1, 1]) { const sh = new THREE.Mesh(new THREE.PlaneGeometry(10, game.rows.length + 30), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: .18, depthWrite: false })); sh.rotation.x = -Math.PI / 2; sh.position.set(s * (COLS + 5.5), .02, -game.rows.length / 2); world.add(sh); }
}

/* ---------- Empezar ---------- */
let loadingLvl = false;
async function start(n) {
  if (loadingLvl) return; const L = LEVELS[n], need = levelModels(L);
  if (need.some(m => !MODELS[m])) { loadingLvl = true; const ov = $('#lvlLoad'), bar = ov.querySelector('i'); ov.hidden = false; window.LEON_PROGRESS = 0; const iv = setInterval(() => (bar.style.width = Math.max(8, (window.LEON_PROGRESS || 0) * 100) + '%'), 100); await loadModels(need, '../models/'); clearInterval(iv); ov.hidden = true; loadingLvl = false; }
  startNow(n);
}
function startNow(n) {
  const L = LEVELS[n];
  game = { n, L, t: 0, phase: 'play', rows: buildRows(L), hearts: 5, coins: 0, best: 0, hop: null, dead: 0, safeRow: 0, camZ: 2 };
  buildWorld(L);
  const a = makeAnimal('animals/' + ANIMALS[save.animal].id, null); fit(a.userData.model, 1.25, 1.25); world.add(a); play(a, 'idle'); game.pl = { obj: a, col: 0, row: 0, x: 0, y: 0, face: Math.PI };
  a.rotation.y = Math.PI;
  paintHud();
  $('#lvl').textContent = 'NIVEL ' + (n + 1);
  $('#menu').hidden = true; $('#menuBg').hidden = true; $('#title').hidden = true; $('#win').hidden = true;
  app.hidden = false; $('#hud').hidden = false; $('#backBtn').hidden = false; $('#hint').hidden = false;
  resize(); music(true, SONG, BASS, 220); updateCamera(1); banner('¡AL GRANERO!'); sfx.go();
}
function paintHud() { const g = game; $('#goal').innerHTML = `<span class="hp">${'<i></i>'.repeat(g.hearts)}${'<i class="off"></i>'.repeat(Math.max(0, 5 - g.hearts))}</span><span class="cn"><b class="coin"></b>${g.coins}</span><span class="rw">${Math.min(g.L.rows, g.best)}/${g.L.rows}</span>`; }

/* ---------- Brincar ---------- */
let tp = null;
app.addEventListener('pointerdown', e => { tp = { x: e.clientX, y: e.clientY, t: performance.now() }; });
['pointerup', 'pointercancel'].forEach(ev => app.addEventListener(ev, e => { if (!tp) return; const dx = e.clientX - tp.x, dy = e.clientY - tp.y; tp = null; if (Math.hypot(dx, dy) < 30) return hop(0, 1); if (Math.abs(dx) > Math.abs(dy)) hop(dx > 0 ? 1 : -1, 0); else hop(0, dy < 0 ? 1 : -1); }));
addEventListener('keydown', e => { const m = { ArrowUp: [0, 1], ArrowDown: [0, -1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[e.key]; if (m && game) hop(...m); });
function hop(dx, dr) {
  const g = game, p = g.pl; if (!g || g.phase !== 'play' || g.dead > 0) return;
  if (g.hop) { g.queued = [dx, dr]; return; }
  const nr = p.row + dr, nc = Math.round(p.x) + dx, row = g.rows[nr];
  p.face = dr > 0 ? Math.PI : dr < 0 ? 0 : dx > 0 ? Math.PI / 2 : -Math.PI / 2;
  if (!row || nr < 0 || Math.abs(nc) > COLS || (row.type === 'grass' && row.blocks.includes(nc))) { p.obj.userData.squash = .6; return; } // árbol o borde
  g.hop = { fx: p.x, fz: ROW_Z(p.row), tx: nc, tz: ROW_Z(nr), t: 0, nr }; csfx.hop();
}
function landCheck() {
  const g = game, p = g.pl, lane = g.lanes[p.row], r = lane.r;
  if (r.type === 'river' || r.type === 'lily') {
    const on = lane.things.find(t => Math.abs(t.x - p.x) < t.len / 2 + .15);
    if (!on) return die('splash');
    p.ride = on; p.rideOff = p.x - on.x;
  } else p.ride = null;
  if (lane.coin && Math.abs(lane.coin.x - p.x) < .5) { world.remove(lane.coin.obj); lane.coin = null; g.coins++; csfx.coin(g.coins); burst(p.x, .6, lane.z, 8, [0xffd23a, 0xffffff], 2, .2, 3); paintHud(); }
  if (r.type === 'grass') g.safeRow = p.row;
  if (p.row > g.best) { g.best = p.row; paintHud(); }
  if (r.type === 'goal' || p.row >= g.L.rows + 1) winLevel();
}
function die(kind) {
  const g = game, p = g.pl; if (g.dead > 0) return; g.dead = 1.3; g.hearts--; p.ride = null; paintHud();
  if (kind === 'splash') { csfx.splash(); burst(p.x, .1, ROW_Z(p.row), 22, [0xffffff, 0x9ad8ff, 0x3ab0e8], 3, .25, 5); p.obj.visible = false; }
  else { csfx.squash(); burst(p.x, .4, ROW_Z(p.row), 16, [0xffffff, 0xffd23a, 0xff5d8f], 3, .25, 4); p.obj.scale.set(1.3, .25, 1.3); }
  banner(g.hearts > 0 ? '¡UPS!' : '¡OTRA VEZ!');
}
function respawn() {
  const g = game, p = g.pl;
  if (g.hearts <= 0) { startNow(g.n); return; }
  p.row = g.safeRow; p.x = clamp(Math.round(p.x), -COLS, COLS); const row = g.rows[p.row]; if (row.blocks && row.blocks.includes(p.x)) p.x = [0, 1, -1, 2, -2, 3, -3].map(d => p.x + d).find(x => !row.blocks.includes(x) && Math.abs(x) <= COLS);
  p.obj.visible = true; p.obj.scale.set(1, 1, 1); p.y = 0;
}
function winLevel() {
  const g = game; if (g.phase !== 'play') return; g.phase = 'win';
  const stars = g.hearts >= 5 ? 3 : g.hearts >= 3 ? 2 : 1; save.done[g.n] = Math.max(save.done[g.n] || 0, stars); persist();
  sfx.win(); confetti(); play(g.pl.obj, 'gallop_jump'); $('#winTxt').innerHTML = '¡LLEGASTE!<br>' + '⭐'.repeat(stars);
  setTimeout(() => { if (game === g) $('#win').hidden = false; }, 1500);
}

/* ---------- Cámara ---------- */
function updateCamera(dt) {
  const g = game, p = g.pl, port = innerHeight > innerWidth;
  g.camZ = Math.min(g.camZ, ROW_Z(p.row) + 0) + 0; const fz = g.camZ - (g.camZ - ROW_Z(p.row)) * 0;
  g.cam = g.cam || new THREE.Vector3(); const want = new THREE.Vector3(clamp(p.x * .5, -2, 2) + 2.2, port ? 13 : 9.5, ROW_Z(p.row) + (port ? 7 : 6.2));
  g.cam.lerp(want, 1 - Math.pow(.03, dt)); camera.position.copy(g.cam); camera.lookAt(g.cam.x - 2.2, 0, g.cam.z - (port ? 8 : 7.2));
  sun.position.set(g.cam.x - 6, 16, g.cam.z - 2); sun.target.position.set(g.cam.x, 0, g.cam.z - 8);
}

/* ---------- Juego ---------- */
function update(dt) {
  const g = game, p = g.pl, T = THEMES[g.L.theme]; g.t += dt;
  // Coches, troncos y trenes se mueven
  for (const lane of g.lanes) {
    const r = lane.r, Wd = COLS * 2 + 1 + 16;
    if (r.type === 'road' || r.type === 'river') for (const t of lane.things) { t.x += r.dir * r.speed * dt; if (t.x > Wd / 2 + 1) t.x -= Wd + 2; if (t.x < -Wd / 2 - 1) t.x += Wd + 2; t.obj.position.x = t.x; }
    if (r.type === 'river') for (const t of lane.things) t.obj.position.y = -.25 + Math.sin(g.t * 2 + t.x) * .03;
    if (r.type === 'rail') {
      r.t += dt; const ph = r.t % r.period, warn = ph > r.period - 1.8, run = ph < 1.1;
      lane.lights.forEach((l, k) => l.material.color.setHex((warn || lane.train) && Math.floor(g.t * 6 + k) % 2 ? 0xff3030 : 0x551111)); // parpadea antes y mientras pasa el tren
      if (warn && !lane.warned && Math.abs(lane.i - p.row) < 8) { lane.warned = true; csfx.train(); }
      if (run && !lane.train) { lane.warned = false; lane.train = { x: -24, dir: 1 }; const tr = new THREE.Group(); const loco = mdl('k/train-locomotive'); fit(loco, 3, 1.8); const b = modelBox(loco).getSize(new THREE.Vector3()); if (b.z > b.x) loco.rotation.y = Math.PI / 2; tr.add(loco); for (let k = 1; k < 4; k++) { const w = mdl('k/train-wagon'); fit(w, 3, 1.6); if (b.z > b.x) w.rotation.y = Math.PI / 2; w.position.x = -k * 3.1; tr.add(w); } tr.position.set(-24, 0, lane.z); world.add(tr); lane.train.obj = tr; csfx.horn(); }
      if (lane.train) { lane.train.x += 26 * dt; lane.train.obj.position.x = lane.train.x; if (lane.train.x > 36) { world.remove(lane.train.obj); lane.train = null; } }
    }
  }
  // Brinco
  if (g.hop) {
    const h = g.hop; h.t = Math.min(1, h.t + dt / .15);
    p.x = h.fx + (h.tx - h.fx) * h.t; p.y = Math.sin(h.t * Math.PI) * .55; const z = h.fz + (h.tz - h.fz) * h.t; p.obj.position.set(p.x, p.y, z);
    if (h.t >= 1) { g.hop = null; p.row = h.nr; p.x = h.tx; p.y = 0; p.obj.userData.squash = .5; landCheck(); if (g.queued && g.dead <= 0) { const q = g.queued; g.queued = null; hop(...q); } }
  } else if (g.dead <= 0) {
    // Arriba de un tronco: se va con él
    if (p.ride) { p.x = p.ride.x + p.rideOff; if (Math.abs(p.x) > COLS) { p.x = Math.sign(p.x) * COLS; p.rideOff = p.x - p.ride.x; if (Math.abs(p.rideOff) > p.ride.len / 2 + .1) die('splash'); } } // en la orilla se queda quieto mientras el tronco pasa
    p.obj.position.set(p.x, p.ride ? -.05 : 0, ROW_Z(p.row));
  }
  // Coches y trenes chocan
  if (g.dead <= 0 && g.phase === 'play') {
    const lane = g.lanes[p.row], pz = p.obj.position.z;
    if (Math.abs(pz - lane.z) < .4) {
      if (lane.r.type === 'road' && p.y < .4) for (const t of lane.things) if (Math.abs(t.x - p.x) < t.len / 2 + .2) { die('squash'); break; }
      if (lane.train && lane.train.x > p.x - .5 && lane.train.x - 13 < p.x + .5) die('squash');
    }
  }
  if (g.dead > 0) { g.dead -= dt; if (g.dead <= 0) respawn(); }
  // Mirar a donde brinca, aplastarse un poquito al caer
  turnTo(p.obj, p.face, dt);
  const sq = p.obj.userData.squash || 0; p.obj.userData.squash = Math.max(0, sq - dt * 4); if (g.dead <= 0) p.obj.scale.set(1 + sq * .15, 1 - sq * .2, 1 + sq * .15);
  if (g.phase === 'win') p.obj.position.y = Math.abs(Math.sin(g.t * 6)) * .5;
  for (const lane of g.lanes) if (lane.coin) lane.coin.obj.rotation.z += dt * 3;
  p.obj.userData.mixer.update(dt); updateParts(dt); updateCamera(dt);
}
const wrapA = a => Math.atan2(Math.sin(a), Math.cos(a));
function turnTo(o, a, dt, sp = 14) { o.rotation.y += wrapA(a - o.rotation.y) * Math.min(1, dt * sp); }

/* ---------- Menú ---------- */
function buildMenu() {
  const ch = $('#chars'); ch.innerHTML = '';
  ANIMALS.forEach((a, i) => { const b = document.createElement('button'); b.className = 'px chr' + (i === save.animal ? ' on' : ''); b.setAttribute('aria-label', a.name); b.innerHTML = `<img alt="" src="../img/cruza/pc-${a.id}.webp">`; b.addEventListener('click', () => { save.animal = i; persist(); sfx.tap(); buildMenu(); }); ch.appendChild(b); });
  const box = $('#levels'); box.innerHTML = '';
  let next = LEVELS.findIndex((_, n) => !save.done[n]); if (next < 0) next = 0;
  LEVELS.forEach((L, n) => {
    const b = document.createElement('button'); b.className = 'px lv' + (n === next ? ' next' : ''); b.setAttribute('aria-label', 'Nivel ' + (n + 1) + ' ' + THEMES[L.theme].name);
    const st = save.done[n] ? '<span class="stars">' + '<i></i>'.repeat(save.done[n] === true ? 1 : save.done[n]) + '</span>' : '';
    b.innerHTML = `<img alt="" src="../img/cruza/cc-${L.theme}.webp"><b>${n + 1}</b><span class="nm">${THEMES[L.theme].name}</span>${st}`;
    b.addEventListener('click', () => { sfx.tap(); start(n); }); box.appendChild(b);
  });
}
function showMenu() {
  music(false); if (world) { scene.remove(world); world = null; }
  game = null; app.hidden = true; $('#win').hidden = true; $('#confetti').hidden = true; $('#hud').hidden = true; $('#hint').hidden = true;
  $('#menu').hidden = false; $('#menuBg').hidden = false; $('#backBtn').hidden = true; $('#title').hidden = false; $('#winTxt').textContent = '¡LO LOGRASTE!';
  buildMenu();
}
$('#backBtn').addEventListener('click', () => { sfx.tap(); showMenu(); });
$('#menuBtn').addEventListener('click', () => { sfx.tap(); showMenu(); });
$('#againBtn').addEventListener('click', () => { sfx.tap(); start(game.n); });
$('#nextBtn').addEventListener('click', () => { sfx.tap(); start((game.n + 1) % LEVELS.length); });
let last = performance.now();
(function loop(t) { const dt = Math.min(.05, (t - last) / 1000); last = t; if (game && !app.hidden) { update(dt); renderer.render(scene, camera); } requestAnimationFrame(loop); })(last);
resize(); showMenu();
window.__cruza = { start, update, hop, LEVELS, render: () => renderer.render(scene, camera), get game() { return game; } };
window.LEON_READY = true;

})();
</script>
