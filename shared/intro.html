<div id="leonIntro" aria-hidden="true">
  <div class="li-scene"></div>
  <div class="li-top">
    <div class="li-title"><span>L</span><span>E</span><span class="li-o">O</span><span>N</span></div>
    <div class="li-sub">GAMES</div>
  </div>
  <div class="li-load">
    <div class="li-bar"><i></i></div>
    <div class="li-label">CARGANDO...</div>
  </div>
</div>
<style>
@font-face{font-family:'Press Start 2P';font-style:normal;font-weight:400;font-display:block;src:url(__UP__vendor/fonts/press-start-2p-latin.woff2) format('woff2')}
#leonIntro{--li-ink:#2a1f3d;--li-sun:#ffd23a;--li-sky:#8fd8ff;position:fixed;inset:0;z-index:9999;overflow:hidden;background:var(--li-sky);font-family:'Press Start 2P',ui-monospace,monospace;color:#fff;transition:opacity .45s;-webkit-user-select:none;user-select:none;touch-action:none}
#leonIntro.out{opacity:0}
.li-scene{position:absolute;inset:-2%;background:url(__UP__img/leon-loading.webp) 56% 100%/cover no-repeat;image-rendering:pixelated;animation:li-zoom 3.4s ease-out both}
.li-scene::after{content:'';position:absolute;inset:0;background:linear-gradient(rgba(42,31,61,.38),rgba(42,31,61,0) 42%)}
.li-top{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + max(5vh,18px));display:flex;flex-direction:column;align-items:center;gap:min(2.4vw,16px)}
.li-title{display:flex;gap:.08em;font-size:min(15vw,13vh,112px);padding-top:.3em;line-height:1;color:var(--li-sun);text-shadow:.07em 0 0 var(--li-ink),-.07em 0 0 var(--li-ink),0 .07em 0 var(--li-ink),0 -.07em 0 var(--li-ink),.07em .14em 0 var(--li-ink),0 .2em 0 rgba(0,0,0,.25)}
.li-title span{display:inline-block;position:relative;opacity:0;transform:translateY(-140%);animation:li-drop .5s steps(5,end) forwards}
.li-o::before{content:'';position:absolute;left:44%;top:-.3em;width:.16em;height:.16em;background:var(--li-sun);box-shadow:.16em -.16em 0 var(--li-sun);filter:drop-shadow(.05em 0 0 var(--li-ink)) drop-shadow(-.05em 0 0 var(--li-ink)) drop-shadow(0 .05em 0 var(--li-ink)) drop-shadow(0 -.05em 0 var(--li-ink))}
.li-title span:nth-child(1){animation-delay:.25s}
.li-title span:nth-child(2){animation-delay:.4s}
.li-title span:nth-child(3){animation-delay:.55s}
.li-title span:nth-child(4){animation-delay:.7s}
.li-sub{font-size:min(5.2vw,5.2vh,44px);letter-spacing:.35em;padding-left:.35em;text-shadow:.12em 0 0 var(--li-ink),-.12em 0 0 var(--li-ink),0 .12em 0 var(--li-ink),0 -.12em 0 var(--li-ink),.12em .24em 0 var(--li-ink);opacity:0;animation:li-blink .6s steps(2,end) 1s forwards}
.li-load{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + max(3vh,14px));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;width:min(60vw,380px)}
.li-bar{width:100%;height:min(4.4vw,22px);box-sizing:border-box;padding:4px;background:var(--li-ink);box-shadow:0 0 0 4px #fff,0 0 0 8px var(--li-ink)}
.li-bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--li-sun) 0 calc(10% - 4px),transparent calc(10% - 4px) 10%);animation:li-fill 2.6s steps(10,end) .2s forwards}
.li-label{font-size:min(3.2vw,18px);letter-spacing:.12em;text-shadow:2px 0 0 var(--li-ink),-2px 0 0 var(--li-ink),0 2px 0 var(--li-ink),0 -2px 0 var(--li-ink);animation:li-pulse .8s steps(2,end) infinite}
@keyframes li-zoom{from{transform:scale(1.08)}to{transform:none}}
@keyframes li-drop{to{opacity:1;transform:none}}
@keyframes li-blink{to{opacity:1}}
@keyframes li-fill{to{width:100%}}
@keyframes li-pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){#leonIntro *{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
<script>
// Pantalla de carga de LEÓN GAMES (pixel art): dura ~3.1 s; tocar la pantalla la salta
(() => {
  const el = document.getElementById('leonIntro');
  let gone = false;
  const done = () => { if (gone) return; gone = true; el.classList.add('out'); setTimeout(() => el.remove(), 500); };
  setTimeout(done, matchMedia('(prefers-reduced-motion: reduce)').matches ? 900 : 3100);
  // El toque que salta la intro no debe llegar a los botones de atrás: la capa sigue atrapando toques mientras se desvanece
  el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); done(); });
  ['click', 'pointerup', 'touchend'].forEach(ev => el.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); }));
})();
</script>
